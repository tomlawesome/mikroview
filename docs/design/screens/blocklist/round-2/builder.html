<html lang="en">
<head>

<title>MikroView — Block known-bad addresses on rb5009 (#1360, round 2)</title>
<style>
/* Tokens: frontend/src/app.css (Atlas II), as the wizard's shell.css carries them. Round 1's sheet, carried forward; round 2's changes are marked. */
:root {
  --bg: #06080e; --bg-elevated: #0f1422; --bg-hover: rgba(160, 185, 230, 0.08);

  --fg: #e9eefb; --fg-muted: #97a4c4; --fg-dim: #55628a; --accent: #9db8e8;

  --warn: #f28a1e; --caution: #e8e04d; --marked: #a78bfa; --natted: #2dd4bf;
  --fall-nat: #9b3fc9; --lane-guest: #d76a9e;
  --accent-bg: color-mix(in srgb, var(--accent) 12%, transparent);
  --font-sans: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  /* one ink per list, kept everywhere it appears (wizard DESIGN.md, "One ink per thing") */
  --ink-spamhaus: var(--drop); --ink-et: var(--marked); --ink-cins: var(--natted); --ink-own: var(--log);
  --ink-push: var(--fall-nat); --ink-off: var(--fg-dim);

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }

.mono { font-family: var(--font-mono); }

/* ---- the page frame: wizard.css's .page, .bar, .striprow, .rail, .main, .body, .foot ---- */
.page { position: fixed; inset: 0; display: grid; grid-template-rows: 48px 14px 1fr; grid-template-columns: 236px 1fr; }
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px; }

.att i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-dim); }

.att.push { color: var(--ink-push); border-color: color-mix(in srgb, var(--ink-push) 45%, transparent); } .att.push i { background: var(--ink-push); }
.att.spamhaus { color: var(--ink-spamhaus); border-color: color-mix(in srgb, var(--ink-spamhaus) 40%, transparent); } .att.spamhaus i { background: var(--ink-spamhaus); }
.att.own { color: var(--ink-own); border-color: color-mix(in srgb, var(--ink-own) 40%, transparent); } .att.own i { background: var(--ink-own); }
.att.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); } .att.warn i { background: var(--warn); }
.bar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; font: 12px var(--font-mono); color: var(--fg-dim); }
.bar .right .live { color: var(--accept); }
.striprow { grid-column: 1 / -1; padding: 0 20px; display: flex; gap: 3px; align-items: center; }
.striprow i { flex: 1; height: 3px; border-radius: 2px; background: var(--accept); opacity: 0.85; }
.striprow i.dim { background: var(--fg-dim); opacity: 0.5; }

.rail { grid-column: 1; grid-row: 3; border-right: 1px solid var(--border); padding: 14px 8px; overflow-y: auto; }
.rail.dim { opacity: 0.45; }
.rail .h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); padding: 6px 10px 8px; }

.step-row:hover { background: var(--bg-hover); }
.step-row.current { background: var(--bg-elevated); border-color: var(--border); color: var(--fg); }
.step-n { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex: none; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); font-size: 11px; color: var(--fg-muted); }
.step-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step-title { font-size: 13px; }
.step-receipt { font-size: 11px; line-height: 1.4; color: var(--fg-muted); }
.step-row.done .step-n { border-color: var(--ink); color: var(--ink); }
.step-row.done .step-receipt { color: var(--ink); }
.step-row.chosen .step-n { border-color: var(--log); color: var(--log); }
.step-row.chosen .step-receipt { color: var(--log); }
.step-row.off .step-n { border-style: dashed; color: var(--fg-dim); }
.step-row.off .step-receipt { color: var(--fg-dim); }

.main { grid-column: 2; grid-row: 3; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
.body { min-height: 0; overflow: hidden; padding: 20px 32px 16px 36px; display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 30px; row-gap: 10px; }
.body.one { grid-template-columns: minmax(0, 720px); }
.body .head { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }

.body .hint b { color: var(--fg); font-weight: 500; }
.body .vline { margin: 0; font: 11.5px var(--font-mono); color: var(--fg-dim); } /* round 2: the version line */
.body .vline b { color: var(--fg-muted); font-weight: 500; }
.col { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.col.left { overflow-y: auto; padding-right: 4px; gap: 8px; }
.col.right { overflow-y: auto; gap: 7px; }
.foot { display: flex; align-items: center; gap: 12px; padding: 12px 36px; border-top: 1px solid var(--border); background: var(--bg-elevated); }
.foot .fhint { margin-left: auto; font-size: 12.5px; color: var(--fg-muted); }
.page button:not(.step-row):not(.linkish):not(.primary):not(.seg button) { border-radius: 5px; padding: 7px 13px; font-size: 13px; background: transparent; border: 1px solid var(--border); color: var(--fg-muted); }
.page button.primary { border-radius: 5px; padding: 7px 13px; font-size: 13px; background: var(--accent); border: 1px solid var(--accent); color: var(--bg); font-weight: 600; white-space: nowrap; }
.page button.linkish { background: none; border: 0; padding: 0; color: var(--log); text-decoration: underline; font-size: inherit; }

/* ---- the list cards ---- */
.lcard { border: 1px solid var(--border); border-radius: 8px; background: transparent; padding: 10px 14px 11px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.lcard.on { border-color: color-mix(in srgb, var(--ink) 45%, transparent); }
.lcard.off { padding-bottom: 10px; }
.lcard .top { display: flex; align-items: center; gap: 10px; }
.lcard .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); flex: none; }
.lcard.off .dot { background: transparent; border: 1px dashed var(--ink-off); }

.lcard.off h4 { color: var(--fg-muted); font-weight: 500; }
.lcard .top .seg { margin-left: auto; }
.seg button { white-space: nowrap; }
.page button { white-space: nowrap; }

.lcard .factsrow { font: 11.5px var(--font-mono); color: var(--fg-dim); margin-top: -3px; }

.lcard .guide { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--fg-muted); }
.lcard .guide b { color: var(--fg); font-weight: 500; }
.lcard.off .guide { color: var(--fg-dim); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: none; }
.seg button { border: 0; border-radius: 0; padding: 5px 11px; background: transparent; color: var(--fg-muted); font-size: 12.5px; }

.seg button.on { background: var(--accent-bg); color: var(--fg); }
.seg button.on.no { background: transparent; color: var(--log); }
.seg.sm button { padding: 3px 9px; font-size: 12px; }
.seg button small { font-size: 10px; color: var(--fg-dim); margin-left: 4px; font-family: var(--font-mono); } /* round 2: a version tag on a choice */
.choices { display: grid; grid-template-columns: 92px auto 1fr; gap: 6px 12px; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); }
.ch { display: contents; }
.ch .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); }
.ch small { font-size: 11.5px; line-height: 1.35; color: var(--fg-dim); min-width: 0; }
.ch small b { color: var(--fg-muted); font-weight: 500; }
.ch .seg { justify-self: start; }

/* round 2: the folded "considered and left out" record under the cards */
details.more { flex: none; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 2px; }
details.more summary { cursor: pointer; font-size: 12.5px; color: var(--fg-muted); list-style: none; display: flex; gap: 8px; align-items: baseline; }
details.more summary::before { content: '▸'; color: var(--fg-dim); font-size: 11px; }
details[open].more summary::before { content: '▾'; }

/* ---- the block, the observation, the ledger ---- */
.blockhead { display: flex; align-items: baseline; gap: 10px; }
.blockhead h5 { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg); }
.blockhead .n { font-size: 12px; color: var(--fg-muted); }
.blockhead .live { margin-left: auto; font: 11px var(--font-mono); color: var(--now); white-space: nowrap; }
.page pre { margin: 0; align-self: stretch; padding: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; text-indent: 1.1em hanging each-line; color: var(--fg); }
.page pre.script { max-height: 198px; overflow-y: auto; flex-shrink: 0; }
.col.right { gap: 8px; }
.sec { color: var(--fg-dim); user-select: none; }

pre .k { color: var(--log); }
pre .fold { color: var(--fg-dim); font-style: italic; }
pre .v { color: var(--now); } /* round 2: the version-dependent token, in the time ink */
.copyrow { display: flex; align-items: center; gap: 12px; }
.copyrow .note { font-size: 12px; color: var(--fg-muted); }
.obs { font-size: 12.5px; line-height: 1.5; padding: 8px 12px; border-left: 2px solid var(--fg-dim); color: var(--fg-muted); border-radius: 0 4px 4px 0; background: var(--bg-hover); }
.obs.waiting { border-left-color: var(--now); }
.obs b { color: var(--fg); font-weight: 500; }
.warnbox { align-self: stretch; border: 1px solid var(--warn); border-left-width: 3px; background: rgba(242, 138, 30, 0.08); color: var(--fg); padding: 12px 14px; border-radius: 6px; font-size: 13.5px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
.warnbox b { color: var(--warn); font-weight: 600; }
.warnbox pre { font-size: 12px; }
.warnbox p { margin: 0; }
.ledgerh { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
.ledgerh h5 { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg); }
.ledgerh span { font-size: 12px; color: var(--fg-muted); }
.ledger { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 6px; }
.ledger .row { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px 10px; align-items: baseline; padding: 7px 12px; border-top: 1px solid var(--border); font-size: 12.5px; }
.ledger .row:first-child { border-top: 0; }
.ledger .row .r { font-size: 11.5px; color: var(--fg-muted); }
.ledger .row .step-n.done { border-color: var(--ink); color: var(--ink); }
.ledger .row .r.done { color: var(--ink); }
.ledger .row .step-n.wait { border-color: var(--now); color: var(--now); }
.ledger .row .r.wait { color: var(--now); }
.ledger .row .step-n.skip { border-style: dashed; color: var(--fg-dim); }
.ledger .row .r.skip { color: var(--fg-dim); }
.ledger .row .skip s { text-decoration-color: var(--fg-dim); }
.ledger .undo { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
.ledger .undo pre { font-size: 11px; line-height: 1.5; }
.ledger .undo .note { margin: 0; font-size: 11.5px; color: var(--fg-muted); }
.ledger .undo .note b { color: var(--fg); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div class="page" id="page"></div>
<script>
/* One data story: rb5009, the wizard's router (round-15 engine: RouterOS 7.24.4, push every 20 min).
   ?ros=7.24.4 (default) · ?ros=7.19.4 (an older supported router: the choices and the block differ)
   ?ros=7.12.1 (below MikroView's floor of 7.18) · ?more=1 (the considered-and-left-out record open)
   ?undo=1 (the Spamhaus undo lines open). */
const q = new URLSearchParams(location.search);
const ROS = q.get('ros') || '7.24.4';
const REVIEWED = '7.24.4';
const [maj, min] = ROS.split('.').map(Number);
const atLeast = (a, b) => maj > a || (maj === a && min >= b);
const SUPPORTED = atLeast(7, 18);
const HAS_DAYS = atLeast(7, 24);          // scheduler "days" (7.24)
const REDIRECTS_DEFAULT = atLeast(7, 22); // fetch follows 2 redirects by default (7.22); 7.18–7.21 set it
const HAS_BREAK = atLeast(7, 22);         // :break / :continue in loops (7.22)
const MORE = q.get('more') === '1', UNDO = q.get('undo') === '1';
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function seg(opts, on, small) {
  return `<div class="seg ${small ? 'sm' : ''}">${opts.map(o => `<button type="button" class="${o.v === on ? 'on' : ''} ${o.v === on && o.no ? 'no' : ''}">${o.l}${o.tag ? `<small>${o.tag}</small>` : ''}</button>`).join('')}</div>`;
}
const yesno = on => seg([{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'Not now', no: true }], on);
function choice(k, s, hint) { return `<div class="ch"><span class="k">${k}</span>${s}<small>${hint}</small></div>`; }

/* ---- the catalogue: three lists (round-2/catalogue.md) ---- */
function cardSpamhaus() {
  const refresh = seg([{ v: '6h', l: '6 h' }, { v: 'daily', l: 'daily' }, { v: 'weekly', l: 'weekly' }], 'daily', true);
  return `<section class="lcard on" style="--ink: var(--ink-spamhaus)" aria-label="Spamhaus DROP">
    <div class="top"><span class="dot"></span><h4>Spamhaus DROP</h4>${yesno('yes')}</div>
    <div class="factsrow"><b>1,692</b> ranges + 91 IPv6 · 100 KB · barely moves · false positives <b>rare</b> · spamhaus.org · credited</div>
    <p class="guide">Whole netblocks Spamhaus says carry <b>no legitimate traffic</b> — hijacked space and criminal hosting. MikroView already flags from it, so what the router drops and what MikroView flags stay the same.</p>
    <div class="choices">
      ${choice('block', seg([{ v: 'from', l: 'from them' }, { v: 'both', l: 'both ways' }], 'from', true), 'Inbound is enough — nothing on your LAN talks to hijacked space on purpose.')}
      ${choice('ipv6 too', seg([{ v: 'yes', l: 'yes' }, { v: 'no', l: 'no' }], 'yes', true), 'DROPv6, 91 ranges, the same terms. Harmless on an IPv4-only router: nothing matches.')}
      ${choice('log the drops', seg([{ v: 'yes', l: 'yes' }, { v: 'no', l: 'no' }], 'yes', true), 'Each drop reaches MikroView as a line naming the list; a home WAN sees a few an hour.')}
      ${choice('refresh', refresh, 'Spamhaus asks for at least an hour apart; daily is plenty for a list that barely moves.')}
    </div></section>`;
}
function cardET() {
  const opts = [{ v: 'daily', l: 'daily' }];
  if (HAS_DAYS) opts.push({ v: 'weekdays', l: 'weekdays', tag: '7.24' });
  opts.push({ v: 'weekly', l: 'weekly' });
  const on = HAS_DAYS ? 'weekdays' : 'daily';
  return `<section class="lcard on" style="--ink: var(--ink-et)" aria-label="Emerging Threats compromised IPs">
    <div class="top"><span class="dot"></span><h4>Emerging Threats compromised IPs</h4>${yesno('yes')}</div>
    <div class="factsrow"><b>633</b> hosts · 9 KB · rebuilt on weekdays · false positives <b>some</b> · emergingthreats.net · BSD</div>
    <p class="guide">Single hosts seen attacking in the last few days. Churns, and a cleaned-up host stays listed a while, so a <b>drop is occasionally an innocent server</b> — MikroView shows each one. It flags from this list already.</p>
    <div class="choices">
      ${choice('block', seg([{ v: 'from', l: 'from them' }, { v: 'both', l: 'both ways' }], 'both', true), '<b>Both ways</b> here: a LAN device talking <em>to</em> one of these is the finding.')}
      ${choice('log the drops', seg([{ v: 'yes', l: 'yes' }, { v: 'no', l: 'no' }], 'yes', true), 'Keep it on here: an outbound drop is the line you want to see.')}
      ${choice('refresh', seg(opts, on, true), HAS_DAYS ? 'The list is rebuilt once a day on weekdays, so <b>weekdays</b> fetches when there is something new.' : 'What Emerging Threats recommends; the list is rebuilt about once a day.')}
    </div></section>`;
}
function cardCINS() {
  return `<section class="lcard off" style="--ink: var(--ink-cins)" aria-label="CINS Army">
    <div class="top"><span class="dot"></span><h4>CINS Army</h4>${yesno('no')}</div>
    <div class="factsrow"><b>15,000</b> hosts · 213 KB · changes hourly · false positives <b>some</b> · cinsscore.com · free</div>
    <p class="guide">Hosts their sensors saw scanning or attacking, kept to addresses <b>not already on other lists</b>. Big — a minute or more to load on a small router — and worth it only if rb5009 exposes SSH, a VPN or a web service; with nothing exposed, the default firewall drops these anyway. MikroView does not flag from it.</p>
  </section>`;
}
const more = `<details class="more" ${MORE ? 'open' : ''}><summary>Considered and left out — fourteen lists<span class="cat">catalogue reviewed 2026-09-30</span></summary><ul>
  <li><b>ET Block-IPs</b><span>98% of it is Spamhaus DROP; the rest is DShield's non-commercial data</span></li>
  <li><b>FireHOL level 1</b><span>holds 10.0.0.0/8 and 192.168.0.0/16 — dropped first in raw, it would drop your LAN</span></li>
  <li><b>abuse.ch Feodo, SSLBL</b><span>empty since Operation Endgame; deprecated 2025</span></li>
  <li><b>abuse.ch ThreatFox, URLhaus</b><span>need a personal key, not-for-profit terms; domains and URLs, not addresses</span></li>
  <li><b>DShield top 20</b><span>non-commercial licence; whole /24s, one of them Google Cloud</span></li>
  <li><b>blocklist.de, GreenSnow</b><span>no licence stated by the source; 29,000 entries</span></li>
  <li><b>Binary Defense</b><span>non-commercial licence</span></li>
  <li><b>ipsum</b><span>re-publishes thirty other lists under a licence it cannot grant; lags a day</span></li>
  <li><b>Team Cymru bogons</b><span>routing hygiene with private space in it, not a known-bad list</span></li>
  <li><b>Tor exit list</b><span>policy, not known-bad — blocking it outbound breaks Tor for your own devices</span></li>
  <li><b>Spamhaus ASN-DROP</b><span>lists networks by number; a router cannot act on those</span></li>
</ul></details>`;

/* ---- the block ---- */
const redirect = REDIRECTS_DEFAULT ? '' : ' <span class="v">http-max-redirect-count=2</span>';
const etSched = HAS_DAYS ? 'interval=1d <span class="v">days=mon,tue,wed,thu,fri</span> start-time=04:31:00' : 'interval=1d start-time=04:31:00';
const loopNote = HAS_BREAK ? 'each line through <span class="v">:deserialize from=json</span>, a bad line skipped with <span class="v">:continue</span>' : 'each line through <span class="v">:deserialize from=json</span>, a bad line skipped with an <span class="v">:onerror</span> flag';
const block = `<span class="sec" style="--ink: var(--ink-push)"># 1 · <b>The push</b> — updated once for every list: raw rules join the rule table it sends; lists named mv-bl-* are sent as a count (guarded: sets the script the wizard made)</span>
/system script set [find name=mikroview-push] source="<span class="k">…</span>"
<span class="fold">   4 lines changed of 61: /ip/firewall/raw joins the rule kinds · address lists matching mv-bl-* become {"list","count","changed"} · wizardVersion 5</span>
<span class="sec" style="--ink: var(--ink-spamhaus)"># 2 · <b>Spamhaus DROP</b> — the fetch-and-load script (guarded: adds once, then sets)</span>
