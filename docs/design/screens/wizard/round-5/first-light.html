<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MikroView setup — First light (round 5 prototype)</title>
<style>
/* Round 5, direction V — "First light". A clickable prototype of the
   whole setup, driven by a simulated router. Tokens are the app's own
   (frontend/src/app.css). Everything under .proto-bar is prototype
   furniture, not product. */
:root {
  --bg: #06080e; --bg-elevated: #0f1422; --bg-hover: rgba(160,185,230,0.08);
  --border: rgba(160,185,230,0.13); --border-strong: rgba(160,185,230,0.28);
  --fg: #e9eefb; --fg-muted: #97a4c4; --fg-dim: #55628a;
  --accent: #9db8e8; --accent-bg: rgba(157,184,232,0.12);
  --accept: #3ecf7e; --accept-bg: rgba(62,207,126,0.12);
  --drop: #f5a623; --warn: #f28a1e; --warn-bg: rgba(242,138,30,0.12);
  --reject: #ef4444; --reject-bg: rgba(239,68,68,0.12);
  --font-sans: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-sans); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---- frame ---- */
.frame { position: fixed; inset: 0; display: grid; grid-template-rows: 56px 1fr; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); background: rgba(6,8,14,0.7); backdrop-filter: blur(6px); z-index: 3; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg-muted); font-size: 13px; }
.brand b { color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.brand .sep { color: var(--fg-dim); }
.rail { display: flex; align-items: center; gap: 10px; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); }
.rail span { transition: color 300ms; }
.rail .dot { color: var(--fg-dim); opacity: 0.6; }
.rail .now { color: var(--fg); }
.rail .done { color: var(--accept); }
.rail .done::before { content: '✓ '; }
.top-right { justify-self: end; display: flex; align-items: center; gap: 18px; }
.context { font-size: 12.5px; color: var(--fg-muted); font-family: var(--font-mono); }
.context .chg { background: none; border: none; padding: 0; text-decoration: underline; color: var(--accent); font-family: var(--font-sans); font-size: 12.5px; }
.leave { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--fg-muted); font-size: 13px; }
.leave:hover { background: var(--bg-hover); color: var(--fg); }

/* ---- stage: canvas behind, column in front ---- */
.stage { position: relative; overflow: hidden; }
.canvas { position: absolute; inset: 0; }
.canvas svg { width: 100%; height: 100%; display: block; }
.column { position: absolute; top: 0; bottom: 0; left: 0; width: 46%; min-width: 520px; max-width: 720px; padding: 48px 48px 96px 56px; overflow-y: auto; }
.column::-webkit-scrollbar { width: 6px; } .column::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.column.wide { width: 54%; max-width: 820px; }
.column.center { left: 50%; transform: translateX(-50%); width: 720px; }

.view { animation: viewIn 380ms ease-out both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
h1 small { display: block; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 14px; }
.lead { margin: 0 0 28px; font-size: 16px; line-height: 1.6; color: var(--fg-muted); max-width: 560px; }
.lead b { color: var(--fg); font-weight: 500; }
.note { font-size: 12.5px; color: var(--fg-dim); margin: 10px 0 0; line-height: 1.55; }
.quiet { color: var(--fg-muted); }

/* ---- the sentence form ---- */
.sentence { font-size: 22px; line-height: 2.1; color: var(--fg); max-width: 600px; margin: 6px 0 22px; }
.sentence .f { display: inline-block; position: relative; margin: 0 2px; }
.f input { width: var(--w, 11ch); min-width: 4ch; background: none; border: none; border-bottom: 2px solid var(--border-strong); border-radius: 0; padding: 0 4px 1px; font: 21px/1.3 var(--font-mono); color: var(--accent); outline: none; transition: border-color 200ms, width 120ms; text-align: center; }
.f input::placeholder { color: var(--fg-dim); font-family: var(--font-sans); font-size: 19px; }
.f input:focus { border-bottom-color: var(--accent); }
.f.ok input { border-bottom-color: rgba(62,207,126,0.55); }
.f input[type=password] { letter-spacing: 0.25em; }
.hint { min-height: 22px; font-size: 13px; color: var(--fg-muted); margin: -8px 0 18px; transition: opacity 200ms; opacity: 0; }
.hint.show { opacity: 1; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); font-size: 15px; }
.opt .tag { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); margin-left: 4px; }
.opt .sub { color: var(--fg-dim); font-size: 12.5px; margin-left: auto; text-align: right; max-width: 280px; }
.switch { position: relative; width: 40px; height: 22px; border-radius: 11px; background: var(--border-strong); border: none; padding: 0; flex: none; transition: background 200ms; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: transform 200ms; }
.switch[aria-checked=true] { background: var(--accent); }
.switch[aria-checked=true]::after { transform: translateX(18px); background: var(--bg); }

/* ---- buttons ---- */
.btn { border: 1px solid var(--border-strong); background: var(--bg-elevated); border-radius: 8px; padding: 10px 18px; font-size: 14.5px; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled { background: var(--fg-dim); border-color: var(--fg-dim); color: var(--bg); cursor: not-allowed; opacity: 0.6; }
.btn.lg { padding: 14px 30px; font-size: 16px; border-radius: 10px; }
.btn.xl { padding: 18px 44px; font-size: 18px; border-radius: 12px; }
.btn.copied { background: var(--accept); border-color: var(--accept); color: #04140a; }
.link { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
.link.quiet { color: var(--fg-muted); font-size: 13.5px; }
.actions { display: flex; align-items: center; gap: 18px; margin-top: 26px; flex-wrap: wrap; }
.actions .why { font-size: 12.5px; color: var(--fg-dim); }

/* ---- the paste ---- */
.block { position: relative; border: 1px solid var(--border-strong); border-radius: 10px; background: #0a0e18; font: 13px/1.6 var(--font-mono); color: var(--fg); padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 78px; overflow: hidden; transition: max-height 320ms ease; }
.block.open { max-height: 440px; overflow: auto; }
.block::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(transparent, #0a0e18); pointer-events: none; }
.block.open::after { display: none; }
.fold { display: flex; align-items: center; gap: 14px; margin: 8px 0 18px; font-size: 13px; color: var(--fg-muted); }
.copyrow { display: flex; align-items: center; gap: 20px; }
.caption { margin: 14px 0 0; font-size: 13px; color: var(--fg-muted); line-height: 1.55; max-width: 560px; }
.caption b { color: var(--fg); font-weight: 500; }

/* ---- evidence ---- */
.evidence { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.evidence li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: baseline; font-size: 15px; animation: evIn 420ms ease-out both; }
@keyframes evIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.evidence .mk { color: var(--accept); font-weight: 600; }
.evidence li.wait .mk { color: var(--fg-dim); }
.evidence li.bad .mk { color: var(--reject); }
.evidence li.warn .mk { color: var(--warn); }
.evidence .t { font: 12px var(--font-mono); color: var(--fg-dim); }
.evidence .sub { display: block; font-size: 13px; color: var(--fg-muted); margin-top: 2px; }
.evidence .sub b { color: var(--fg); font-weight: 500; }
.pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--fg-dim); vertical-align: middle; margin-right: 2px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.1); } }
.badge { display: inline-block; font: 11px/1 var(--font-mono); letter-spacing: 0.04em; padding: 4px 7px; border-radius: 5px; border: 1px solid; vertical-align: middle; margin-left: 6px; }
.badge.ok { color: var(--accept); border-color: rgba(62,207,126,0.4); background: var(--accept-bg); }
.badge.warn { color: var(--warn); border-color: rgba(242,138,30,0.45); background: var(--warn-bg); }

/* nothing yet? drawer */
.drawer { border-top: 1px solid var(--border); margin-top: 22px; padding-top: 18px; animation: viewIn 300ms ease-out both; }
.drawer h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); }
.drawer ul { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.drawer li { display: flex; gap: 10px; font-size: 13.5px; color: var(--fg-muted); line-height: 1.5; }
.drawer li .m { flex: none; width: 14px; }
.drawer li.ok .m { color: var(--accept); } .drawer li.cross .m { color: var(--reject); } .drawer li.q .m { color: var(--fg-dim); }
.drawer code { font: 12.5px var(--font-mono); color: var(--fg); }

/* ---- tune ---- */
.rules { list-style: none; margin: 0 0 22px; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.rules li { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--border); background: rgba(15,20,34,0.55); }
.rules li:first-child { border-top: none; }
.rules li.off { opacity: 0.45; }
.rules .chk { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--border-strong); background: none; padding: 0; display: grid; place-items: center; color: var(--bg); font-size: 12px; }
.rules li:not(.off) .chk { background: var(--accent); border-color: var(--accent); }
.rules .r1 { font-size: 14px; color: var(--fg); }
.rules .r1 code { font: 12.5px var(--font-mono); color: var(--accent); }
.rules .r2 { font-size: 12.5px; color: var(--fg-muted); }
.rules .pre { font: 12px var(--font-mono); color: var(--fg-dim); text-align: right; }
.rules .pre b { display: block; color: var(--fg-muted); font-weight: 500; }
.already { font-size: 13px; color: var(--fg-muted); margin: 0 0 14px; }
.already code { font: 12px var(--font-mono); color: var(--accept); }

/* ---- done ledger ---- */
.ledger { list-style: none; margin: 0 0 22px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ledger li { border-left: 2px solid var(--accept); padding: 6px 0 6px 16px; }
.ledger li.skipped { border-left-color: var(--fg-dim); }
.ledger .h { font-size: 15px; color: var(--fg); display: flex; gap: 14px; align-items: baseline; }
.ledger .h .undo { margin-left: auto; font-size: 12.5px; color: var(--fg-dim); background: none; border: none; text-decoration: underline; padding: 0; }
.ledger .h .undo:hover { color: var(--accent); }
.ledger .e { font: 12.5px var(--font-mono); color: var(--accept); }
.ledger li.skipped .e { color: var(--fg-dim); font-family: var(--font-sans); }
.undo-box { margin: 10px 0 6px; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: rgba(15,20,34,0.6); animation: viewIn 240ms ease-out both; }
.undo-box h5 { margin: 0 0 6px; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); }
.undo-box p { margin: 0 0 10px; font-size: 13.5px; color: var(--fg-muted); }
.undo-box .btn.danger { border-color: var(--reject); color: var(--reject); background: none; padding: 7px 14px; font-size: 13.5px; }
.undo-box pre { margin: 0 0 8px; font: 12.5px/1.6 var(--font-mono); color: var(--fg); white-space: pre-wrap; }
.undo-box .row { display: flex; gap: 14px; align-items: center; }
.undo-box .row .btn { padding: 7px 14px; font-size: 13.5px; }
.undo-box .row .note { margin: 0; }

/* ---- first light flash ---- */
.flash { position: absolute; left: 62%; top: 20%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; }
.flash.go { animation: flash 3200ms ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: translate(-50%,-46%) scale(0.98); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }
.flash b { display: block; font-size: 44px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); text-shadow: 0 0 40px rgba(157,184,232,0.55); }
.flash span { font: 13px var(--font-mono); color: var(--fg-muted); letter-spacing: 0.06em; }

/* ---- canvas pieces ---- */
.mv-glow { fill: url(#mvGlow); }
.node-mv { fill: #0f1422; stroke: var(--accent); stroke-width: 1.5; }
.node-mv-core { fill: var(--accent); }
.lbl { font: 13px var(--font-sans); fill: var(--fg); }
.lbl.mono { font: 12px var(--font-mono); fill: var(--fg-muted); }
.lbl.dim { fill: var(--fg-dim); }
.lbl.big { font-size: 16px; font-weight: 600; }
.router-body { fill: #0c111c; stroke: var(--border-strong); stroke-width: 1.5; stroke-dasharray: 5 5; transition: stroke 600ms, fill 600ms; }
.router-body.named { stroke-dasharray: none; stroke: var(--fg-dim); }
.router-body.lit { stroke: var(--accent); fill: #0f1422; }
.port { fill: #0a0e18; stroke: var(--border); stroke-width: 1; transition: fill 400ms, stroke 400ms; }
.port.on { fill: var(--accept); stroke: var(--accept); }
.port.wan { fill: var(--accent); stroke: var(--accent); }
.led { fill: var(--fg-dim); opacity: 0.35; }
.led.on { fill: var(--accept); opacity: 1; animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.link { fill: none; stroke: var(--fg-dim); stroke-width: 1.5; stroke-dasharray: 4 6; opacity: 0.55; transition: opacity 400ms, stroke 600ms; }
.link.drawn { stroke: var(--accent); stroke-dasharray: 600; stroke-dashoffset: 600; opacity: 1; animation: draw 1400ms ease-out forwards; }
.link.flow { stroke: var(--accent); stroke-dasharray: none; opacity: 0.7; animation: none; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.particle { fill: var(--accent); opacity: 0; }
.particle.go { opacity: 0.95; }
.branch { fill: none; stroke: var(--border-strong); stroke-width: 1.2; opacity: 0; transition: opacity 500ms; }
.branch.on { opacity: 1; }
.iface { opacity: 0; transition: opacity 500ms; }
.iface.on { opacity: 1; }
.iface rect { fill: #0f1422; stroke: var(--border-strong); rx: 6; }
.iface.wan rect { stroke: var(--accent); }
.iface text.n { font: 600 12.5px var(--font-mono); fill: var(--fg); }
.iface text.d { font: 11.5px var(--font-sans); fill: var(--fg-muted); }
.cloud { opacity: 0; transition: opacity 600ms; }
.cloud.on { opacity: 1; }
.cloud path { fill: none; stroke: var(--fg-dim); stroke-width: 1.2; }
.rulestrip rect { fill: var(--border-strong); transition: fill 300ms; }
.rulestrip rect.log { fill: var(--accept); }
.rulestrip rect.sug { fill: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.rulestrip { opacity: 0; transition: opacity 500ms; }
.rulestrip.on { opacity: 1; }
.counter { font: 600 22px var(--font-mono); fill: var(--fg); }
.counter-l { font: 11px var(--font-sans); fill: var(--fg-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.hidden { display: none !important; }

/* ---- prototype furniture ---- */
.proto-bar { position: fixed; right: 16px; bottom: 14px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 1px dashed rgba(245,166,35,0.5); border-radius: 8px; background: rgba(6,8,14,0.85); font-size: 12px; color: var(--drop); z-index: 5; }
.proto-bar select { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 5px; padding: 3px 6px; font-size: 12px; color: var(--fg); }
.proto-bar button { background: none; border: 1px solid var(--border-strong); border-radius: 5px; padding: 3px 9px; font-size: 12px; color: var(--fg-muted); }
.proto-bar b { letter-spacing: 0.08em; text-transform: uppercase; font-size: 10.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .link.drawn { stroke-dashoffset: 0; }
  .particle { display: none; }
}
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="brand"><b>MikroView</b><span class="sep">·</span><span>Setup</span></div>
    <nav class="rail" aria-label="Setup progress" id="rail"></nav>
    <div class="top-right">
      <div class="context" id="context"></div>
      <button type="button" class="leave" aria-label="Leave setup">✕ Leave setup</button>
    </div>
  </header>

  <div class="stage">
    <div class="canvas" aria-hidden="true">
      <svg viewBox="0 0 1400 760" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="mvGlow"><stop offset="0" stop-color="#9db8e8" stop-opacity="0.35"/><stop offset="1" stop-color="#9db8e8" stop-opacity="0"/></radialGradient>
          <radialGradient id="routerGlow"><stop offset="0" stop-color="#9db8e8" stop-opacity="0.22"/><stop offset="1" stop-color="#9db8e8" stop-opacity="0"/></radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
        </defs>

        <!-- MikroView -->
        <g id="mv" transform="translate(820 400)">
          <circle class="mv-glow" r="120"/>
          <circle class="node-mv" r="30"/>
          <circle class="node-mv-core" r="7"><animate attributeName="r" values="6;8;6" dur="2.6s" repeatCount="indefinite"/></circle>
          <text class="lbl big" x="0" y="66" text-anchor="middle">MikroView</text>
          <text class="lbl mono" x="0" y="86" text-anchor="middle" id="mv-addr">192.168.13.15:8080</text>
          <g id="mv-counter" class="hidden">
            <text class="counter" x="0" y="-62" text-anchor="middle" id="lines">0</text>
            <text class="counter-l" x="0" y="-46" text-anchor="middle">log lines received</text>
          </g>
        </g>

        <!-- the link -->
        <path id="linkpath" class="link" d="M 850 400 C 940 400, 980 400, 1050 400"/>
        <g id="particles"></g>

        <!-- the router -->
        <g id="router" transform="translate(1150 400)">
          <circle id="router-glow" r="150" fill="url(#routerGlow)" opacity="0"><animate attributeName="opacity" values="0;0" dur="1s" fill="freeze"/></circle>
          <rect id="router-body" class="router-body" x="-100" y="-34" width="200" height="68" rx="10"/>
          <g id="ports"></g>
          <circle id="led" class="led" cx="-84" cy="-18" r="3"/>
          <text class="lbl big" x="0" y="-52" text-anchor="middle" id="router-name">your router</text>
          <text class="lbl mono" x="0" y="60" text-anchor="middle" id="router-addr"></text>
          <text class="lbl mono dim" x="0" y="80" text-anchor="middle" id="router-ver"></text>
          <g class="rulestrip" id="rulestrip" transform="translate(-84 96)"></g>
          <text class="lbl dim" id="rulestrip-l" x="0" y="124" text-anchor="middle" style="opacity:0;font-size:11.5px"></text>
        </g>

        <!-- interfaces fan -->
        <g id="ifaces"></g>
        <path id="cloud-br" class="branch" d="M 1310 266 L 1310 215"/>
        <g id="cloud" class="cloud" transform="translate(1310 175)">
          <path d="M -34 12 a 14 14 0 0 1 8 -26 a 20 20 0 0 1 38 -6 a 16 16 0 0 1 12 32 z"/>
          <text class="lbl dim" x="0" y="34" text-anchor="middle" style="font-size:11.5px">internet</text>
        </g>
      </svg>
      <div class="flash" id="flash"><b>First light</b><span id="flash-t"></span></div>
    </div>

    <div class="column" id="column"></div>
  </div>
</div>

<div class="proto-bar" role="group" aria-label="Prototype controls">
  <b>Prototype</b>
  <label>scenario <select id="scenario">
    <option value="happy">happy path</option>
    <option value="wrongaddr">router sends from another address</option>
    <option value="ahead">RouterOS ahead of review</option>
  </select></label>
  <label>speed <select id="speed"><option value="1">1×</option><option value="3">3×</option></select></label>
  <button type="button" id="restart">Restart</button>
</div>

<script>
/* ----------------------------------------------------------------------
   One data story (rounds 3-5): MikroView at 192.168.13.15:8080; the
   router rb5009 at 192.168.13.1, other address 192.168.254.1; the
   afternoon from 14:02. The router reports RouterOS 7.24.4 (7.25.1 in
   the ahead-of-review scenario). Nothing here is asked that the router
   can tell us.
---------------------------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, kids = []) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  for (const k of kids) n.appendChild(k);
  return n;
};

const story = {
  mv: '192.168.13.15:8080',
  tokenUntil: '14:17',

  tune: `<div class="undo-box"><h5>On the router</h5><p>Nothing to undo on MikroView — the rules are the router's. These lines switch logging back off for the ${state.chosen.size} rules tagged today.</p><pre>${[...state.chosen].map(i => { const s = story.suggestions[i]; return `/ip firewall filter set [find comment="${s.comment}"] log=no log-prefix=""`; }).join('\n')}</pre><div class="row"><button type="button" class="btn">Copy</button></div></div>`,
  backup: `<div class="undo-box"><h5>On MikroView</h5><p>Stops accepting ${state.name}'s backups. The ones already kept stay.</p><button type="button" class="btn danger">Undo</button>
    <h5 style="margin-top:14px">On the router</h5><pre>/system scheduler remove [find name=mv-backup]
/system script remove [find name=mv-backup]</pre><div class="row"><button type="button" class="btn">Copy</button><p class="note">Optional — MikroView cannot tell whether it ran.</p></div></div>`,
}[which]);

/* ---------------- wiring ---------------- */
const hints = { 'f-name': 'How the router appears everywhere in MikroView. Letters, digits, dashes.', 'f-addr': 'MikroView opens the log port for this address only, until the router\'s first line arrives. Get it wrong and the picture stays dark — and MikroView says which address knocked instead.', 'f-mv': 'The address the router has to reach. A proxy, a second interface or a mapped port would change it; from this browser it is what you see.', 'f-pass': '' };
function wire(c) {
  c.querySelectorAll('input').forEach(i => {
    i.addEventListener('focus', () => { const h = $('#hint'); if (h) { h.textContent = hints[i.id] || ''; h.classList.add('show'); } });
    i.addEventListener('blur', () => { const h = $('#hint'); if (h) h.classList.remove('show'); });
    i.addEventListener('input', () => {
      if (i.id === 'f-name') state.name = i.value.trim();
      if (i.id === 'f-addr') state.addr = i.value.trim();
      if (i.id === 'f-pass') state.pass = i.value;
      i.style.setProperty('--w', Math.max(i.id === 'f-pass' ? 12 : i.id === 'f-addr' ? 11 : 6, i.value.length + 1) + 'ch');
      i.closest('.f').classList.toggle('ok', !!i.value);
      const go = $('#go-paste'); if (go) { const ok = state.name && state.addr && state.pass; go.disabled = !ok; go.nextElementSibling.textContent = ok ? 'One paste, then watch.' : 'A name, its address and your password to begin.'; }
      paintCanvas(); renderChrome();
    });
  });
  const sw = $('#f-backup'); if (sw) sw.addEventListener('click', () => { state.backup = !state.backup; sw.setAttribute('aria-checked', state.backup); });
  const go = $('#go-paste'); if (go) go.addEventListener('click', () => { state.stage = 'paste'; render(); });
  c.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act, b.dataset)));
  document.querySelectorAll('#context [data-act]').forEach(b => b.onclick = () => act('change'));
}
function act(a, d = {}) {
  switch (a) {
    case 'fold': state.open = !state.open; render(); break;
    case 'copy': if (state.copied) break; state.copied = true; render(); later(1600, () => { state.stage = 'watch'; render(); startRouter(); }); break;
    case 'back-tell': state.stage = 'tell'; state.copied = false; render(); break;
    case 'drawer': state.drawer = true; render(); break;
    case 'use-other': state.useOther = true; state.refused = false; state.drawer = false; render(); later(1500, () => { add({ k: 'enrol', t: story.enrol, h: 'Enrol line arrived from 192.168.254.1', sub: 'The log stream is open. Everything the router logs now lands here.' }); flash(); tickLines(); later(7000, () => { state.version = '7.24.4'; state.standing = 'reviewed'; add({ k: 'push', t: story.push, h: `First push from ${state.name}`, sub: 'push' }); if (state.backup) later(1000, () => add({ k: 'backup', t: story.backup, h: 'Nightly backup scheduled', sub: 'next run 03:00 · lands in MikroView\'s drop box' })); }); }); break;
    case 'reroll': alert('Prototype: a new token would be minted and the paste rewritten; the old one dies.'); break;
    case 'warn': state.showWarning = !state.showWarning; render(); break;
    case 'to-tune': state.stage = 'tune'; render(); break;
    case 'toggle': { const i = Number(d.i); state.chosen.has(i) ? state.chosen.delete(i) : state.chosen.add(i); render(); break; }
    case 'tune-copy': state.tuneCopied = true; render(); later(4500, () => { state.tagged = true; render(); }); break;
    case 'tune-skip': state.tuneSkipped = true; state.stage = 'done'; render(); break;
    case 'to-done': state.stage = 'done'; render(); break;
    case 'undo': state.undoOpen = state.undoOpen === d.u ? null : d.u; render(); break;
    case 'change': state.stage = 'tell'; render(); break;
    case 'fall': alert('Prototype: this would open the fall with ' + state.name + ' already flowing.'); break;
    case 'another': alert('Prototype: the same three-line sentence again, MikroView\'s address already known.'); break;
    case 'restart': if (confirm('Prototype: forgets ' + state.name + ' on MikroView and shows the undo lines for the router. Restart the prototype?')) restart(); break;
  }
}
function restart() {
  clearTimers(); clearTimeout(lineTimer); lineTimer = null;
  Object.assign(state, { stage: 'tell', name: '', addr: '', pass: '', backup: true, useOther: false, copied: false, open: false, evidence: [], drawer: false, refused: false, version: null, standing: null, showWarning: false, chosen: new Set([0, 1, 2, 3, 4]), tuneCopied: false, tagged: false, tuneSkipped: false, undoOpen: null, lines: 0 });
  $('#lines').textContent = '0';
  render();
}
$('#restart').addEventListener('click', restart);
$('#scenario').addEventListener('change', restart);
document.querySelector('.leave').addEventListener('click', () => alert('Prototype: closes setup. Where setup stands reopens it from the router\'s page.'));

// A prefilled walk-through for the prototype: ?demo puts the story's values in.
if (location.search.includes('demo')) Object.assign(state, { name: 'rb5009', addr: '192.168.13.1', pass: 'correct horse' });
render();
</script>
