# Go test-coverage floors, one per package. Read by scripts/coverage-floor.py
# (#1333, ported from birdcage's script of the same name), which runs against
# `go test ./... -race -coverprofile=...` in the `test:go` job in
# .gitlab-ci.yml, on every merge request and on push to dev.
#
# STATEMENT coverage, not branch coverage -- Go's own toolchain has no branch-
# coverage mode. A package at 100% here means every line ran at least once,
# not that every condition was tried both ways.
#
# This is a RATCHET, not a fixed target:
#   - each floor below is set at the value measured on 2026-09-27, rounded
#     DOWN to a whole percent (from the exact fraction, not from a
#     display value already rounded to one decimal -- go test's own "X.X%"
#     output rounds, and two packages here (internal/config, internal/routeros)
#     sit just under the whole number that display would suggest) -- not at
#     70, so introducing this file does not turn the build red over coverage
#     nobody has touched.
#   - a floor only ever goes UP, when a package's coverage genuinely improves.
#     Never lower one to make a change pass -- if a change would require
#     that, the change needs more tests, not a smaller floor.
#   - scripts/coverage-floor.py also fails a package sitting more than 5
#     points ABOVE its floor (RATCHET_SLACK) -- that means the floor is
#     stale, and the fix is to raise it here to lock the gain in, not to
#     leave the headroom sitting there.
#   - the 70-85% band itself is not chased past 85%: a package already
#     inside it is done, and effort belongs on packages below 70%, not on
#     pushing an 87% package toward 100%.
#
# Measure the way test:go's script: block does, or the numbers are wrong in
# both directions -- root, uid and image all matter here (see
# docs/decisions/gitlab-ci-root-in-container-test-failure.md for a worked
# example of the same class of mismatch):
#
#   scripts/fetch-upgrade-fixtures.sh
#   useradd -m -u 10001 ci-test
#   chown -R ci-test:ci-test "$CI_PROJECT_DIR"
#   su ci-test -c "cd '$CI_PROJECT_DIR' && HOME=/home/ci-test \
#     go test ./... -race -coverprofile=coverage.out"
#   go tool cover -func=coverage.out | tail -1
#   python3 scripts/coverage-floor.py coverage.out
#
# test:go never sets MIKROVIEW_TEST_POSTGRES, so every Postgres-backed test
# in internal/persist and internal/matchlog calls t.Skip there -- #1290 found
# this first. test:postgres exercises those tests for real, against a real
# Postgres, but runs `go test -race -count=1 ./internal/persist/...
# ./internal/matchlog/...` with no `-coverprofile`, so that coverage is never
# captured anywhere. The two packages' floors below read low for that reason,
# not because the Postgres backend is untested. Capturing it is a separate
# decision, out of scope for #1333.
#
# Reproduced on 2026-09-27 with the golang:1.27.1 image and the ci-test uid
# exactly as above, via rootless Docker rather than the workstation directly
# (agent host has no sudo, so it cannot become uid 10001 on the bare host).
# One difference from a real CI checkout: the container was seeded from a
# standalone `git clone` of this branch tip rather than a bind mount of the
# worktree, because a worktree's .git is a pointer file into its parent
# checkout's object store, which does not exist inside the container -- four
# tests that shell out to `git ls-files` to enumerate their own source
# (fuzz_crasher_persistence_test.go, injection_sinks_test.go,
# style_guard_test.go) failed with "exit status 128" on a first attempt that
# copied the worktree without .git at all, for that reason and not because of
# anything in the code. The clone is a full, independent .git, which is what
# a real CI checkout also is, so this reproduces test:go's actual condition
# rather than diverging from it. First CI run on this branch is the
# confirmation that a real GitLab checkout agrees.
#
# Total: 81.7% of statements across 55 packages (81.6% measured 2026-09-24 on
# fix/v061-audit without -race, as the codex user; 81.5% on 2026-09-22, #1290)
# -- close enough that -race and the uid drop do not materially move the
# total, though they do move individual packages (see
# gitlab-ci-root-in-container-test-failure.md on why root vs. non-root
# matters to specific permission-refusal tests).
#
# scripts/coverage-floor.py also fails on any package present in the coverage
# profile but missing from this file: a new package must get a floor added
# here as a reviewed change, not slip in unmeasured. Five packages have no
# test files at all and never appear in the profile (go test does not build
# a test binary, so there is no coverage block to attribute) -- listed below
# anyway rather than silently absent, per the same rule birdcage's file
# follows.

floors:
  # --- below the 70% band: known debt ---
  .: 42                     # 42.3% measured 2026-09-27. The root `main`
                             # package -- CLI subcommand dispatch
                             # (backup_cli.go, migrate_cli.go, history.go,
                             # snapshot.go) plus main() itself. #1290 found
                             # several break-glass admin paths here at 0%
                             # (runRecoverAdminAccount,
                             # runGenerateRecoveryKeys, runTransferAdmin,
                             # readPasswordTwice, openAuthStoreForCLI,
                             # openRecoveryStoreForCLI) along with
                             # readDSNFile, openStorage and
                             # watchForCertificateReload -- these are the
                             # flows the live-check gate exercises at the
                             # integration level (AGENTS.md, "The gate
                             # blocks the merge, in CI"), not unit tests.
                             # Raising this is out of scope for #1333.
  cmd/demo-history: 0       # No test files. Dev-data seeding tool for
                             # demos (AGENTS.md, "Demos the owner
                             # reviews") -- not shipped in the release
                             # binary.
  internal/evict: 0         # No test files. #1290 (Opus 5, 2026-09-22)
                             # measured 82-87% of this package's
                             # statements exercised indirectly through its
                             # callers (internal/engine, internal/auth,
                             # internal/rules) via `-coverpkg`, but test:go
                             # does not set `-coverpkg` (#1333 is
                             # deliberately not that decision), so none of
                             # that is captured in coverage.out. Direct
                             # tests of the package's own contract remain
                             # genuinely absent; out of scope to add here.
  internal/matchlog: 58     # 58.5% measured 2026-09-27. Its Postgres-backed
                             # tests skip under test:go (see header above);
                             # test:postgres runs them for real but writes
                             # no coverage profile. Not a real regression in
                             # what test:postgres actually exercises.
  internal/persist: 62      # 62.9% measured 2026-09-27. Same cause as
                             # internal/matchlog above -- every store writes
                             # through this package, and its Postgres path
                             # (postgres.go) is the part test:go cannot see.
  scripts/routerosappendrow: 29  # 29.2% measured 2026-09-27. A CLI dev-tool
                             # under scripts/, not shipped in the release
                             # binary.
  scripts/routeroscommands: 0    # No test files. CLI dev-tool under
                             # scripts/, not shipped.
  scripts/routerosfreshness: 0   # No test files. CLI dev-tool under
                             # scripts/, not shipped.
  scripts/routerosreference: 0   # No test files. CLI dev-tool under
                             # scripts/, not shipped.

