services:
  mikroview:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # RouterOS remote-protocol=tls (RFC 5425's syslog-over-TLS port,
      # already unprivileged so no remap is needed). MikroView's only
      # syslog listener -- comment this out (and set
      # MIKROVIEW_LISTEN_SYSLOG_TLS= below) only if you want no syslog
      # ingest at all.
      - "6514:6514/tcp"
      # HTTPS by default, on the conventional port -- see README.md's
      # Quickstart and docs/configuration.md's "TLS" section.
      - "443:8080"
      # A plain-HTTP listener that only ever redirects to the HTTPS
      # port above -- never serves real content. Same non-root ->
      # unprivileged-container-port reasoning as 443 -> 8080 above.
      # Remove this mapping (and set MIKROVIEW_LISTEN_HTTP_REDIRECT=
      # "" below) if you'd rather handle the redirect at your own
      # reverse proxy.
      - "80:8081"
      # RouterOS config backups over SFTP (issue #394, optional) -- a
      # second listening port, only needed once you turn `backup:
      # enabled: true` on in config.yaml (see config.example.yaml's
      # commented `backup:` block and docs/configuration.md's "Router
      # backups" section). Uncomment this alongside that; it must match
      # `backup.listen`'s port (":47022" by default).
      # - "47022:47022/tcp"
    # Container hardening. The image is already distroless + non-root
    # (see Dockerfile), so these are defense-in-depth rather than the
    # primary control -- but they're free, and they cap what a
    # hypothetical RCE in the parser or HTTP layer could reach.
    security_opt:
      # Blocks setuid/setgid binaries from raising privileges. Nothing
      # here needs to, and the distroless image ships no such binary
      # anyway -- this makes that structural instead of incidental.
      - no-new-privileges:true
    cap_drop:
      # MikroView binds only unprivileged ports (6514/8080/8081 -- see
      # the mappings above, which is exactly why they aren't 443/80
      # inside the container), so it needs no Linux capabilities at all.
      - ALL
    # The root filesystem is read-only; every path MikroView actually
    # writes to is a mount. /var/lib/mikroview is the mikroview/data
    # bind mount below, and the distroless image has no shell or package manager
    # that would need to write anywhere else. Note it does NOT need a
    # /tmp tmpfs: every persisted store writes its temp file alongside
    # the real one inside /var/lib/mikroview (see the atomic
    # write-temp-then-rename in internal/auth, internal/flags,
    # internal/entities, internal/audit), never into /tmp.
    read_only: true
    healthcheck:
      test: ["CMD", "/mikroview", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      # One app folder on the host, two mounts: read-only for what you
      # own (config, keys, certs, GeoIP), read-write for what MikroView
      # owns. Layout and the ruling behind it: docs/decisions/app-folder.md.
      # Sample config: deploy/config.example.yaml -- copy it to
      # mikroview/config.yaml (see README.md's "Persistent data" section
      # for the permissions step data/ needs first).
      - ./mikroview:/etc/mikroview:ro
      - ./mikroview/data:/var/lib/mikroview
      # Mounting each file separately instead -- config.yaml,
      # GeoLite2-Country.mmdb, a bind-mounted data/ of its own, or the
      # mikroview-data named volume -- is the old way and still works: a
      # path set in config.yaml or the environment always wins over the
      # folder default. See docs/configuration.md.
    environment:
      - MIKROVIEW_CONFIG=/etc/mikroview/config.yaml
      # Naming MIKROVIEW_GEOIP_DB_PATH explicitly instead of dropping the
      # file into mikroview/ is the old way and still works -- see
      # docs/configuration.md.
      # Only needed to move a store somewhere other than the default
      # /var/lib/mikroview/*.json -- see docs/configuration.md.
      # - MIKROVIEW_FLAGS_STORE_PATH=/var/lib/mikroview/flags.json
      # - MIKROVIEW_AUTH_STORE_PATH=/var/lib/mikroview/users.json
      # - MIKROVIEW_ENTITIES_STORE_PATH=/var/lib/mikroview/entities.json
      # - MIKROVIEW_DEVICE_MAC_STORE_PATH=/var/lib/mikroview/mac-registry.json
      # - MIKROVIEW_ENGINE_STORE_PATH=/var/lib/mikroview/engine-state.json
      # - MIKROVIEW_ENGINE_DEFINITIONS_STORE_PATH=/var/lib/mikroview/definitions.json
      # - MIKROVIEW_AUTH_TOKENS_STORE_PATH=/var/lib/mikroview/tokens.json
      # - MIKROVIEW_AUDIT_STORE_PATH=/var/lib/mikroview/audit.json
      # - MIKROVIEW_SETUP_STORE_PATH=/var/lib/mikroview/setup.json
      # TLS is on by default and needs no configuration to work -- these
      # are only for customizing it. Your own cert and key are files you
      # mount in, so both must be readable by the container's user (uid
      # 1000) or MikroView refuses to start with "permission denied":
      #   sudo chown 1000:1000 tls.crt tls.key
      #   chmod 644 tls.crt && chmod 600 tls.key
      # - MIKROVIEW_TLS_STORE_PATH=/var/lib/mikroview/tls
      # - MIKROVIEW_TLS_HOSTS=192.168.1.50,mikroview.local
      # Naming MIKROVIEW_TLS_CERT_FILE/MIKROVIEW_TLS_KEY_FILE explicitly
      # instead of dropping certs/tls.crt + certs/tls.key into mikroview/
      # is the old way and still works -- see docs/configuration.md.
      # Read docs/configuration.md's "TLS" section before using this --
      # only safe if this port is unreachable except from your own
      # isolated-network reverse proxy.
      # - MIKROVIEW_TLS_ENABLED=false
      # Disables the plain-HTTP redirect-only listener above -- only
      # needed if you've removed the "80:8081" port mapping too (e.g.
      # your reverse proxy handles the HTTP->HTTPS redirect itself).
      # - MIKROVIEW_LISTEN_HTTP_REDIRECT=
      # Disables syslog ingest entirely -- MikroView's only syslog
      # listener is RouterOS remote-protocol=tls, so only set this if
      # you don't want firewall events at all. Remove the "6514:6514/tcp"
      # port mapping above too if you do.
      # - MIKROVIEW_LISTEN_SYSLOG_TLS=

    # No Postgres service here, deliberately -- not even commented out.
    #
    # MikroView can keep its accounts, flags and settings in Postgres
    # instead of JSON files (docs/configuration.md, "Postgres"). The only
    # reason to do that is to get your data OFF this host, so that
    # compromising the machine running MikroView doesn't hand over the
    # accounts store too.
    #
    # A Postgres container sitting next to MikroView in this file would
    # defeat that entirely: same host, same disk, and the connection
    # password right here in the same compose file the attacker already
    # has. That is strictly worse than the JSON files -- identical
    # exposure, more moving parts -- so shipping one as a convenient
    # default would make the documentation a lie.
    #
    # To use Postgres, point MikroView at a server on a DIFFERENT machine
    # over a restricted network path:
    #
    #   1. Put the connection string in a file (never in this compose
    #      file, and never in config.yaml -- it carries a password):
    #        postgres://mikroview:PASSWORD@db.internal:5432/mikroview?sslmode=verify-full
    #   2. Make it readable by the container's user -- MikroView runs as
    #      uid 1000, the first account on most Linux hosts, so a file
    #      you own is usually readable as it stands. If the file belongs
    #      to some other account, a plain `chmod 600` leaves it
    #      unreadable inside the container and MikroView refuses to
    #      start with "permission denied". Keep the tight mode and give
    #      it to that user:
    #        sudo chown 1000:1000 postgres-dsn && chmod 600 postgres-dsn
    #   3. Mount it read-only and point config.yaml's postgres.dsnFile at
    #      it, or set MIKROVIEW_POSTGRES_DSN_FILE:
    #        - ./postgres-dsn:/run/secrets/mikroview-postgres-dsn:ro
    #
    # sslmode must be require, verify-ca or verify-full; anything weaker
    # is refused at startup. Prefer verify-full -- require encrypts but
    # does not verify who you are talking to.
    #
    # MOVING TO POSTGRES IS A ONE-WAY CHOICE. MAKE IT BEFORE YOU START,
    # OR NOT AT ALL.
    #
    # Existing JSON files are migrated automatically on the first boot
    # with Postgres configured. From that moment the deployment is a
    # Postgres deployment: MikroView records the fact, and removing
    # dsnFile later will NOT bring it back on the JSON files -- it
    # refuses to start instead.
    #
    # That refusal is the point. The JSON files are frozen at the moment
    # of migration, so silently falling back to them would serve stale
    # accounts -- possibly a stale admin, possibly a password you already
    # rotated -- with nothing to indicate anything was wrong.
    #
    # What changes once you are on Postgres:
    #   - Back up the DATABASE. The JSON files stop being current the
    #     moment you migrate, so backing them up protects nothing.
    #   - The JSON-file account commands refuse to run, because they
    #     would edit files nothing reads any more.
    #
    # If you are unsure, stay on the JSON files. Going the other way
    # later is easy; coming back is not possible.
