# Copy this file to config.yaml (git-ignored) and edit for your setup:
#   cp deploy/config.example.yaml deploy/config.yaml
#
# See docs/configuration.md for the full precedence rules and
# docs/routeros-setup.md for the RouterOS-side commands that make devices
# show up here.

listen:
  # RouterOS remote-protocol=tls (RFC 5425's syslog-over-TLS port) --
  # mikroview's only syslog listener. Confidentiality for log traffic on
  # the wire, using the same certificate the HTTPS listener below
  # presents when TLS is on, or a self-generated one otherwise -- a
  # certificate is loaded for this even if tls.enabled is false, since
  # the router connects here directly. Set to "" to disable syslog
  # ingest entirely.
  syslogTls: ":6514"
  http: ":8080"
  # Redirect-only -- bounces a plain HTTP request to the HTTPS listener
  # above, never serves the app itself. Set to "" to disable (e.g. if
  # your own reverse proxy handles the HTTP->HTTPS redirect instead).
  httpRedirect: ":8081"

  # Reverse-proxy support. Leave both commented out unless a proxy
  # fronts mikroview.
  #
  # Mikroview rate-limits failed logins per source address. Behind a
  # proxy, every request carries the *proxy's* address, so without
  # trustedProxies all users share one bucket and one attacker's failed
  # attempts lock everybody out. Setting this makes mikroview read the
  # real client address out of the forwarding header instead -- but only
  # for connections that actually came from a listed proxy, since a
  # header from anyone else is just text they chose.
  #
  # Accepts bare IPs, CIDRs, or "private" (loopback + RFC1918 + CGNAT +
  # link-local + IPv6 ULA), which covers a proxy on your LAN or sharing
  # a Docker network.
  # trustedProxies: ["private"]
  #
  # Which header to read, honoured only for the peers above. The default
  # suits nginx, Caddy, Traefik, HAProxy, Cloudflare and the cloud load
  # balancers; change it for a proxy that sets something else.
  # clientIpHeader: "X-Forwarded-For"

store:
  retention: 24h
  # A memory budget, not an event count -- see docs/configuration.md's
  # "config.yaml" section for what this actually buys at your own
  # traffic rate, which varies enormously depending on which of your
  # router's rules have logging turned on.
  maxMemory: 120MiB

# Watchlist (issue #243) -- an admin-managed set of entries watching
# specific ports/sources, or a device's egress ("this should only ever
# reach X"), plus suggested entries generated from what RouterOS has
# already pushed (DHCP leases, ARP, blocked ports). Uncomment only to
# move where any of this persists or to change the match log's capacity;
# the defaults are already sensible. See docs/configuration.md's
# "Watchlist" section.
# watchlist:
#   storePath: /var/lib/mikroview/watchlist.json
#   matchLogPath: /var/lib/mikroview/matchlog.jsonl
#   matchLogCapacity: 200000    # file backend only -- no ceiling on Postgres
#   matchLogRetention: 168h     # 7 days -- Postgres backend only
#   suggestionsStorePath: /var/lib/mikroview/suggestions.json

# Leveled, colorized server log output (see docs/configuration.md's
# "Logging" section) -- level defaults to info already, uncomment only
# to change it. One of debug/info/warn/error.
# log:
#   level: info

# Optional: shows a country flag next to public IPs in the UI. Requires
# your own MaxMind GeoLite2 database -- see docs/configuration.md. Left
# unset, no flags are shown; this is never required.
# geoip:
#   dbPath: /etc/mikroview/GeoLite2-Country.mmdb

# Optional: enables AbuseIPDB in the "investigate this IP" popover
# (Shodan InternetDB is always used, no key needed). Free tier: 1000
# lookups/day. AbuseIPDB's abuse score also feeds the confidence floor
# of behavioral flags raised against the same source IP -- see
# docs/configuration.md's "IP reputation lookup" section.
# reputation:
#   abuseIPDBKey: your-abuseipdb-api-key

# Behavioral flags (port scans, activity spikes, critical-port attempts,
# volume spikes) are always on with sensible defaults -- nothing below is
# required. storePath already defaults to /var/lib/mikroview/flags.json,
# which deploy/docker-compose.yml already persists in a named volume by
# default -- only uncomment this block to move that path or change a
# threshold. See docs/configuration.md for what each threshold means.
# flags:
#   storePath: /var/lib/mikroview/flags.json
#   portScanThreshold: 15
#   portScanWindow: 60s
#   activitySpikeThreshold: 200
#   activitySpikeWindow: 60s
#   criticalPorts: [21, 22, 23, 445, 3389, 5900, 8291, 8728, 8729]
#   criticalPortThreshold: 5
#   criticalPortWindow: 5m
#   globalSpikeMultiplier: 4
#   globalSpikeMinEPS: 5
#   globalSpikeWarmupSamples: 20
#   distributedBruteForceThreshold: 10
#   distributedBruteForceWindow: 5m
#   outboundAnomalyThreshold: 25
#   outboundAnomalyWindow: 5m
#   internalReconThreshold: 10
#   internalReconWindow: 60s
#   ruleSpikeMultiplier: 5
#   ruleSpikeMinRate: 0.2
#   ruleSpikeWindow: 60s
#   ruleSpikeWarmupSamples: 20
#   repeatedDropsThreshold: 10
#   repeatedDropsWindow: 15m
#   hostActivityMultiplier: 3
#   hostActivityWarmupSamples: 20
#
#   # low_slow_scan: the scan that stays under portScanThreshold by
#   # spreading itself over hours instead of seconds. Two thresholds and
#   # a drop ratio rather than one count -- see docs/configuration.md for
#   # why "distinct ports per hour" alone was rejected as too noisy
#   # against container orchestration, health checks and browsers.
#   lowSlowScanWindow: 3h
#   lowSlowScanPortThreshold: 8
#   lowSlowScanHostThreshold: 5
#   lowSlowScanMinObservation: 45m
#   lowSlowScanDropRatio: 0.8
#   lowSlowScanBaselineMultiplier: 3
#
#   # off_hours: traffic from a host that is normally quiet at this time
#   # of day. The window is fixed rather than learned per host -- 23:00
#   # to 06:00 is a conservative default for a home or small office.
#   offHoursStartHour: 23
#   offHoursEndHour: 6
#   offHoursMinSampleDays: 14
#   offHoursMinCount: 5
#
#   # stale_rule: a firewall rule that has not matched anything in this
#   # many days, so you can retire rules that no longer do anything. The
#   # store is what makes that survive a restart.
#   ruleUsageStorePath: /var/lib/mikroview/rule-usage.json
#   staleRuleDays: 30
#   staleRuleCheckInterval: 1h
#
#   # Optional (issue #105): interface-name patterns (glob syntax --
#   # exact "wireguard1" or prefix-style "wireguard*") identifying which
#   # of RouterOS's InInterface values correspond to a configured VPN
#   # tunnel. When a port-scan/activity-spike/outbound-anomaly/internal-
#   # recon anomaly's triggering event arrived via a matching interface,
#   # its confidence score is boosted by vpnConfidenceMultiplier
#   # (clamped to 100) -- an already-authenticated remote peer behaving
#   # anomalously is a stronger signal than an ordinary LAN device doing
#   # the same. Left empty (the default), this is a complete no-op --
#   # every confidence score is unaffected. See docs/configuration.md's
#   # "VPN interface confidence boost" section.
#   vpnInterfaces: []
#   # vpnInterfaces:
#   #   - wireguard1
#   vpnConfidenceMultiplier: 1.5
#
#   # How long a *configured* device's last-seen time may go without
#   # updating before it's reported "stale" (GET /api/devices, feeds the
#   # Fleet view) and raises a device_silence flag -- a router that's
#   # crashed, rebooted, lost network, or had its syslog config wiped.
#   # Needs to sit comfortably above normal syslog gaps; 0 disables this
#   # detector entirely. See docs/configuration.md.
#   deviceStaleAfter: 15m
#
#   # Per-detector on/off + scope restrictions -- every detector defaults
#   # to enabled and unscoped; a live admin-only UI toggle can override
#   # these at runtime without a restart (persisted separately to
#   # detectorSettingsStorePath below, seeded from these values the first
#   # time that file doesn't exist yet). See docs/configuration.md's
#   # "Per-detector toggles" section for the full per-detector field
#   # table (not every detector consults every scope field) and the
#   # allow/deny + AND-combination rules.
#   detectorSettingsStorePath: /var/lib/mikroview/detector-settings.json
#   detectors:
#     critical_port:
#       enabled: true
#       scope:
#         hosts: []
#         hostsMode: ""
#         ports: []
#         portsMode: ""
#         classification: ""
#         rules: []
#         rulesMode: ""

# New-device detection: raises a flag the first time mikroview ever sees
# a given LAN client MAC address -- deterministic, no threshold to tune.
# storePath already defaults to /var/lib/mikroview/mac-registry.json
# (see deploy/docker-compose.yml for the matching volume mount) -- only
# uncomment this block to move that path. See docs/configuration.md's
# "New-device detection" section, including the WAN-side-only-ruleset
# coverage caveat.
# deviceMac:
#   storePath: /var/lib/mikroview/mac-registry.json

# internal/engine's evaluation chassis (docs/decisions/evaluation-engine.md):
# storePath persists per-definition, per-key baseline state, so a
# statistical baseline resumes warm across a restart instead of losing
# its whole warm-up. definitionsStorePath (issue #404) persists the
# definitions store -- shipped detectors, migrated watchlist
# expectations, and eventually builder-authored custom definitions, all
# in one document. Both already default under /var/lib/mikroview (see
# deploy/docker-compose.yml for the matching volume mount) -- only
# uncomment this block to move either path.
# engine:
#   storePath: /var/lib/mikroview/engine-state.json
#   definitionsStorePath: /var/lib/mikroview/definitions.json

# Local IP/CIDR blocklist matching (issue #113 Part B): raises a
# known_bad_ip flag directly when a source IP falls inside a CIDR range
# from one of the vetted feeds below -- independent of any behavioral
# threshold, and also reinforces the confidence floor of any other
# active flag for that same source IP. On by default with Spamhaus's
# DROP list (small, free, no registration, curated to only
# include netblocks Spamhaus is confident are entirely
# malicious-controlled). This is a fixed, vetted menu, not an arbitrary
# URL field -- see internal/blocklist's doc comment and
# docs/configuration.md for the full menu, why, and how the refresh
# cadence/entry-count cap were decided. Refresh is a fixed daily cycle,
# not configurable. Set sources to an empty list to disable this
# feature entirely.
# blocklist:
#   sources:
#     - spamhaus_drop
#     # - emerging_threats_compromised  # opt-in: larger, faster-changing, individual-IP list

# Optional (on by default): local IP attribution for the manual IP-lookup
# popover -- labels an address as a Tor exit, commercial VPN,
# cloud/datacenter, or privacy relay. Never raises a flag by itself for
# any category; a Tor or VPN match on an *inbound* source additionally
# reinforces an already-raised flag's confidence (direction-aware --
# your own outbound traffic through a VPN or Private Relay never
# contributes). Datacenter/privacy-relay stay display-only always. A
# fixed, vetted menu fetched at runtime (no range data ships in the
# image), refreshed daily. Default is the high-precision lists only: the
# broad datacenter/cloud feeds cover >10% of routable IPv4, so they
# attach a label to ordinary traffic and are opt-in. Set sources to an
# empty list to disable attribution (and the reinforcement) entirely.
# See docs/configuration.md for the full menu and the per-source
# trade-offs.
# netClass:
#   sources:
#     - tor                  # Tor Project's own exit list -- tiny, first-party
#     - apple_private_relay  # Apple's own egress list -- keeps Private Relay traffic out of the VPN category below
#     - x4b_vpn              # X4BNet commercial-VPN list (MIT) -- high precision
#     # - x4b_datacenter  # opt-in: broad, ~10% of IPv4, noisy as a signal
#     # - aws             # opt-in: official AWS ranges, with region detail
#     # - gcp             # opt-in: official Google Cloud ranges

# Optional: friendly display names shown in place of a raw RouterOS rule
# label (e.g. "r13") or a raw host IP, everywhere they appear in the UI
# and CSV export. Filtering/grouping still uses the raw value -- these
# are display-only. See docs/configuration.md.
# ruleNames:
#   r13: "Block known scanners"
# hostNames:
#   192.168.1.50: "Living room NAS"

# Optional: the live, UI-managed counterpart to ruleNames/hostNames
# above (Admin -> Entities, admin-only) -- a label/tags record per
# (type, key), editable with no restart, taking precedence over
# ruleNames/hostNames for any key it has a label for. storePath already
# defaults to /var/lib/mikroview/entities.json; only uncomment this
# block to move that path. The first time mikroview boots against an
# empty entities store, it imports any existing ruleNames/hostNames as
# entities automatically -- see docs/configuration.md's "Entities"
# section.
# entities:
#   storePath: /var/lib/mikroview/entities.json

# Optional: the persisted, admin-only accountability log of every admin-
# privileged mutation (user create, entity upsert/delete, token create/
# revoke, detector setting change, flag exclusion removal) -- who did it
# and when (Investigate -> Audit log, admin-only). storePath already defaults to
# /var/lib/mikroview/audit.json; only uncomment this block to move that
# path. See docs/configuration.md's "Audit log" section, including which
# flag actions are deliberately NOT logged here.
# audit:
#   storePath: /var/lib/mikroview/audit.json

# The setup wizard's ledger (#487): which setup steps were skipped or
# forced past, and by whom. Persisted because a forced-past decision is
# what explains a silence elsewhere in the interface -- an empty stream
# says which step accounts for it -- and that explanation has to survive
# the restart an upgrade brings. storePath already defaults to
# /var/lib/mikroview/setup.json; only uncomment this block to move that
# path. See docs/configuration.md's "Setup wizard ledger" section.
# setup:
#   storePath: /var/lib/mikroview/setup.json

# Local authentication. storePath already defaults to
# /var/lib/mikroview/users.json (see deploy/docker-compose.yml for the
# matching volume mount if you want it to survive container recreation,
# not just restarts).
#
# Uncomment this block to move that path, change sessionTTL, or set
# secureCookie. secureCookie is the one people come looking for: leaving
# it false while tls.enabled is true stops mikroview starting (CFG-0021),
# because the session cookie would go out without the Secure flag.
#
# The first time mikroview loads it asks you to create the admin
# account. That is the only option -- see SECURITY.md and
# docs/configuration.md's "Authentication" section.
# auth:
#   storePath: /var/lib/mikroview/users.json
#   secureCookie: true
#   sessionTTL: 24h
#   # The ceiling sessionTTL does not have: the longest a session can
#   # live from when you signed in, however often you use it. Without
#   # one, a session used even once a day never expires, so a browser
#   # left signed in on a shared machine stays valid forever. Set to 0
#   # to remove the ceiling.
#   sessionMaxLifetime: 168h  # 7 days
#   tokensStorePath: /var/lib/mikroview/tokens.json
#   # Where the one-time recovery keys and the pepper that hashes them
#   # live. Both default under the data volume, which is fine -- move
#   # recoveryPepperPath only if you want the pepper off that volume
#   # entirely, so a stolen backup of the volume does not carry the one
#   # value the recovery-key hashes are useless without.
#   recoveryKeysPath: /var/lib/mikroview/recovery.json
#   recoveryPepperPath: /var/lib/mikroview/recovery-pepper

# TLS is on by default and needs no configuration to work -- mikroview
# generates its own local CA + certificate on first start, already
# persisted to /var/lib/mikroview/tls by default. Only uncomment this
# block to move that path, or point certFile/keyFile at your own cert
# instead of generating one. See SECURITY.md and docs/configuration.md's
# "TLS" section, including the one documented reason to set
# enabled: false.
# tls:
#   enabled: true
#   certFile: ""
#   keyFile: ""
#   hosts: []
#   storePath: /var/lib/mikroview/tls

# Optional: email/push alerting on newly-raised behavioral flags,
# batched rather than one message per flag. See docs/configuration.md's
# "Notifications" section for the full field reference and the
# reasoning behind batchWindow being a fixed interval, not a debounce.
# notify:
#   batchWindow: 60s
#   # Any HTTP endpoint -- the batch is POSTed as JSON. headers is for
#   # whatever the receiver needs to authenticate the call.
#   webhook:
#     url: ""
#     headers: {}
#   smtp:
#     host: ""
#     port: 587
#     username: ""
#     password: ""
#     tlsMode: "starttls"
#     from: ""
#     to: []
#   pushover:
#     token: ""
#     user: ""

# Optional: sign in with your own identity provider instead of (or
# alongside) mikroview's local account. See docs/configuration.md's
# "Single sign-on (OIDC)" section -- publicBaseUrl is the one field
# people get wrong, and it must match the redirect URI registered with
# the provider exactly.
# oidc:
#   issuerUrl: "https://id.example.com"
#   clientId: ""
#   clientSecret: ""
#   publicBaseUrl: "https://mikroview.example.com"
#   scopes: ["openid", "profile", "email"]
#   # Everything below is an access policy. With none of it set, anyone
#   # your provider will authenticate can sign in -- which is only what
#   # you want on a provider that exists solely for this.
#   allowedGroups: []
#   groupsClaim: "groups"        # Azure commonly needs "roles"
#   allowedEmails: []
#   allowedEmailDomains: []
#   requiredClaims: {}

# Optional: keep accounts, flags, tokens and the rest in Postgres rather
# than in JSON files on this host. The only reason to do this is to get
# the data OFF this machine -- read docs/configuration.md's "Postgres"
# section first, because MOVING TO POSTGRES IS A ONE-WAY CHOICE.
#
# There is no `dsn` field, deliberately: a connection string carries a
# password, so it is read from a file you control the permissions of.
# The file must be readable by uid 65532 (the container's user):
#   chown 65532:65532 postgres-dsn && chmod 600 postgres-dsn
# postgres:
#   dsnFile: /run/secrets/mikroview-postgres-dsn

# Devices are matched by the syslog source IP mikroview sees them from.
# Sources not listed here still appear in the UI, auto-discovered and
# labelled with their IP -- add them here once you know which is which.
devices:
  - id: core-router
    name: "Core Router"
    sourceIp: 192.168.1.1
  # - id: branch-office
  #   name: "Branch Office"
  #   sourceIp: 203.0.113.5
