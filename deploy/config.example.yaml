# Copy this file to config.yaml (git-ignored) and edit for your setup:
#   cp deploy/config.example.yaml deploy/config.yaml
#
# See docs/configuration.md for the full precedence rules and
# docs/routeros-setup.md for the RouterOS-side commands that make devices
# show up here.

listen:
  syslogUdp: ":1514"
  syslogTcp: ":1514"
  http: ":8080"
  # Redirect-only -- bounces a plain HTTP request to the HTTPS listener
  # above, never serves the app itself. Set to "" to disable (e.g. if
  # your own reverse proxy handles the HTTP->HTTPS redirect instead).
  httpRedirect: ":8081"

store:
  retention: 24h
  maxEvents: 200000

# Leveled, colorized server log output (see docs/configuration.md's
# "Logging" section) -- level defaults to info already, uncomment only
# to change it. One of debug/info/warn/error.
# log:
#   level: info

# Optional: shows a country flag next to public IPs in the UI. Requires
# your own MaxMind GeoLite2 database -- see docs/configuration.md. Left
# unset, no flags are shown; this is never required.
# geoip:
#   dbPath: /etc/mikroview/GeoLite2-Country.mmdb

# Optional: enables AbuseIPDB in the "investigate this IP" popover
# (Shodan InternetDB is always used, no key needed). Free tier: 1000
# lookups/day. See docs/configuration.md. Left unset, only Shodan results
# are shown.
# reputation:
#   abuseIPDBKey: your-abuseipdb-api-key

# Behavioral flags (port scans, activity spikes, critical-port attempts,
# volume spikes) are always on with sensible defaults -- nothing below is
# required. storePath already defaults to /var/lib/mikroview/flags.json,
# which deploy/docker-compose.yml already persists in a named volume by
# default -- only uncomment this block to move that path or change a
# threshold. See docs/configuration.md for what each threshold means.
# flags:
#   storePath: /var/lib/mikroview/flags.json
#   portScanThreshold: 15
#   portScanWindow: 60s
#   activitySpikeThreshold: 200
#   activitySpikeWindow: 60s
#   criticalPorts: [21, 22, 23, 445, 3389, 5900, 8291, 8728, 8729]
#   criticalPortThreshold: 5
#   criticalPortWindow: 5m
#   globalSpikeMultiplier: 4
#   globalSpikeMinEPS: 5
#   globalSpikeWarmupSamples: 20
#   distributedBruteForceThreshold: 10
#   distributedBruteForceWindow: 5m
#   outboundAnomalyThreshold: 25
#   outboundAnomalyWindow: 5m
#   internalReconThreshold: 10
#   internalReconWindow: 60s
#   ruleSpikeMultiplier: 5
#   ruleSpikeMinRate: 0.2
#   ruleSpikeWindow: 60s
#   ruleSpikeWarmupSamples: 20
#   repeatedDropsThreshold: 10
#   repeatedDropsWindow: 15m
#   hostActivityMultiplier: 3
#   hostActivityWarmupSamples: 20
#
#   # How long a *configured* device's last-seen time may go without
#   # updating before it's reported "stale" (GET /api/devices, feeds the
#   # Fleet view) and raises a device_silence flag -- a router that's
#   # crashed, rebooted, lost network, or had its syslog config wiped.
#   # Needs to sit comfortably above normal syslog gaps; 0 disables this
#   # detector entirely. See docs/configuration.md.
#   deviceStaleAfter: 15m
#
#   # Per-detector on/off + scope restrictions -- every detector defaults
#   # to enabled and unscoped; a live admin-only UI toggle can override
#   # these at runtime without a restart (persisted separately to
#   # detectorSettingsStorePath below, seeded from these values the first
#   # time that file doesn't exist yet). See docs/configuration.md's
#   # "Per-detector toggles" section for the full per-detector field
#   # table (not every detector consults every scope field) and the
#   # allow/deny + AND-combination rules.
#   detectorSettingsStorePath: /var/lib/mikroview/detector-settings.json
#   detectors:
#     critical_port:
#       enabled: true
#       scope:
#         hosts: []
#         hostsMode: ""
#         ports: []
#         portsMode: ""
#         classification: ""
#         rules: []
#         rulesMode: ""

# New-device detection: raises a flag the first time mikroview ever sees
# a given LAN client MAC address -- deterministic, no threshold to tune.
# storePath already defaults to /var/lib/mikroview/mac-registry.json
# (see deploy/docker-compose.yml for the matching volume mount) -- only
# uncomment this block to move that path. See docs/configuration.md's
# "New-device detection" section, including the WAN-side-only-ruleset
# coverage caveat.
# deviceMac:
#   storePath: /var/lib/mikroview/mac-registry.json

# Optional: friendly display names shown in place of a raw RouterOS rule
# label (e.g. "r13") or a raw host IP, everywhere they appear in the UI
# and CSV export. Filtering/grouping still uses the raw value -- these
# are display-only. See docs/configuration.md.
# ruleNames:
#   r13: "Block known scanners"
# hostNames:
#   192.168.1.50: "Living room NAS"

# Optional: the live, UI-managed counterpart to ruleNames/hostNames
# above (Menu -> Entities, admin-only) -- a label/tags record per
# (type, key), editable with no restart, taking precedence over
# ruleNames/hostNames for any key it has a label for. storePath already
# defaults to /var/lib/mikroview/entities.json; only uncomment this
# block to move that path. The first time mikroview boots against an
# empty entities store, it imports any existing ruleNames/hostNames as
# entities automatically -- see docs/configuration.md's "Entities"
# section.
# entities:
#   storePath: /var/lib/mikroview/entities.json

# Optional: the persisted, admin-only accountability log of every admin-
# privileged mutation (user create, entity upsert/delete, token create/
# revoke, detector setting change, flag exclusion removal) -- who did it
# and when (Menu -> Audit log, admin-only). storePath already defaults to
# /var/lib/mikroview/audit.json; only uncomment this block to move that
# path. See docs/configuration.md's "Audit log" section, including which
# flag actions are deliberately NOT logged here.
# audit:
#   storePath: /var/lib/mikroview/audit.json

# Local authentication. storePath already defaults to
# /var/lib/mikroview/users.json (see deploy/docker-compose.yml for the
# matching volume mount if you want it to survive container recreation,
# not just restarts) -- only uncomment this block to move that path or
# change sessionTTL. The first time mikroview loads, it presents a
# one-time choice: create the admin account, or explicitly skip auth
# for this deployment -- see SECURITY.md and docs/configuration.md's
# "Authentication" section for that flow and how to reverse a skip
# later (CLI-only, by design).
# auth:
#   storePath: /var/lib/mikroview/users.json
#   secureCookie: true
#   sessionTTL: 24h
#   tokensStorePath: /var/lib/mikroview/tokens.json

# TLS is on by default and needs no configuration to work -- mikroview
# generates its own local CA + certificate on first start, already
# persisted to /var/lib/mikroview/tls by default. Only uncomment this
# block to move that path, or point certFile/keyFile at your own cert
# instead of generating one. See SECURITY.md and docs/configuration.md's
# "TLS" section, including the one documented reason to set
# enabled: false.
# tls:
#   enabled: true
#   certFile: ""
#   keyFile: ""
#   hosts: []
#   storePath: /var/lib/mikroview/tls

# Optional: email/push alerting on newly-raised behavioral flags,
# batched rather than one message per flag. See docs/configuration.md's
# "Notifications" section for the full field reference and the
# reasoning behind batchWindow being a fixed interval, not a debounce.
# notify:
#   batchWindow: 60s
#   smtp:
#     host: ""
#     port: 587
#     username: ""
#     password: ""
#     tlsMode: "starttls"
#     from: ""
#     to: []
#   pushover:
#     token: ""
#     user: ""

# Devices are matched by the syslog source IP mikroview sees them from.
# Sources not listed here still appear in the UI, auto-discovered and
# labelled with their IP -- add them here once you know which is which.
devices:
  - id: core-router
    name: "Core Router"
    sourceIp: 192.168.1.1
  # - id: branch-office
  #   name: "Branch Office"
  #   sourceIp: 203.0.113.5
