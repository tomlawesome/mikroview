# ============================================================
# GitLab is where mikroview is developed: branches, merge requests and
# the dev -> preview -> main promotions all happen here, and this file is
# the CI that gates them. GitHub is a read-only mirror of those three
# branches -- the `sync` stage pushes each one after a merge. Under the
# mirror rule (#1464) only publish-from-gitlab, release-on-tag and CodeQL
# run there by themselves, plus check-only secret scanning and the
# RouterOS watcher; GitHub copies the image GitLab built and signed, and
# everything else there runs by hand. #935 is the migration record; the
# general model is in the gitlab-first-migration skill.
#
# The `sync` stage is inert until the owner sets MIRROR_TO_GITHUB=true as
# a project CI/CD variable (#935 step 4). Nothing in this file sets it.
#
# The live-check gate runs here too, sharded, since #1004: the `gate`
# stage below. It used to be kept off CI on purpose -- 36 minutes holding
# one host -- and the second-host loop on `dev` (AGENTS.md, "The gate runs
# on `dev`") is still there until the CI gate has proven itself.
# ============================================================
#
# Runner: rootless-Docker executor, single group runner, untagged jobs only.
# Tool versions pinned below were verified current as of this session (Aug 2026)
# in gitlab-ci-plan/01-tool-research.md — re-check before bumping blindly.

include:
  - project: ai/agent-infra
    ref: 03499313d89b421212af02db3735662397eebfb3  # catchup-check/v2
    file: scripts/catchup-check/ci-template.yml
  - project: ai/agent-infra
    ref: 063b5b95a96b139b0a858bb009466456a19e5674  # batch-intake/v1
    file: scripts/batch-intake/ci-template.yml
  - project: ai/agent-infra
    ref: 1dca70057bd93f68ded22c6b159f315c987c1663  # dev-landing/v1
    file: scripts/dev-landing/ci-template.yml
  # The shared check for personal details (ai/agent-infra#32, #1460). The
  # ref is the commit the tag names, not the tag: a tag can be deleted and
  # created again on other code, and this template is merged into every
  # pipeline here. Adopt a new tag by moving this commit, the comment and
  # PRIVATE_DETAILS_SHA (variables: below) together, so the script the job
  # runs is the pinned one too.
  - project: ai/agent-infra
    ref: 7430d171259104c4623040c2360699585d601bf5  # private-details/v4
    file: scripts/private-details/ci-template.yml

stages:
  - lint
  - test
  - security
  - gate
  - sync
  - chr-exercise
  - renovate

# Runner lanes (#949, ai/agent-infra#3). Every job names its lane: `big`
# is gitlab-runners-01 (8 CPU / 18 GB, two at a time) and `light` is the
# 4 CPU / 6 GB runner (four at a time). A job with no matching tag does
# not run at all, so a new job must pick one. Measured peaks per job are
# on ai/agent-infra#3; anything under about 3 GB belongs on light.
default:
  tags: [big]
  # #952: a new push to the same branch cancels the still-running previous
  # pipeline instead of letting it hold a big-lane slot to the end. Jobs
  # that push, publish or post externally override this back to false
  # below, so they are never cut mid-write.
  interruptible: true

variables:
  GOFLAGS: "-mod=readonly"
  # Fallback for the catch-up and batch-intake MR pipelines: their snippet
  # workflow rules win first, so the MR rung below never sets this for them.
  NPM_CACHE_POLICY: "pull"
  # #1202: gauntlet is fetched straight from GitHub, never through the public
  # Go proxy or checksum database (resolving it there would publish the
  # version permanently). GOPRIVATE also sets GONOSUMDB.
  GOPRIVATE: "github.com/tomlawesome/gauntlet"
  # Same commit as the private-details include above (#1460).
  PRIVATE_DETAILS_SHA: 7430d171259104c4623040c2360699585d601bf5

# #1091: the only thing this workflow:rules block exists for is to set
# NPM_CACHE_POLICY per pipeline, for .npm_cache below. `when: always` is
# the catch-all rung -- every pipeline source still creates a pipeline
# exactly as it did with no workflow: block at all, so nothing about
# which pipelines run changes here, only a variable they carry.
workflow:
  rules:
    - !reference [.dev-landing, workflow_rules]
    - !reference [.catchup-check, workflow_rules]
    - !reference [.batch-intake, workflow_rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        NPM_CACHE_POLICY: "pull"
    - when: always
      variables:
        NPM_CACHE_POLICY: "pull-push"

# Scheduled pipelines exist only to carry the CHR exercise, CHR watch and
# Renovate jobs, which select themselves on $CHR_EXERCISE / $CHR_WATCH /
# $RENOVATE. Without the `never` line every schedule on dev also ran the full
# lint, test and security set -- a daily CI run for a job that reads one JSON
# file. The same jobs' on-demand path (web UI or API, same variable) was
# doing it too (#951: pipelines 358 and 362 each re-ran all of dev 357), so
# a web/API run carrying one of those variables is treated like a schedule.
# A web/API run of dev with no variable still runs everything: that is what
# "run pipeline" should mean.
.dev_or_mr: &dev_or_mr
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true" || $SIGN_TAG != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# DOCS-ONLY LANE (#1038). Until now nothing here decided what to run from
# what changed, so a typo fix in a README paid for the same ~26 jobs as a
# schema change, on runners shared with every other project.
#
# Two lists, and the order they are asked in is the whole mechanism:
#
#   *code_paths        deliberately over-broad -- every tree that is not
#                      docs/, every source extension anywhere in the repo,
#                      and every root file that is not prose. Matching too
#                      much costs one full pipeline, which is the harmless
#                      direction to be wrong in.
#   *docs_only_paths   a closed list of prose and pictures. This is the
#                      only thing in the file that can cause a skip.
#
# Every gated job asks them in that order (.dev_or_mr_code below):
#
#   1. a code path changed        -> run
#   2. else a docs path changed   -> never
#   3. else                       -> run
#
# Rule 3 is the point, and it is why the skip is opt-in rather than a
# fallback. A path in neither list -- a new top-level directory, an
# extension nobody has used here yet, an empty diff -- reaches rule 3 and
# runs the job. So do the cases where GitLab cannot compute a diff at all
# (a new branch's first push, a `web`/`api` run): `changes:` evaluates to
# true there, so rule 1 matches first and the whole pipeline runs. A gate
# that failed the other way would read green while having tested nothing,
# which is worse than having no gate.
#
# Order is also what keeps a mixed diff honest. `changes:` asks "did any
# of these change", never "did only these change", so the two lists cannot
# be collapsed into one: README.md plus main.go matches rule 1 on main.go
# and never reaches rule 2. Putting the docs list first would skip that
# merge request outright.
#
# On a merge request GitLab diffs against the merge base with the target
# branch, so a dev -> preview promotion is diffed against the preview tip:
# the accumulated batch, not the last commit. Promotions therefore see
# code and run everything, which is what a promotion has to do.
#
# Not every job is gated. AGENTS.md ("The docs-only lane") lists the ones
# that always run and why -- Go tests read docs/configuration.md, and
# test:build-checks link-checks the markdown, so prose really can fail
# them, and a leaked secret can sit in a paragraph as easily as in code.
# ---------------------------------------------------------------------------

.docs_only_paths: &docs_only_paths
  # Root-level prose. `*` does not cross a `/`, so this is README.md,
  # CHANGELOG.md, AGENTS.md and friends, not every .md in the repo.
  # THIRD-PARTY-NOTICES.md is in *code_paths below and is asked first.
  - "*.md"
  - "LICENSE"
  - "docs/**/*.md"
  # Screenshots and diagrams that documentation embeds.
  - "docs/**/*.png"
  - "docs/**/*.jpg"
  - "docs/**/*.jpeg"
  - "docs/**/*.gif"
  - "docs/**/*.webp"
  - "docs/**/*.svg"
  # The note beside a screenshot recording that a recapture came out
  # byte-for-byte identical (#1317, check-release-surfaces.sh). It is a
  # sentence about a picture, and changes nothing the code does.
  - "docs/**/*.png.checked"
  # The console transcript the weekly CHR exercise commits for the
  # RouterOS version it booted (#894, scripts/routeros-chr-open-mr.sh).
  # Same reasoning as the line above: it is a record of what a router
  # said, written after the fact, and nothing reads it back. Scoped to
  # that one tree rather than `**/*.log`, so an ordinary log file
  # appearing anywhere else still stops the guard and gets a decision.
  - "docs/routeros-verification-logs/**/*.log"
  # The frame times a design round's screenshot drive records beside its
  # shots (docs/design/screens/*/round-N/shots/times.txt, from round 11
  # on): one line per frame saying when it was taken. A record about the
  # pictures, like the .png.checked note above; nothing reads it back.
  - "docs/design/**/shots/times.txt"

.code_paths: &code_paths
  # Source extensions at any depth. These are what catch a file in a
  # directory that does not exist yet, including the mockup rounds under
  # docs/design/concepts (.html/.mjs/.py): those run the full set. That is
  # deliberate -- narrowing it would mean trusting a path list to know
  # which HTML is only a picture of an interface.
  - "**/*.go"
  - "**/*.js"
  - "**/*.cjs"
  - "**/*.mjs"
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.svelte"
  - "**/*.css"
  - "**/*.html"
  - "**/*.json"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.toml"
  - ".shellcheckrc"
  - "**/*.sh"
  - "**/*.bash"
  - "**/*.py"
  - "**/*.sql"
  - "**/*.service"
  - "**/*.timer"
  - "**/*.path"
  - "**/*.Dockerfile"
  - "**/Dockerfile"
  - "**/Makefile"
  # No root-only duplicates (`*.go` beside `**/*.go`): GitLab matches
  # with Ruby's fnmatch, where `**/` stands for zero or more directories,
  # so `**/*.go` already covers main.go at the root. A `changes:` list is
  # capped at 50 entries, and pipeline 726 refused the file at 56.
  # Every tree except docs/. A new top-level directory belongs on this
  # list the day it is created: until it is, a change inside it only
  # runs the full set on its own, and a diff pairing it with a README
  # edit would be read as documentation.
  - "brand/**/*"
  - "cmd/**/*"
  - "deploy/**/*"
  - "frontend/**/*"
  - "internal/**/*"
  - "scripts/**/*"
  - "site/**/*"
  - "supply-chain/**/*"
  - "tools/**/*"
  - "web/**/*"
  - ".claude/**/*"
  - ".github/**/*"
  - ".gitlab/**/*"
  # Root files that are not prose. THIRD-PARTY-NOTICES.md is here on
  # purpose: `*.md` would otherwise call it documentation, and it is
  # compiled into the binary (notices.go's //go:embed) and regenerated and
  # checked by test:build-checks.
  - "go.mod"
  - "go.sum"
  - "VERSION"
  - "THIRD-PARTY-NOTICES.md"
  - ".gitlab-ci.yml"
  - ".dockerignore"
  - ".gitignore"
  - ".gitleaksignore"
  - "renovate.json"
  # cosign.pub is the public half of the release signing key (#1309). It
  # has no source extension, so without this line it matches neither list
  # and the guard refuses the pipeline -- which is what happened on
  # !1089's first run. It belongs here rather than in .docs_only_paths: a
  # change to it changes what a released digest verifies against, so it
  # must never be paired with a README edit and read as documentation.
  - "cosign.pub"

# .dev_or_mr, plus the three-rule ladder described above. Everything
# .dev_or_mr does is unchanged and comes first: schedules and the
# on-demand CHR/Renovate runs still select themselves out (#951).
.dev_or_mr_code: &dev_or_mr_code
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true" || $SIGN_TAG != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code_paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *docs_only_paths
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
      changes: *code_paths
    - if: $CI_COMMIT_BRANCH == "dev"
      changes: *docs_only_paths
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"

# The same ladder for the three frontend jobs, which additionally refuse to
# run without frontend/package.json. `exists:` and `changes:` in one rule
# are ANDed, and the guard has to be repeated on every rung rather than
# merged in from .dev_or_mr_code, which is why this block exists at all.
.dev_or_mr_code_frontend: &dev_or_mr_code_frontend
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true" || $SIGN_TAG != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
      changes: *code_paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
      changes: *docs_only_paths
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
      changes: *code_paths
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
      changes: *docs_only_paths
      when: never
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]

# Every job that shells out to git needs this. `go build` stamps VCS metadata
# by running git, and git refuses a repository owned by another user unless it
# is marked safe — which failed the whole lint stage with nothing but
# "error obtaining VCS status: exit status 128" to go on (#908).
#
# The likely owner mismatch is our own doing: test:go chowns $CI_PROJECT_DIR to
# ci-test, and the runner reuses its build directory between pipelines, so a
# later job running as root meets a checkout owned by uid 10001. test:go now
# hands ownership back, but marking the directory safe is the durable half —
# it costs nothing and does not depend on that cleanup having run.
#
# The check below exists because the Go wrapper swallows git's actual message.
# If git is still unusable, fail here with the real error rather than three
# stages later with a riddle.
# Batch intake (ai/agent-infra#114, decision 60a): heavy jobs skip an MR into
# batch-a/batch-b; the full pipeline runs once, on batch to dev.
.dev_or_mr_heavy: &dev_or_mr_heavy
  rules:
    - !reference [.batch-intake, job_rule]
    - !reference [.dev_or_mr, rules]

.dev_or_mr_code_heavy: &dev_or_mr_code_heavy
  rules:
    - !reference [.batch-intake, job_rule]
    - !reference [.dev_or_mr_code, rules]

.dev_or_mr_code_frontend_heavy: &dev_or_mr_code_frontend_heavy
  rules:
    - !reference [.batch-intake, job_rule]
    - !reference [.dev_or_mr_code_frontend, rules]

# #1472: the two pipelines that publish the product image -- a push to
# preview (a dev -> preview promotion landing) and a push of a v* release
# tag. Build once, test the built bytes, promote by digest: build:image
# builds the image a single time, every later job handles that build's
# image.tar, and publish:image / sign:release-digest / publish:channel put
# exactly that digest into this project's registry. Jobs that also run on
# merge requests and dev add these rules beside their .dev_or_mr* ones;
# the publish jobs run on these alone. Not docs-gated: a release is never
# skipped because its last commit touched prose.
.publish_ref:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "preview"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]/'

.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      if ! git rev-parse --git-dir >/dev/null 2>&1; then
        echo "git cannot read the checkout at $CI_PROJECT_DIR. Real error:"
        git status || true
        exit 1
      fi

# Shared npm cache (#1091), keyed on the lockfile so a dependency bump
# invalidates it rather than serving stale node_modules. `npm ci` still
# runs in every job below -- it is fast against a warm node_modules and
# is what actually keeps the tree honest against the lockfile -- this
# only saves each of them a cold npm-registry fetch. Policy comes from
# NPM_CACHE_POLICY (set above in workflow:rules): pull-push on dev, so
# the cache a merge request pulls stays warm; pull-only on a merge
# request, so an unreviewed branch can never write back and poison what
# dev or another MR pulls next.
#
# Only for jobs that run as root (the node:26 images). The live-check
# image runs as `node`, and a cache the root jobs saved is restored
# root-owned into a node-user job, so its `npm ci` fails with EACCES on
# the first rmdir (#1098). Those jobs fetch cold; it costs them ~11 s.
.npm_cache_entry: &npm_cache_entry
  key:
    files:
      - frontend/package-lock.json
  paths:
    - frontend/node_modules/
  policy: $NPM_CACHE_POLICY

.npm_cache: &npm_cache
  cache: *npm_cache_entry

# #1304 item E7: the comment above explains why gate:scenarios,
# gate:scripts and perf:promotion cannot use .npm_cache above -- they run
# the live-check image as its own `node` user (uid 1000, fixed by
# live-check.Dockerfile), and that cache is written by the root-running
# node:26 jobs. This is the same node_modules path under a key those
# root jobs never touch (`prefix`, not the bare lockfile hash), so the
# two caches never collide and every job that pulls or pushes it runs as
# the same uid. A plain entry, not wrapped in a `cache:` key like
# .npm_cache above, because gate:scenarios' three engines need it
# alongside other fields in one list rather than merged in as a whole
# job (see .gate_scenarios_shard below).
.live_check_npm_cache_entry: &live_check_npm_cache_entry
  key:
    prefix: live-check
    files:
      - frontend/package-lock.json
  paths:
    - frontend/node_modules/
  policy: $NPM_CACHE_POLICY

# #1304 item E6: test:build-checks and security:licence-policy each curl
# and untar the same pinned Go tarball from go.dev on every run. Keyed on
# go.mod so a toolchain bump invalidates it, same convention as the npm
# caches above. An entry, not a `cache:`-wrapped anchor, for the same
# reason as live_check_npm_cache_entry: both jobs already carry
# .npm_cache and a job cannot merge two anchors that each define `cache:`
# (the second is silently dropped) -- see where these are used.
.go_toolchain_cache_entry: &go_toolchain_cache_entry
  key:
    files:
      - go.mod
  paths:
    - .go-toolchain-cache/
  policy: $NPM_CACHE_POLICY

# #1304 item E8: test:go and test:postgres each run
# scripts/fetch-upgrade-fixtures.sh, which downloads every recorded
# upgrade fixture from the generic package registry. The script already
# skips a file already present, so caching .upgrade-fixtures/ turns a
# repeat pipeline's two downloads into two no-ops rather than two fresh
# fetches; a fixed key (not lockfile- or go.mod-keyed) because nothing in
# the repo names which fixture versions exist -- the registry does, and
# the script itself decides what is missing. Both jobs run as root in an
# unmodified golang:1.27.4 container, so there is no cross-uid risk here.
.upgrade_fixtures_cache_entry: &upgrade_fixtures_cache_entry
  key: upgrade-fixtures
  paths:
    - .upgrade-fixtures/
  policy: $NPM_CACHE_POLICY

# Standing on an earlier run instead of repeating it (#1066, ported from
# Orbit's reuse gate, orbit #898). A push that only touched one shard's
# scenario files used to rerun all four gate:scenarios shards plus
# gate:image, test:container and test:postgres. Each of those jobs now
# hashes what scripts/ci-reuse-inputs.js's JOB_INPUTS says it reads, and
# stands on an earlier successful run of the same job on this same merge
# request when the hash has not moved. docs/quality-strategy.md, "What
# stands on what", has the job-by-job reasoning; test:go and test:frontend
# are deliberately left out (#1066: cheap enough already).
#
# Merge requests only -- .gitlab-ci.yml is itself one of every job's
# inputs (JOB_INPUTS' COMMON), so a delivery-branch pipeline and any
# change to this file both run everything, same as before this existed.
#
# Nothing here can fail a job: every fault ci-reuse-gate.js meets -- no
# CI_REUSE_TOKEN, no network, an expired evidence artefact, an unknown
# job -- reads as "no earlier run to stand on", which reruns the job. That
# is the only direction that can never be wrong, which is also why this
# never adopts `workflow: auto_cancel: on_job_failure` (orbit #923): the
# owner wants the full line to run so one push shows every failure.
.reuse_gate: &reuse_gate |
  if node scripts/ci-reuse-gate.js gate "$CI_JOB_NAME"; then
    exit 0
  fi

# The other half: the proof the next pipeline reads back. The LAST line of
# a candidate job's `script:`, so it is reached only when everything
# before it passed -- never in `after_script`, which runs whatever the job
# did, including a failure before this line.
.reuse_evidence: &reuse_evidence node scripts/ci-reuse-gate.js evidence "$CI_JOB_NAME"

# #1451: coverage of the real program, merged into the unit-test profile.
# test:go and test:postgres run tests with MIKROVIEW_COVERDIR set, so every
# binary those tests start is built with -cover and writes its counts
# there (internal/authe2e's coverDir); this turns them into a text profile
# (Go's documented method, https://go.dev/doc/build-cover) and merges it
# with coverage-unit.out into coverage.out, each block once, covered if
# either side covered it. No counts at all means the switch broke: fail,
# rather than measure the unit tests alone and call it the whole figure.
.merge_program_coverage: &merge_program_coverage |
  covdir="$CI_PROJECT_DIR/.coverdata/go"
  if ! ls "$covdir"/covcounters.* >/dev/null 2>&1; then
    echo "no coverage counts from the real program in $covdir (#1451)"
    exit 1
  fi
  go tool covdata textfmt -i="$covdir" -o=coverage-program.out
  python3 scripts/merge-coverprofiles.py coverage.out coverage-unit.out coverage-program.out

# ---------------------------------------------------------------------------
# POLICY — the three-lane promotion order, dev -> preview -> main, with no
# shortcuts. Replaces .github/workflows/branch-policy.yml, which cannot see
# a merge that happens here. Only bites if the project requires a passing
# pipeline to merge (Settings > Merge requests > "Pipelines must succeed"),
# which is the owner's setting; without it this job is a warning, not a gate.
# ---------------------------------------------------------------------------

policy:promotion-hop:
  stage: lint
  # Light lane (#949): a shell script, no build.
  tags: [light]
  image: alpine:3.24
  needs: []
  # #952: a gate for the dev -> preview -> main hop; a cancelled-mid-run
  # result must never be read as a pass.
  interruptible: false
  # Not gated by #1038: this is the promotion-order gate itself. A
  # documentation-only merge request into main is still a merge request
  # into main, and still has to come from preview.
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  script:
    - 'echo "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        main)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "preview" ]; then
            echo "main only accepts merge requests from preview (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME') -- promote dev -> preview first, then preview -> main."
            exit 1
          fi
          ;;
        preview)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "dev" ]; then
            echo "preview only accepts merge requests from dev (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME')."
            exit 1
          fi
          ;;
      esac

# The release-surfaces drift gate (owner decision 2026-09-10) -- see
# docs/decisions/release-versioning.md "Release surfaces". Catches a
# changelog heading nobody cut, a dead GitHub Issues link, a broken
# relative link, an undocumented docs/ page, a stale Go version claim, or
# a stale screenshot before it rides a promotion out the door.
policy:release-surfaces:
  stage: lint
  tags: [light]
  image: alpine:3.24
  needs: []
  interruptible: false
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  # GIT_DEPTH 0, as gitleaks and semgrep: check 6 needs `git describe` and
  # `git merge-base --is-ancestor` to see every tag and commit, not the
  # shallow default.
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git
  script:
    - scripts/check-release-surfaces.sh

# ---------------------------------------------------------------------------
# LINT — mirrors what ci.yml already does on GitHub (build+vet+gofmt, svelte-check),
# plus the scanners added by #1462/#1463: shellcheck, golangci-lint and
# zizmor (security stage) block; ruff, knip and jscpd are report-only.
# ---------------------------------------------------------------------------

# Short scanners run on the light lane (2 CPU / 2 GB, three at a time) so
# they stop holding a big-lane slot; if one is ever killed for memory, move
# it back to big (owner decision, ai/agent-infra#3, 2026-09-05).
# The one hole the docs-only lane cannot close on its own (#1038): a path
# in neither list is invisible to `changes:`, so paired with a README edit
# it reads as documentation and the pipeline skips. This job runs on
# every merge request and dev pipeline with no `changes:` of its own, and
# goes red naming any changed path that is in neither *docs_only_paths
# nor *code_paths. scripts/ci-changed-paths-guard.py reads both lists
# from this file, so there is one copy; its .test.sh covers the cases.
# alpine plus Alpine's own python3/py3-yaml/git rather than a new image:
# every image tag here must be in supply-chain/pins-policy.json, and this
# one already is. GIT_DEPTH 0 as gitleaks and semgrep: a promotion's diff
# base is the preview tip, far past the shallow default, and an
# unreachable base passes with a note rather than guarding nothing.
lint:changed-paths-guard:
  stage: lint
  tags: [light]
  image: alpine:3.24
  needs: []
  <<: *dev_or_mr
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git python3 py3-yaml >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 scripts/ci-changed-paths-guard.py --git

# #1459: reads docs/flakes.md and goes red on a malformed sighting or a
# flake at its third sighting with no issue link in its heading. Runs on
# every MR and dev pipeline, outside the docs-only lane, because the log is
# itself a docs/ file. alpine:3.24 is already in supply-chain/pins-policy.json
# and has the sh and awk the script needs. --quarantined reads
# scripts/quarantine.txt, the same file run-scenarios.sh skips, so the two
# cannot drift. The "Scenarios exit 1 without a result" heading (#1458) is
# tagged (host) in the log: a whole-job host flake no scenario skip can
# quarantine, so the check wants an agent-infra issue link there instead.
lint:flake-check:
  stage: lint
  tags: [light]
  image: alpine:3.24
  needs: []
  <<: *dev_or_mr
  script:
    - sh scripts/ci/flake-check.sh --quarantined scripts/quarantine.txt docs/flakes.md
    # #1456: no tracked text file may spell the owner's name (sha256 only).
    # Reads docs too, so it lives in this docs-inclusive job.
    - apk add --no-cache git nodejs >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - node --test scripts/names-guard.test.mjs

# The shared check for personal details (ai/agent-infra#32, #1460): one set of
# rules for every project, kept on the agent host and mounted read-only into
# the job (/etc/private-details/rules.toml); no project carries its own copy.
# The template defines the job; its stage, runner, rules and image pin are set
# here. GitLab deep-merges an included job's mappings with this one, so the
# image name is restated because this is where the project pins it: the
# template names the tag only, and anyone who could repoint that tag would run
# their image with the checkout, the mounted rules and the job token. Pinned
# to the tag's OCI index digest through the image cache, like the Docker
# images above. Blocking, like the other quick static checks, and on the same
# rules as lint:flake-check. Invented test values that trip a rule are allowed
# by rule and path in .private-details-allow.toml, never by commit.
private-details:
  stage: lint
  tags: [light]
  needs: []
  <<: *dev_or_mr
  image:
    name: ${CI_IMAGE_CACHE_GHCR}/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    # The scan starts after this commit, the last on batch-b before the check
    # was adopted (#1460): older history trips rules that no path entry can
    # allow (AI credit lines, assistant account and branch names in merge
    # commits and messages), and a full-history scan exhausts the runner's
    # memory.
    PRIVATE_DETAILS_SINCE: 36bcd936c4e1b617910fa2dc8d5a59c95076424a

# #1068: both suites here test a script the pipeline itself leans on --
# ci-changed-paths-guard.py decides whether a job is skipped, and
# ci-reuse-gate.js decides whether one is reused -- yet nothing ran
# either, so a change to that logic was only ever caught by someone
# remembering to run it locally. The node:test files beside them already
# run in lint:frontend; these are the shell suites, which drive the real
# scripts end to end.
# alpine plus apk for the same reason as the job above: every image tag
# must be in supply-chain/pins-policy.json and this one already is. bash
# is installed explicitly because both scripts are `#!/usr/bin/env bash`
# and Alpine ships ash. No GIT_DEPTH: neither suite reads this
# repository's history -- the reuse gate builds its own scratch repo, and
# the guard's two --git cases are the ones that pass without consulting
# git at all.
lint:script-tests:
  stage: lint
  tags: [light]
  image: alpine:3.24
  needs: []
  <<: *dev_or_mr_code
  script:
    - apk add --no-cache bash git python3 py3-yaml nodejs coreutils >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - bash scripts/ci-changed-paths-guard.test.sh
    - bash scripts/ci-reuse-gate.test.sh
    - bash scripts/gate-remote.test.sh
    - bash scripts/coverage-floor.test.sh
    - bash scripts/merge-coverprofiles.test.sh
    - bash scripts/ci/gitlab-await-tested-image.test.sh
    - bash scripts/routeros-chr-open-mr.test.sh

lint:go:
  stage: lint
  tags: [light]
  image: golang:1.27.4
  <<: [*dev_or_mr_code, *git_safe]
  script:
    - go build ./...
    - go vet ./...
    - |
      # Count the files first. A broken git makes `git ls-files` print nothing,
      # gofmt then reads stdin instead of a file list, and the check passes
      # having examined nothing at all — reported success, zero coverage.
      # Reproduced locally on 2026-09-03 while diagnosing #908.
      files=$(git ls-files '*.go')
      if [ -z "$files" ]; then
        echo "git ls-files returned no Go files -- refusing to report a gofmt pass on an empty list"
        exit 1
      fi
      unformatted=$(gofmt -l $files)
      if [ -n "$unformatted" ]; then
        echo "Not gofmt-clean:"
        echo "$unformatted"
        gofmt -d $files
        exit 1
      fi

# Every node image below tracks the major the Dockerfiles build on, not the
# current LTS (#1106). CI sat on 22 while `Dockerfile` and
# `live-check.Dockerfile` shipped 26, so every frontend check ran two majors
# behind the runtime the image actually uses -- which is the thing the checks
# are meant to be testing. Move all of them together, or the split reopens.
lint:frontend:
  stage: lint
  # Light lane (#949): svelte-check and a few node:test files fit in 2 GB.
  tags: [light]
  image: node:26-alpine
  <<: [*dev_or_mr_code_frontend, *npm_cache]
  script:
    # The CHR watch suites (scripts/chr-watch) and #1066's reuse gate have
    # node:test suites that no other job runs, so they run here.
    - node --test scripts/chr-watch/*.test.js scripts/ci-reuse-inputs.test.js scripts/ci-reuse-gate.test.js
    - cd frontend
    - npm ci
    - npx svelte-check --tsconfig ./tsconfig.app.json

# The approved scanners (#1462, #1463; owner answer 13, 2026-11-15), all
# CI-only and never shipped: shellcheck (GPL-3.0), golangci-lint (GPL-3.0),
# ruff (MIT), knip (ISC), jscpd (MIT), and zizmor in the security stage (MIT).
# "Report first, then block" (#1462): each runs here in report mode --
# allow_failure, full report kept as an artifact -- and a later change makes
# them block once one pipeline's noise has been triaged. Each tool is pinned:
# an image by digest (through the image cache, like gitleaks above), or an npm
# package by exact version in frontend/package-lock.json. Renovate reads the
# image: lines and the package.json pins; see docs/ci-scanners.md.

# shellcheck on every *.sh, warning and up. koalaman/shellcheck-alpine has no
# entrypoint, so the script runs as in any other job; find stands in for
# git ls-files because the checkout is all there is and the image has no git.
lint:shellcheck:
  stage: lint
  tags: [light]
  image: ${CI_IMAGE_CACHE_DOCKERHUB}/koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
  needs: []
  <<: *dev_or_mr_code
  interruptible: true
  # blocking since its findings reached zero (#1462)
  script:
    - rc=0
    - find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck --severity=warning --format=gcc > shellcheck-report.txt || rc=$?
    - cat shellcheck-report.txt
    - exit $rc
  artifacts:
    when: always
    paths:
      - shellcheck-report.txt
    expire_in: 30 days

# golangci-lint v2 with .golangci.yml (the standard set plus dupl; gosec is
# off because security:gosec runs it). GOPRIVATE comes from the global
# variables, as for lint:go.
lint:golangci:
  stage: lint
  tags: [light]
  image: ${CI_IMAGE_CACHE_DOCKERHUB}/golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
  needs: []
  <<: [*dev_or_mr_code, *git_safe]
  interruptible: true
  # blocking since its findings reached zero (#1462)
  script:
    - rc=0
    - golangci-lint run --output.text.path=golangci-report.txt ./... || rc=$?
    - cat golangci-report.txt
    - exit $rc
  artifacts:
    when: always
    paths:
      - golangci-report.txt
    expire_in: 30 days

# ruff with ruff.toml: the defaults plus the S (security) rules, on the
# checkout's *.py files (ruff skips what .gitignore ignores). The -alpine image
# has a shell; its default command is ruff, which the script replaces.
lint:ruff:
  stage: lint
  tags: [light]
  image: ${CI_IMAGE_CACHE_GHCR}/astral-sh/ruff:0.17.4-alpine@sha256:7a717be3a7cfbef698a9b99e1555add93ec6b195242fe273997683e49b051f51
  needs: []
  <<: *dev_or_mr_code
  interruptible: true
  # report-only until one pipeline's noise is triaged (#1462)
  allow_failure: true
  script:
    - rc=0
    - ruff check --no-cache --output-format=concise . > ruff-report.txt || rc=$?
    - cat ruff-report.txt
    - exit $rc
  artifacts:
    when: always
    paths:
      - ruff-report.txt
    expire_in: 30 days

# knip on frontend/ (unused files, exports and dependencies), configured by
# frontend/knip.json; an exact-version devDependency, installed with npm ci.
lint:knip:
  stage: lint
  tags: [light]
  image: node:26-alpine
  needs: []
  <<: [*dev_or_mr_code_frontend, *npm_cache]
  interruptible: true
  # report-only until one pipeline's noise is triaged (#1462)
  allow_failure: true
  script:
    - cd frontend
    - npm ci
    - rc=0
    - npx knip > ../knip-report.txt || rc=$?
    - cat ../knip-report.txt
    - exit $rc
  artifacts:
    when: always
    paths:
      - knip-report.txt
    expire_in: 30 days

# jscpd on frontend/src (.jscpd.json). Two outcomes, on purpose (#1463): a
# duplication finding is report-only (jscpd exits 3, which allow_failure
# tolerates), but `npm audit signatures` -- the owner's condition for using
# jscpd -- checks every installed package's registry signature and provenance
# attestation and fails the job, with its own exit code, if one is invalid.
lint:jscpd:
  stage: lint
  tags: [light]
  image: node:26-alpine
  needs: []
  <<: [*dev_or_mr_code_frontend, *npm_cache]
  interruptible: true
  # report-only until one pipeline's noise is triaged (#1462)
  allow_failure:
    exit_codes: [3]
  script:
    - cd frontend
    - npm ci
    - npm audit signatures
    - cd ..
    - frontend/node_modules/.bin/jscpd
  artifacts:
    when: always
    paths:
      - jscpd-report/
    expire_in: 30 days

lint:supply-chain-pins:
  stage: lint
  # Light lane (#949): reads files and a policy; installs only bash and git.
  tags: [light]
  image: node:26-alpine
  <<: *dev_or_mr_code
  script:
    # #711: every action SHA and image tag CI uses must be in
    # supply-chain/pins-policy.json with its review date. Fails on a pin the
    # policy does not record, or a recorded pin CI no longer uses.
    # Some suites drive shell scripts and git (gitlab-image.test.mjs, #1472).
    - apk add --no-cache bash git >/dev/null
    # A glob, so a new suite here runs without a CI edit (#1473).
    - node --test tools/supply-chain/*.test.mjs
    - node tools/supply-chain/pins-policy.mjs

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

test:go:
  stage: test
  # Stays on big: peaks at ~7.2 GB, over the light lane's 6 GB cap.
  image: golang:1.27.4
  # Not gated by #1038, and must not be: five tests read
  # docs/configuration.md and assert on its contents (ca_docs_test.go,
  # migrate_cli_test.go, internal/api/route_docs_test.go,
  # internal/config/env_docs_test.go and problem_docs_test.go). A prose
  # edit can fail this job for real, so it runs for prose.
  <<: *dev_or_mr_heavy
  # #1304 item E8: shared with test:postgres below, so a fixture already
  # fetched by either job on an earlier pipeline is not fetched again --
  # see upgrade_fixtures_cache_entry above. fetch-upgrade-fixtures.sh
  # already skips a file it finds present, so this only ever saves a
  # download, never risks serving something stale.
  cache:
    - *upgrade_fixtures_cache_entry
  # GitLab's docker executor runs this container as root by default; GitHub's
  # ci.yml runs the same test directly on the runner VM as an unprivileged
  # user. That mismatch makes permission-enforcement tests (e.g.
  # TestUnwritableStorePathSurfacesPersistErrButStillLoads, which chmods a
  # directory unwritable and expects the code under test to see a real
  # permission error) fail here specifically, since root bypasses Unix
  # permission bits (CAP_DAC_OVERRIDE) — not because the code is wrong.
  # Dropping to a non-root user for the actual `go test` run matches both
  # GitHub's environment and mikroview's own production posture (its
  # Dockerfile runs USER 1000:1000). See
  # docs/decisions/gitlab-ci-root-in-container-test-failure.md.
  script:
    # Every recorded upgrade fixture (#1239) into .upgrade-fixtures/,
    # gitignored, so internal/persist/upgrade_test.go has something to
    # open -- CI_JOB_TOKEN authenticates against the generic package
    # registry the fixtures were recorded and uploaded to (see
    # scripts/record-upgrade-fixture.sh). Run before the chown below so
    # the fetched files end up owned by ci-test along with everything
    # else, and before the useradd/su split so a fetch failure fails the
    # job at the step that actually failed rather than inside `su`.
    - scripts/fetch-upgrade-fixtures.sh
    - useradd -m -u 10001 ci-test
    - chown -R ci-test:ci-test "$CI_PROJECT_DIR"
    # #1392: -timeout 20m, not the 10m default. internal/api reached
    # 430-600s under -race on the shared runner before #1392 cut its
    # password-hashing cost; the timeout is here to catch a hang, not to
    # time the suite.
    #
    # #1451: MIKROVIEW_COVERDIR makes every test that starts the real
    # program (internal/authe2e's binary, internal/api's `go run` of
    # scripts/routeroscommands) build it with -cover and leave its counts
    # there; covdata turns them into a text profile, and the merge adds
    # them to the unit-test profile block by block, so coverage.out counts
    # code run from outside as well as code called directly. Unset (a
    # plain local `go test`), nothing changes.
    - su ci-test -c "cd '$CI_PROJECT_DIR' && HOME=/home/ci-test MIKROVIEW_COVERDIR='$CI_PROJECT_DIR/.coverdata/go' go test ./... -race -timeout 20m -coverprofile=coverage-unit.out"
    - *merge_program_coverage
    # #1333: the ratchet against supply-chain/coverage-floors.yml. Runs as
    # root (back from `su` above), which is fine -- the profiles are
    # ci-test-owned but world-readable, and the merge writes coverage.out
    # beside them as root (after_script hands everything back).
    - python3 scripts/coverage-floor.py coverage.out
  # The runner reuses its build directory between pipelines, so leaving the
  # checkout owned by ci-test hands the next pipeline's root-run jobs a
  # repository git will not touch. Give it back (#908).
  after_script:
    - chown -R root:root "$CI_PROJECT_DIR" || true
  artifacts:
    paths:
      - coverage.out
      - coverage-unit.out
      - coverage-program.out
    expire_in: 1 week

test:frontend:
  stage: test
  tags: [light]
  image: node:26-alpine
  <<: [*dev_or_mr_code_frontend_heavy, *npm_cache]
  # The other half of #684. lint:frontend above proves the frontend compiles;
  # nothing here proved it behaves, so this lane had the same hole GitHub did
  # and 542 real assertions gated nothing on either. jsdom, so no browser and
  # no runner image beyond the one lint:frontend already uses.
  script:
    - cd frontend
    - npm ci
    # #1333: --coverage turns on vitest.config.ts's coverage.thresholds,
    # so a regression below the measured ratchet fails this job.
    - npm test -- --coverage

# The checks that need the frontend actually built, moved here from GitHub's
# ci.yml `test` job (#935 step 7). Each one's reason is in the script it
# runs: the bundle budget (frontend/scripts/check-bundle-budget.mjs, #462)
# measures the real dist/, THIRD-PARTY-NOTICES.md is generated from what
# that build bundled plus `go list` over the binary's modules, and the docs
# link check (tools/docs/check-anchors.mjs) rides along because it is a
# node one-liner with nowhere better to live.
#
# node plus Go in one image: the notices generator needs both. The Go
# toolchain is the official tarball, pinned to go.mod's version; Debian's
# packaged Go is too old to read this module.
test:build-checks:
  stage: test
  tags: [light]
  image: node:26-bookworm
  # Not gated by #1038: the last line below is tools/docs/check-anchors.mjs,
  # the markdown link and anchor check, and generate-notices --check reads
  # THIRD-PARTY-NOTICES.md. This job's whole reason to exist includes prose,
  # so it keeps .dev_or_mr's plain rules rather than the ladder.
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.batch-intake, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Same on-demand skip as .dev_or_mr (#951); repeated because `exists:`
    # keeps these rules inline rather than merged from the anchor.
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true" || $SIGN_TAG != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  <<: *git_safe
  # #1304 item E6: a job cannot merge two anchors that each define
  # `cache:` (only the first is kept), so this needs both cache entries
  # written out rather than merging in .npm_cache -- see
  # go_toolchain_cache_entry above, next to .npm_cache itself.
  cache:
    - *npm_cache_entry
    - *go_toolchain_cache_entry
  script:
    - mkdir -p .go-toolchain-cache
    - test -f .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz || curl -fsSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - tar -C /usr/local -xzf .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - (cd frontend && npm ci && npm run build)
    - node frontend/scripts/check-bundle-budget.mjs
    - node tools/licenses/generate-notices.mjs --check
    - node tools/docs/check-anchors.mjs

# Postgres integration (#131), ported from GitHub's ci.yml (#942). Same
# image and the same TLS-only shape: internal/persist refuses any
# connection that could fall back to plaintext (its requireTLS), so the
# server must present a certificate. GitHub built a one-line derived
# image to get the cert in; here the service's entrypoint is overridden
# to generate it before handing over to the stock entrypoint, which
# needs no image build and no Docker inside the job. The cert is
# self-signed and one day old at most, hence sslmode=require rather
# than verify-full -- this checks the storage logic, not certificate
# validation. Runs in every lane, dev included, for the reason ci.yml's
# header gave: this job's absence from dev once let a storage defect
# sit for 41 commits (#273).
test:postgres:
  stage: test
  tags: [light]
  image: golang:1.27.4
  <<: *dev_or_mr_code_heavy
  # #1304 item E8: shared with test:go above -- see
  # upgrade_fixtures_cache_entry and the comment on test:go's cache.
  cache:
    - *upgrade_fixtures_cache_entry
  services:
    - name: postgres:18-alpine
      alias: postgres
      entrypoint: ["sh", "-c"]
      command:
        - |
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout /certs/server.key -out /certs/server.crt
          chown postgres:postgres /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          exec docker-entrypoint.sh postgres -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
  variables:
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: mikroview
    MIKROVIEW_TEST_POSTGRES: postgres://postgres:ci@postgres:5432/mikroview?sslmode=require
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The runner only waits for the service's port, and Postgres listens
    # briefly during its own init before restarting, so a port check can
    # pass early. Ask the server itself, as ci.yml did. Debian's client
    # is older than the server; pg_isready does not care. No `exit` in
    # this loop: before_script and script share one shell, and an early
    # exit here would end the job green with nothing tested.
    # nodejs alongside postgresql-client: #1066's reuse gate is plain
    # Node (scripts/ci-reuse-gate.js), and this image has neither by
    # default. Paid here rather than skipped for a reused run -- the
    # postgres wait above already started before script: runs -- but it
    # is cheap next to the `go test -race` this can now skip.
    - apt-get -qq update && apt-get -qq install -y postgresql-client nodejs >/dev/null
    - |
      ready=0
      for attempt in $(seq 1 40); do
        if pg_isready -h postgres -U postgres -d mikroview >/dev/null 2>&1; then ready=1; break; fi
        sleep 1
      done
      [ "$ready" = 1 ] || { echo "postgres never became ready"; false; }
  script:
    - *reuse_gate
    # The recorded upgrade fixtures (#1247), exactly as test:go fetches
    # them: the pg_dump per schema version this job restores lives in the
    # same generic package as the file backend's tarballs, and
    # internal/persist/upgrade_postgres_test.go has nothing to open
    # without it. After the reuse gate, so a reused run does not pay for
    # downloads it will not use.
    - scripts/fetch-upgrade-fixtures.sh
    # internal/matchlog alongside internal/persist (#243 slice 6): its
    # Postgres backend is a second, independent SQL sink with its own
    # table and needs the same real-database coverage.
    #
    # #1290: -coverprofile, now that this job owns these two packages'
    # coverage outright -- test:go's own profile never runs their
    # Postgres-backed statements (see supply-chain/coverage-floors.yml's
    # header), and this run, with MIKROVIEW_TEST_POSTGRES set above, is a
    # strict superset of what test:go covers for them.
    - go test -race -count=1 -coverprofile=coverage-unit.out ./internal/persist/... ./internal/matchlog/...
    # internal/authe2e's Postgres tests (#1202): the real binary against
    # this job's database. They skip without MIKROVIEW_TEST_POSTGRES, so
    # until now they ran nowhere in CI. Only those tests, by -run, not the
    # whole package: test:go already runs the rest, and the whole package
    # took about 4.6 minutes here without -race against about 2 with it
    # for these alone. 'Postgres|TokensRow' matches every test in the
    # package that opens the database (newPG); a new one has to carry
    # one of those words to run here. Its own line, so -run does not
    # filter the two packages above. No -coverprofile of its own: these
    # test the binary from outside, so what they cover is the binary's run
    # (#1451, MIKROVIEW_COVERDIR as in test:go), merged into
    # coverage-postgres.out below -- only persist's and matchlog's share
    # of it is checked here.
    - MIKROVIEW_COVERDIR="$CI_PROJECT_DIR/.coverdata/go" go test -race -count=1 -run 'Postgres|TokensRow' ./internal/authe2e/...
    - *merge_program_coverage
    - mv coverage.out coverage-postgres.out
    # The ratchet against postgres-floors: in supply-chain/coverage-floors.yml
    # -- the same mechanism test:go's coverage-floor.py call uses, scoped to
    # just the two packages this job measures.
    - python3 scripts/coverage-floor.py --section postgres-floors coverage-postgres.out
    - *reuse_evidence
  artifacts:
    paths:
      - ci-reuse-evidence/
      - coverage-postgres.out
      - coverage-unit.out
      - coverage-program.out
    expire_in: 1 week

# Docker-in-Docker for every job that needs a Docker daemon (#1457,
# ai/agent-infra#31). The shared `light` and `big` runners used to mount
# their own Docker socket into every job, which let any job inspect or exec
# into any other job's container on that Docker and read its variables,
# tokens included. The `docker` runner is privileged and has no socket;
# each job instead gets a throwaway daemon of its own, as a service,
# reached over TCP. Copied from ai/orbit's `.dind_service`/`.dind`.
#
# The daemon dies with the job, so nothing here has to clean up after
# itself, and an image one job builds is not visible to another: pass it
# on as an artifact (`docker save`/`docker load`) or through the registry.
# Its layer cache starts empty every time, so builds are slower until
# ai/agent-infra#17 (registry-backed BuildKit cache); base-image pulls are
# served from the local image cache (ai/agent-infra#14).
#
# Held at 29.6.2, and so is the docker:*-cli image below (ai/orbit#827):
# Docker 29.7.0 changed how a push tracks layers across repositories
# (moby/moby#53081) and the daemon can skip a blob the registry does not
# have, so a push fails with "blob unknown to registry" (moby/moby#53293).
# Both are pinned by digest and pulled once (`if-not-present`).
.dind_service:
  tags:
    - docker
  services:
    - name: ${CI_IMAGE_CACHE_DOCKERHUB}/library/docker:29.6.2-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
      # GitLab derives a service's hostname from its image name; through
      # the cache that name is the whole path, not "docker", and every
      # `tcp://docker:2375` below would stop resolving.
      alias: docker
      pull_policy: if-not-present
      # The inner daemon pulls through the image cache, so plain Docker Hub
      # names stay unchanged and the pulls are local. The three variables
      # are set on every runner. The runner expands variables in a service's
      # `name` but not in `command:` or `entrypoint:`, so the flags go
      # through `sh -c`, where the shell expands them; a literal in
      # `command:` made the daemon exit with "insecure registry … is not
      # valid" on the first run (ai/agent-infra#31).
      entrypoint:
        - /bin/sh
        - -c
        - exec dockerd-entrypoint.sh --registry-mirror="http://$CI_IMAGE_CACHE_DOCKERHUB" --insecure-registry="$CI_IMAGE_CACHE_DOCKERHUB" --insecure-registry="$CI_IMAGE_CACHE_GHCR" --insecure-registry="$CI_IMAGE_CACHE_MCR"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  # The daemon takes about 15 seconds to come up, and a job that runs
  # docker as its first command would otherwise fail on a refused
  # connection. A job that defines its own before_script must repeat this.
  before_script:
    - |
      for _ in $(seq 1 60); do
        docker info > /dev/null 2>&1 && break
        sleep 1
      done
      docker info > /dev/null 2>&1 || { echo "the dind service daemon is not reachable at ${DOCKER_HOST}"; exit 1; }

# The job image every Docker job here shares: just the CLI, talking to the
# service above.
.dind:
  extends: .dind_service
  image:
    name: ${CI_IMAGE_CACHE_DOCKERHUB}/library/docker:29.6.2-cli@sha256:be132a9f282288de4afaf63379dff75711fda0147c6b72a9df44e51841402144
    pull_policy: if-not-present

# #1472 job 1: the one build of the product image (build once, test the
# built bytes, promote by digest). Every job after it -- test:container,
# test:install-line, check:upgrade-fixture-recorder, release:check-version,
# security:trivy-image and the publish jobs -- loads this job's image.tar
# rather than building again, so what is scanned, smoke-tested, pushed and
# signed is one set of bytes. (gate:image's `docker build` is a different
# image: the live-check harness, built from live-check.Dockerfile and never
# shipped.)
#
# No reuse gate: it always builds (orbit ADR-0028); the jobs after it keep
# theirs. Its rules are the union of its consumers', so a job that needs
# image.tar can never find it missing: the publishing refs, a merge
# request into preview (check:upgrade-fixture-recorder, which is not
# docs-gated), and the heavy code ladder test:container uses.
#
# --provenance=false --sbom=false: one plain manifest, no BuildKit
# attestation index. The registry refused that index ("blob unknown to
# registry", gate:image, pipeline 539), and a single manifest keeps a
# registry-side retag on the same digest (#1407). The SBOM is made from
# the built tar by security:trivy-image instead, and attested to the
# pushed digest by sign:release-digest.
#
# VERSION is stamped into the binary and the frontend bundle (#1363), so a
# release tag builds with the tag itself and every other pipeline with
# preview:<short sha>, the same values .github/workflows/docker.yml passes
# (owner decision #572: a release is built from its own tag, never by
# retagging preview's bytes). image.source is the public GitHub repository,
# as docker.yml's metadata-action sets it today, so the GHCR copy keeps
# the label GHCR links the package by.
#
# No registry layer cache: a cache any developer pipeline could write
# would feed the release build. One more build of an unchanged tree is the
# cheaper risk; ai/agent-infra#17 can revisit it.
build:image:
  extends: .dind
  stage: test
  needs: []
  rules:
    - !reference [.publish_ref, rules]
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"'
    - !reference [.dev_or_mr_code_heavy, rules]
  variables:
    MV_CI_IMAGE: mikroview-ci:$CI_COMMIT_SHA
  script:
    - docker version --format 'client {{.Client.Version}} / daemon {{.Server.Version}}'
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version="$CI_COMMIT_TAG"
      else
        version="preview:$(printf '%.7s' "$CI_COMMIT_SHA")"
      fi
      echo "build:image: building $MV_CI_IMAGE with VERSION=$version"
      docker buildx build --load --provenance=false --sbom=false \
        --build-arg VERSION="$version" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.source="https://github.com/tomlawesome/mikroview" \
        --label org.opencontainers.image.version="$version" \
        --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --tag "$MV_CI_IMAGE" .
    - docker save -o image.tar "$MV_CI_IMAGE"
    - ls -l image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

# #1472 job 3: a release tag's own checks, the two .github/workflows/
# docker.yml makes today before it publishes -- the tag must equal
# v<VERSION> at the tagged commit (docs/decisions/release-versioning.md),
# and the binary build:image stamped must report that same tag. Either
# one failing means the tag names the wrong commit, or VERSION was not
# bumped, and nothing may publish. Tag pipelines only; publish:image
# needs it there (optional, so a preview push does not wait for it).
release:check-version:
  extends: .dind
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]/'
  needs:
    - job: build:image
      artifacts: true
  script:
    - |
      set -eu
      want="v$(tr -d '[:space:]' < VERSION)"
      if [ "$CI_COMMIT_TAG" != "$want" ]; then
        echo "release:check-version: tag '$CI_COMMIT_TAG' but VERSION says '$want' -- tag the commit whose VERSION matches, or bump VERSION first" >&2
        exit 1
      fi
    - docker load -i image.tar
    - |
      set -eu
      got="$(docker run --rm --entrypoint /mikroview "mikroview-ci:$CI_COMMIT_SHA" -version)"
      echo "binary reports: $got"
      if [ "$got" != "$CI_COMMIT_TAG" ]; then
        echo "release:check-version: binary reports '$got' but this release is '$CI_COMMIT_TAG'" >&2
        exit 1
      fi

# Container smoke test, ported from GitHub's ci.yml (#942, the second
# half). Loads the production image build:image built (#1472) and runs it the way
# deploy/docker-compose.yml runs it -- read-only root, tmpfs for /tmp and
# the data directory, every capability dropped, no-new-privileges, pid,
# memory and CPU limits -- and asks /api/healthz whether it came up.
#
# This is one of the jobs that needs a Docker daemon from inside a job; it
# takes a throwaway one of its own from .dind above. Consequences this job
# is written around:
#
# - The daemon is the dind service's, not this container's. `docker load`
#   streams image.tar to it over TCP, so paths inside this job
#   container do not matter; `--publish` would bind a port on the service
#   container, which this container does not reach as 127.0.0.1, so nothing
#   is published. The health check instead runs in a throwaway container
#   joined to the app container's network namespace, where 127.0.0.1 is
#   the app.
# - The daemon is the job's alone and dies with it, so there is no cleanup
#   to do and no other pipeline to collide with; the names still carry
#   $CI_JOB_ID, which costs nothing. The layer cache starts empty each
#   time (ai/agent-infra#17 will back it with the registry).
# - The image runs as uid 1000 (Dockerfile), so the tmpfs at the data
#   directory is created with that owner: without a writable data
#   directory the container has nowhere to persist its CA, and the app
#   once carried a "persistence is optional" contract purely to keep this
#   test green (#535). Same flags as ci.yml had.
#
# `-k` on the health check: TLS is on by default (self-signed, generated
# on first start -- internal/servertls), and this only asks whether the
# server answers, not whether the chain verifies.
#
# On a publishing ref (#1472) -- a push to preview or a v* tag -- the
# script skips the reuse gate outright and runs in full, so a publishing run
# always tests the bytes it ships. That skip is in the script, not left to
# ci-reuse-gate.js (#1066), so a change there cannot reopen it. Dev pushes and
# merge requests still go through the gate.
test:container:
  extends: .dind
  stage: test
  rules:
    - !reference [.publish_ref, rules]
    - !reference [.dev_or_mr_code_heavy, rules]
  needs:
    - job: build:image
      artifacts: true
  variables:
    APP: mikroview-test-$CI_JOB_ID
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
  # The same vulnerability database security:trivy-fs fetches, cached
  # rather than downloaded on every run (#1462); .dockerignore keeps it
  # out of the build context.
  cache:
    key: trivy-db
    paths:
      - .trivy-cache
  script:
    # apk before the reuse gate: this image is Alpine and carries neither
    # Node nor curl by default, and #1066's gate (scripts/ci-reuse-gate.js)
    # needs Node to run at all.
    - apk add --no-cache nodejs >/dev/null
    # The reuse gate, skipped outright on a publishing ref (#1472): a push
    # to preview or a v* tag tests the bytes it ships, whatever
    # scripts/ci-reuse-gate.js would decide. Same test as .publish_ref's
    # rules; on dev and merge requests the gate runs as *reuse_gate does.
    - |
      publish_ref=false
      if [ "${CI_PIPELINE_SOURCE:-}" = "push" ]; then
        [ "${CI_COMMIT_BRANCH:-}" = "preview" ] && publish_ref=true
        case "${CI_COMMIT_TAG:-}" in v[0-9]*) publish_ref=true ;; esac
      fi
      if [ "$publish_ref" = true ]; then
        echo "test:container: publishing ref -- reuse gate skipped, testing the image this pipeline ships"
      elif node scripts/ci-reuse-gate.js gate "$CI_JOB_NAME"; then
        exit 0
      fi
    - docker version --format 'client {{.Client.Version}} / daemon {{.Server.Version}}'
    - docker load -i image.tar
    - docker tag "mikroview-ci:$CI_COMMIT_SHA" "$APP"
    # From v0.7.0 the server refuses to start without a key (#1202, ruling
    # 2), so the job makes a throwaway one the way install.sh does: in a
    # volume, written by a helper container, mounted read-only. A volume
    # rather than a bind mount because this socket is the host's daemon,
    # which cannot see the job's own filesystem.
    - docker volume create "$APP-etc" >/dev/null
    - >-
      docker run --rm -v "$APP-etc:/etc/mikroview" alpine:3.24 sh -c
      'mkdir -p /etc/mikroview/keys &&
      head -c 32 /dev/urandom | base64 > /etc/mikroview/keys/history.key &&
      chown 1000:1000 /etc/mikroview/keys/history.key &&
      chmod 600 /etc/mikroview/keys/history.key'
    - >-
      docker run --detach --name "$APP"
      --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
      --tmpfs /var/lib/mikroview:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
      -v "$APP-etc:/etc/mikroview:ro"
      --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 64 --memory 128m --cpus 0.5
      "$APP"
    - |
      for attempt in $(seq 1 20); do
        if docker run --rm --network "container:$APP" alpine:3.22 \
             wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8080/api/healthz; then
          echo "healthz answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 20 ]; then
          echo "healthz never answered; container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    # Image scan (#1462): the image tested above, for vulnerable OS packages
    # and Go modules, without building it again. This job's image is the
    # Docker CLI, so trivy's static binary is copied out of the pinned
    # Trivy image through the daemon. trivy reads build:image's image.tar
    # (#1472) with --input -- the same bytes just loaded and smoke-tested,
    # so no `docker save` is needed. Before *reuse_evidence, so a reused
    # run stands on a scan that passed.
    - cid=$(docker create "aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb")
    - docker cp "$cid:/usr/local/bin/trivy" /usr/local/bin/trivy
    - docker rm "$cid" >/dev/null
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --input image.tar
    - *reuse_evidence
  artifacts:
    paths:
      - ci-reuse-evidence/
    expire_in: 1 week

# The one-line pastable install (#1242) tested against a real daemon,
# beside test:container above -- same image, same throwaway daemon, so read
# that job's header first.
#
# Ports: install.sh's docker run really publishes -p on the daemon's own
# host (unlike test:container, which never publishes), which is now the
# job's own dind service, so no other job can collide with it.
# $CI_JOB_ID still picks a pair in 20000-39999 per job -- never
# 443/6514/8080 (what a real install uses) and never the workstation's own
# live-test ranges -- so the pair stays out of a real install's way.
#
# No curl in this image on purpose: install.sh's own healthz wait then
# just says so and skips, which is the real behaviour for an operator who
# hasn't got curl either -- the network-namespace trick below (same as
# test:container's) is what actually asserts health here.
#
# Reuse gate: kept, like test:container's. install.sh isn't under
# scripts/ or any tree test:container's IMAGE_PATHS already watches, so
# scripts/ci-reuse-inputs.js gets its own INSTALL_LINE_PATHS (IMAGE_PATHS
# plus install.sh) rather than reusing IMAGE_PATHS unchanged -- otherwise
# an install.sh-only push would wrongly stand on an earlier run that
# never touched it.
test:install-line:
  extends: .dind
  stage: test
  <<: *dev_or_mr_code_heavy
  # build:image's image.tar (#1472), not a second build of the same tree.
  needs:
    - job: build:image
      artifacts: true
  variables:
    APP: mikroview-install-$CI_JOB_ID
    IMG: mikroview-ci:$CI_COMMIT_SHA
  script:
    - apk add --no-cache nodejs >/dev/null
    - *reuse_gate
    - docker load -i image.tar
    - |
      HTTPS_PORT=$((20000 + CI_JOB_ID % 20000))
      SYSLOG_PORT=$((HTTPS_PORT + 1))
      echo "test:install-line: using ports https=$HTTPS_PORT syslog=$SYSLOG_PORT"
      export MIKROVIEW_IMAGE="$IMG" MIKROVIEW_CONTAINER="$APP" \
        MIKROVIEW_HTTPS_PORT="$HTTPS_PORT" MIKROVIEW_SYSLOG_PORT="$SYSLOG_PORT"
    - sh install.sh
    - |
      for attempt in $(seq 1 20); do
        if docker run --rm --network "container:$APP" alpine:3.22 \
             wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8080/api/healthz; then
          echo "healthz answered on attempt $attempt"
          break
        fi
        sleep 1
        if [ "$attempt" = 20 ]; then
          echo "healthz never answered; container log follows"
          docker logs "$APP"
          exit 1
        fi
      done
    - id1="$(docker container inspect --format '{{.Id}}' "$APP")"
    # The same line is also the upgrade line (#1240) -- running it twice
    # must stop and remove the first container, re-creating it on the
    # same two named volumes, not just leave it be.
    - echo "test:install-line -- running install.sh a second time"
    - sh install.sh
    - |
      id2="$(docker container inspect --format '{{.Id}}' "$APP")"
      [ "$id1" != "$id2" ] || { echo "test:install-line: container was not re-created on the second run"; exit 1; }
      for vol in "${APP}-data" "${APP}-etc"; do
        if ! docker volume ls --format '{{.Name}}' | grep -Fxq "$vol"; then
          echo "test:install-line: missing volume $vol after re-create"
          exit 1
        fi
      done
      echo "test:install-line: re-create verified, both named volumes survived"
    - *reuse_evidence
  artifacts:
    paths:
      - ci-reuse-evidence/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# GATE — the live-check gate, sharded (#1004).
#
# `make live-check` drives 85 browser scenarios one at a time against one
# real instance, about 36 minutes on about three cores, and then four
# standalone shell checks. It had been kept off CI because a 36-minute job
# holding a host is a poor fit for a pipeline, and run instead by a loop on
# the second host after each merge to dev (#831 has that loop and the
# measurements). But that host *is* the CI runner's host, so any pipeline
# lands on a running gate and the gate fails on navigation timeouts that
# have nothing to do with the code.
#
# Sharding is the fix: `MV_SHARD=i/N make live-check` runs the i-th of N
# contiguous slices of the scenario list against its own instance
# (scripts/run-scenarios.sh explains how the list is cut), so four jobs in
# parallel take the browser phase in about nine minutes each. That is a
# shorter *window*, not more capacity -- the core-minutes are the same, the
# host is the same -- but a nine-minute window collides with the rest of
# the world far less often than a thirty-six-minute one, and here GitLab
# does the scheduling instead of a lock file. The standalone scripts are
# one unit and run once, in gate:scripts.
#
# Three jobs, all blocking: a turnstile, not a tripwire. They ran as
# `allow_failure: true` from #1004 until 2026-09-08, with a loop on the
# workstation as the gate of record -- but a gate nobody is made to read
# is not a gate (owner). Now a red shard stops the merge by itself. A red
# that looks like the host, not the code, is reproduced with
# scripts/gate-local.sh on the quieter workstation and recorded in
# docs/flakes.md; the job is retried only once that run is green.
#
# The image is the same one gate-remote.sh builds on the second host
# (live-check.Dockerfile: node, Go, the three Playwright engines, ~1.5 GB).
# gate:image builds it once per Dockerfile revision into the project
# registry and points a per-branch tag at it, so the shard jobs can name
# an `image:` without computing anything; a pipeline whose Dockerfile has
# not changed just moves the tag.
# ---------------------------------------------------------------------------

# In the `test` stage on purpose, with `needs: []`: it starts the moment the
# pipeline does, and the shards below, which name no `needs`, wait for the
# whole of lint, test and security to finish before they start. Giving
# the shards `needs: [gate:image]` instead would start them early, on top
# of trivy and the Go compiles, on the four-slot light lane they would
# fill -- exactly the contention #831 measured.
gate:image:
  extends: .dind
  stage: test
  # Not gated by #1038. When live-check.Dockerfile has not changed this
  # job is a registry lookup and a retag -- seconds -- and gate:scenarios,
  # gate:scripts and perf:promotion all name the per-branch tag it
  # publishes. Skipping it to save nothing would risk a promotion finding
  # no tag to pull.
  <<: *dev_or_mr_heavy
  needs: []
  # #952: pushes to the registry -- never cut mid-write.
  interruptible: false
  timeout: 45m
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/live-check
  script:
    # apk before the reuse gate (#1066): this image is Alpine and carries
    # neither Node nor curl by default, and scripts/ci-reuse-gate.js needs
    # Node to run at all.
    - apk add --no-cache nodejs >/dev/null
    - *reuse_gate
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      TAG="df-$(sha256sum live-check.Dockerfile | cut -c1-12)"
      if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
        echo "live-check image for this Dockerfile is already in the registry: $IMAGE:$TAG"
      else
        docker pull "$IMAGE:latest" || true
        # A plain single manifest, no provenance/SBOM attestations: the
        # registry refused the attestation index BuildKit attaches by
        # default ("blob unknown to registry", pipeline 539).
        docker build --provenance=false --sbom=false --cache-from "$IMAGE:latest" --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" -f live-check.Dockerfile .
        docker push "$IMAGE:$TAG"
        docker push "$IMAGE:latest"
      fi
      # Retag in the registry, without pulling: the shards name this tag.
      # --prefer-index=false: $IMAGE:$TAG is a single manifest (built
      # --provenance=false --sbom=false above), and imagetools create
      # otherwise wraps it in a new OCI index under a different digest
      # (#1407). Then confirm the tag actually landed on that digest.
      docker buildx imagetools create --prefer-index=false -t "$IMAGE:$CI_COMMIT_REF_SLUG" "$IMAGE:$TAG"
      src_digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')"
      got_digest="$(docker buildx imagetools inspect "$IMAGE:$CI_COMMIT_REF_SLUG" --format '{{.Manifest.Digest}}')"
      if [ "$got_digest" != "$src_digest" ]; then
        echo "retag moved the digest: $IMAGE:$CI_COMMIT_REF_SLUG is $got_digest, expected $src_digest from $IMAGE:$TAG" >&2
        exit 1
      fi
    - *reuse_evidence
  artifacts:
    paths:
      - ci-reuse-evidence/
    expire_in: 1 week

# One slice each. `parallel: 4` sets CI_NODE_INDEX (1-based) and
# CI_NODE_TOTAL, which is exactly MV_SHARD's shape. Four, because the
# light lane runs four at a time and the shards all sit there: a fifth
# would queue behind the first four and add nothing but a longer window.
# The image runs as its own `node` user (the gate must not run as root --
# docs/decisions/gitlab-ci-root-in-container-test-failure.md) and the
# executor checks out world-writable, so no chown dance is needed here.
#
# A hidden template, `<<:`-merged into the three concrete jobs below,
# rather than repeating the script: gate:scenarios (Chromium, every MR
# and `dev` pipeline) and the two engines #1306 adds (Firefox and
# WebKit, dev -> preview merge requests only) run the identical shard
# script, so it is written once here. Each concrete job supplies its own
# `rules:` -- the one thing that has to differ -- by merging *git_safe
# (and *dev_or_mr_code for Chromium alone) alongside this anchor rather
# than through it, since a job cannot merge two anchors that both set
# `rules:`.
.gate_scenarios_shard: &gate_scenarios_shard
  stage: gate
  tags: [light]
  image: $CI_REGISTRY_IMAGE/live-check:$CI_COMMIT_REF_SLUG
  parallel: 4
  timeout: 30m
  # #1304 item E7: node_modules for this image's own `node` user, keyed
  # separately from .npm_cache so it never crosses paths with the
  # root-owned cache (see live_check_npm_cache_entry above). All four
  # shards, times three engines once #1306 lands, pull and push the same
  # key: they install identical node_modules from the same lockfile, so
  # a race on the upload just leaves whichever shard finished last, not
  # a corrupt cache.
  cache:
    - *live_check_npm_cache_entry
  script:
    # #1066: CI_JOB_NAME under `parallel: 4` is "gate:scenarios 1/4" etc,
    # exactly the shape scripts/ci-reuse-inputs.js's JOB_INPUTS uses. Node
    # is already in this image, so no install is needed to run the gate.
    - *reuse_gate
    - set -o pipefail
    # #1032: how much CPU does a shard actually use, as opposed to how
    # long it occupies a slot? The infra audit ranked this job the
    # biggest consumer of the shared `light` lane, but classified it
    # IO-bound from its name rather than from measurement, and the code
    # does not settle it: `npm ci` and the live instance burn CPU, while
    # the scenarios themselves mostly poll and wait.
    #
    # Deliberately started here rather than in a `before_script`: this
    # job takes its before_script from .git_safe, and a job-level one
    # replaces an inherited one outright rather than adding to it (the
    # chr-exercise job carries the same warning), so adding one here
    # would quietly drop the safe.directory setup and break the
    # checkout. `script` runs in the same shell straight after it, so
    # starting the clock on the first line costs nothing and clobbers
    # nothing.
    - echo "MV_CPU_START=$(awk '/^usage_usec/{print $2}' /sys/fs/cgroup/cpu.stat 2>/dev/null) MV_T_START=$(date +%s) MV_CPUS=$(nproc)" > /tmp/mv-cpu-$CI_NODE_INDEX
    - (cd frontend && npm ci)
    # Both cgroup samples must be taken by this shell. The first attempt
    # closed the clock in `after_script`, which the executor runs as its
    # own step with its own cgroup, so `usage_usec` there started again
    # near zero: all four shards of pipeline 702 reported `cpu=0s`, and
    # two of them a *negative* average -- impossible from one cgroup,
    # because the counter only ever climbs. Hence the exit-code dance
    # below rather than the obvious extra script line: `make live-check`
    # is allowed to fail, and a red shard must still close its clock.
    - |
      set +e
      MV_SHARD="$CI_NODE_INDEX/$CI_NODE_TOTAL" make live-check 2>&1 | tee "gate-shard-$CI_NODE_INDEX.log"
      mv_rc=$?
      echo "MV_CPU_END=$(awk '/^usage_usec/{print $2}' /sys/fs/cgroup/cpu.stat 2>/dev/null) MV_T_END=$(date +%s)" >> /tmp/mv-cpu-$CI_NODE_INDEX
      # Evidence only on a real pass (#1066): the LAST thing this shard
      # does when it did the work, so a red or cancelled shard leaves none
      # and the next pipeline reruns it rather than trusting a shard that
      # never finished.
      if [ "$mv_rc" -eq 0 ]; then
        node scripts/ci-reuse-gate.js evidence "$CI_JOB_NAME"
      fi
      exit $mv_rc
  # after_script now does arithmetic and nothing else: both readings are
  # taken above and left on disk, which is also how they survive into
  # this fresh shell.
  after_script:
    - |
      set +e
      start_file=/tmp/mv-cpu-$CI_NODE_INDEX
      if [ ! -f "$start_file" ]; then
        echo "cpu-measure shard $CI_NODE_INDEX: no start sample -- the job died before the first script line"
        exit 0
      fi
      . "$start_file"
      # cgroup v2 only, and only when the container has its own cgroup
      # namespace. Rather than print a confident wrong number if either
      # is untrue, say which piece is missing.
      if [ -z "$MV_CPU_START" ]; then
        echo "cpu-measure shard $CI_NODE_INDEX: /sys/fs/cgroup/cpu.stat has no usage_usec -- not cgroup v2, or not readable in this container"
        exit 0
      fi
      # Only a cancel or a timeout gets here: an ordinary red shard still
      # closes its own clock. There is no honest number to print.
      if [ -z "$MV_CPU_END" ]; then
        echo "cpu-measure shard $CI_NODE_INDEX: no end sample -- the job was cancelled or timed out before the work finished"
        exit 0
      fi
      wall=$(( MV_T_END - MV_T_START ))
      if [ "$wall" -le 0 ]; then
        echo "cpu-measure shard $CI_NODE_INDEX: wall time was ${wall}s -- nothing to average over"
        exit 0
      fi
      used=$(( MV_CPU_END - MV_CPU_START ))
      # What pipeline 702 did, and what a confident `0` hid. A shard that
      # ran for minutes cannot have used no CPU at all, so a flat or
      # falling counter means the two samples did not come from one
      # cgroup -- report that rather than a number someone would rank a
      # lane by.
      if [ "$used" -le 0 ]; then
        echo "cpu-measure shard $CI_NODE_INDEX: the counter did not move over ${wall}s (start=${MV_CPU_START} end=${MV_CPU_END}) -- unusable, not a real zero"
        exit 0
      fi
      cpu=$(( used / 1000000 ))
      avg=$(awk "BEGIN{printf \"%.2f\", $used / 1000000 / $wall}")
      echo "cpu-measure shard $CI_NODE_INDEX: wall=${wall}s cpu=${cpu}s avg_cpus=${avg} of ${MV_CPUS} visible"
      # A shard cannot use more cores than the container can see. If it
      # appears to, the counter being read is the host's and not this
      # job's -- a shared cgroup namespace -- and the number means
      # nothing. Worth saying loudly: a bogus figure here would be used
      # to make a scheduling decision.
      awk "BEGIN{exit !($avg > $MV_CPUS)}" && echo "cpu-measure shard $CI_NODE_INDEX: WARNING avg_cpus exceeds the ${MV_CPUS} cores this container can see -- reading the host cgroup, treat as unusable"
      echo "$avg" > "cpu-measure-shard-$CI_NODE_INDEX.txt"
  artifacts:
    when: always
    paths:
      - gate-shard-*.log
      - cpu-measure-shard-*.txt
      - ci-reuse-evidence/
    expire_in: 1 week

gate:scenarios:
  <<: [*dev_or_mr_code_heavy, *git_safe, *gate_scenarios_shard]

# #1306: dev -> preview also runs the scenario suite under Firefox and
# WebKit, not only Chromium -- owner ruling 2026-09-20. The live-check
# image already carries all three engines (AGENTS.md, "The second host
# live-check runs on"); #659 shipped a static `style` attribute Chromium
# tolerates and Firefox refuses under this app's CSP, past a
# Chromium-only gate, found only by the owner opening the app -- these
# two engines are part of the dev -> preview promotion specifically so
# that class of defect is caught here instead. A branch-tip push and an
# ordinary merge request into `dev` stay Chromium-only: nothing here
# changes gate:scenarios above.
#
# Rule shape copied from policy:promotion-hop (not the #1038 docs-only
# ladder gate:scenarios uses): this blocks the merge exactly like the
# Chromium shards -- same `gate` stage, no `allow_failure` -- on every
# dev -> preview merge request, docs-only diff or not.
gate:scenarios:firefox:
  <<: [*git_safe, *gate_scenarios_shard]
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"'
  variables:
    MV_BROWSER: firefox

gate:scenarios:webkit:
  <<: [*git_safe, *gate_scenarios_shard]
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"'
  variables:
    MV_BROWSER: webkit

# #1459: the scenarios listed in scripts/quarantine.txt are skipped by every
# gate:scenarios shard above; this job runs just those, so a quarantined
# flake keeps being exercised and its docs/flakes.md log can still grow
# sightings. Never blocks: allow_failure is on, and a red run here is a
# sighting to log, not a reason to hold a merge. Same lane, image, cache and
# rules as a Chromium shard, but no `parallel` (the list is short) and no
# reuse-gate evidence (a pass here proves nothing a merge may lean on), so it
# is written out rather than merged from the shard anchor, whose
# `parallel: 4` and CI_NODE_INDEX script cannot be undone. MV_SHARD=1/1 keeps
# `make live-check` to the browser scenarios only, as in a shard. An empty
# list is the normal state once every flake is fixed, so it exits 0 with a
# message rather than driving a whole instance for nothing.
gate:scenarios:quarantined:
  <<: [*dev_or_mr_code_heavy, *git_safe]
  stage: gate
  tags: [light]
  image: $CI_REGISTRY_IMAGE/live-check:$CI_COMMIT_REF_SLUG
  timeout: 30m
  allow_failure: true
  variables:
    MV_QUARANTINE: only
    MV_SHARD: "1/1"
  cache:
    - *live_check_npm_cache_entry
  script:
    - set -o pipefail
    - |
      if [ -z "$(scripts/run-scenarios.sh --list)" ]; then
        echo "gate:scenarios:quarantined: scripts/quarantine.txt lists no scenarios -- nothing to run"
        exit 0
      fi
    - (cd frontend && npm ci)
    - make live-check 2>&1 | tee gate-quarantined.log
  artifacts:
    when: always
    paths:
      - gate-quarantined.log
    expire_in: 1 week

# The four standalone shell checks (scripts/run-live-scripts.sh), once,
# plus the quiet-host and other plain-bash unit tests (#1003, #1337) --
# no live instance needed, so they run here rather than earning their
# own job.
gate:scripts:
  stage: gate
  tags: [light]
  image: $CI_REGISTRY_IMAGE/live-check:$CI_COMMIT_REF_SLUG
  <<: [*dev_or_mr_code_heavy, *git_safe]
  timeout: 30m
  # #1304 item E7: same live-check-user npm cache gate:scenarios' shards
  # share -- see live_check_npm_cache_entry above.
  cache:
    - *live_check_npm_cache_entry
  script:
    - set -o pipefail
    - (cd frontend && npm ci)
    - make live-check-scripts 2>&1 | tee gate-scripts.log
    - deploy/quiet-host/quiet-host-apply.test.sh
    - scripts/quiet-host.test.sh
    - scripts/wait-quiet-host.test.sh
    - scripts/assert-ui-built.test.sh
    - scripts/check-release-surfaces.test.sh
    - scripts/dockerignore.test.sh
    - scripts/gitignore.test.sh
    - scripts/install.test.sh
    - scripts/ensure-cosign.test.sh
    - scripts/sign-release-digest.test.sh
    - scripts/verify-release-signature.test.sh
    # #1358: these four existed but nothing ran them, so the recorder's
    # scripted session broke on v0.6.1 with every test still green.
    - scripts/record-upgrade-fixture.test.sh
    - scripts/upgrade-fixture-session.test.sh
    - scripts/check-upgrade-fixtures-recorded.test.sh
    - scripts/live-web-dist.test.sh
    - scripts/gate-summary.test.sh
  artifacts:
    when: always
    paths:
      - gate-scripts.log
    expire_in: 1 week

# perf:promotion (#1003) -- the dev -> preview promotion gate refuses a
# regression rather than merely recording one. It runs probe-perf.mjs
# (frontend/scripts/probe-perf.mjs -- deck-to-deck roll times, long-task
# totals per phase, docket-scroll mean frame time) against a fresh instance
# from scripts/live-env.sh, exactly as `make live-check` starts one, then
# diffs the result against the committed frontend/perf-baseline.json with
# perf-compare.mjs. No baseline yet: the run records one as an artifact
# and passes, printing what to commit. Baseline present: a metric worse
# than it by more than 30% *and* more than 300ms (mean scroll frame: 30%
# and 4ms) fails the job -- both conditions, so noise on a small number can't
# trip it. Accepting a regression means committing the new numbers in the
# same MR, so the change is reviewed rather than silently overwritten.
#
# The box this runs on (`big`) also carries every other runner in the
# group and mikroview's own dev gate loop, so a fair measurement needs
# the rest of that work out of the way, not just a quiet moment: hold ->
# drain -> measure -> release.
#   - hold: scripts/quiet-host.sh writes a flag the host's root-owned
#     unit reacts to (deploy/quiet-host/) by setting `concurrent = 1` on
#     the runner, so no sibling job starts while this one measures. No
#     token is involved -- a flag file and a script the owner installed
#     once. Until that install happens, this step refuses with exit 2:
#     that is expected, not a bug, and deploy/quiet-host/README.md has
#     the install steps.
#   - drain: scripts/wait-quiet-host.sh still waits for whatever was
#     already running to finish, since holding stops new work, not work
#     in flight. It watches CPU busy from /proc/stat, not only the load
#     average: the light-lane shards start a second before this job and
#     the one-minute average had not moved when it first looked (#1099).
#   - measure: probe-perf.mjs against the fresh instance, as before.
#   - release: the after_script below always runs -- pass, fail, timeout
#     or cancel -- so the hold never outlives the job on purpose. If the
#     job dies without even that, the flag carries its own expiry (this
#     job's timeout plus 5 minutes) and the host's minutely timer
#     releases it -- the self-heal for the stuck case.
#
# resource_group still serialises this against any other promotion MR
# measuring at the same time -- two at once would each see the other's
# CPU as noise in its own numbers, and a second `hold` would queue
# behind the first anyway.
#
# Timeout arithmetic, corrected 2026-09-06 from the job's first four runs
# on the runner rather than from workstation figures: npm ci measured 11,
# 13, 14 and 21s, not the ~90s originally assumed; quiet-host hold applied
# in 5s, and wait-quiet-host's drain is bounded at 600s because it gives
# up and fails there (scripts/wait-quiet-host.sh, MAX_WAIT_S); the probe
# took 38s unseeded, and will be longer now it renders 3000 events.
#
# The drain cap sets the bound, not npm ci. Worst case is roughly 60s
# npm ci + 60s hold + 600s drain + 180s probe, about 16 minutes.
#
# Plus the queue, since 2026-09-24: `hold` now waits for any other hold
# on the host rather than failing, and the orbit-base-image Node compile
# takes one for about forty minutes (orbit#1106). The host caps any hold
# at an hour, and `hold` queues for up to 65 minutes (QH_QUEUE_MAX_S), so
# 16 + 65 is about 81 minutes: 90m. A run that does not queue still takes
# its usual few minutes; the limit only matters when it does.
perf:promotion:
  stage: gate
  tags: [big]
  image: $CI_REGISTRY_IMAGE/live-check:$CI_COMMIT_REF_SLUG
  <<: *git_safe
  # The #1038 ladder, target-branch guard and all: a job that
  # holds the whole host quiet is the one most worth not running for a
  # prose change. In practice it will almost always run anyway, because a
  # promotion merge request is diffed against the preview tip and so
  # carries every commit since the last promotion.
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"
      changes: *code_paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"
      changes: *docs_only_paths
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"
  resource_group: perf-promotion
  timeout: 90m
  # #1104: the hold stops the runner picking up *new* jobs; it cannot
  # stop the scenario shards this pipeline already started, and they run
  # for ten minutes on the same box. Twice (pipelines 899 and 914) the
  # probe measured a scroll frame p95 of 33 ms with three shards still
  # compiling beside it, against 16.8 ms on a quiet box for the same
  # commit. So start only when this pipeline's other gate jobs are done.
  # `optional`, because a docs-only diff runs neither of them (#1038),
  # and a missing hard need would skip this job silently.
  needs:
    - job: gate:scenarios
      optional: true
      artifacts: false
    - job: gate:scenarios:firefox
      optional: true
      artifacts: false
    - job: gate:scenarios:webkit
      optional: true
      artifacts: false
    - job: gate:scripts
      optional: true
      artifacts: false
  # This is the only `big` job that runs as a non-root user (the image's
  # `node`, uid 1000), and it shares its per-slot checkout with test:go,
  # whose after_script hands the whole tree to root:root (#908). Whenever
  # two pipelines' big jobs overlap, test:go lands in the slot this job
  # reuses and live-env.sh can no longer clear web/dist (#1048: jobs 8292
  # and 8477, red twice in one afternoon). This flag makes the runner
  # chown the build directory to the image's uid at job start instead of
  # relying on umask 0000 -- set here alone: gate:scenarios on `light`
  # depends on the world-writable checkout (comment above it).
  variables:
    FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
  # #1304 item E7: the same live-check-user npm cache gate:scenarios and
  # gate:scripts share (live_check_npm_cache_entry above) -- this job
  # runs the identical image as the same uid 1000, so ownership is never
  # the issue .npm_cache hit. It runs on the `big` lane rather than
  # `light`; if that lane's runner does not share cache storage with
  # `light`'s this is a harmless miss, same cold npm ci as today.
  cache:
    - *live_check_npm_cache_entry
  script:
    - set -o pipefail
    - t0=$(date +%s)
    - (cd frontend && npm ci)
    - 't1=$(date +%s); echo "npm ci wall seconds: $((t1 - t0))"'
    - scripts/quiet-host.sh hold
    - scripts/wait-quiet-host.sh
    - 't2=$(date +%s); echo "hold+drain wall seconds: $((t2 - t1))"'
    # Two lines, not `eval "$(... up)"`: `up` fails with a message on
    # stderr and nothing on stdout, and eval of an empty string is 0, so
    # the one-liner threw the exit status away and the job died a second
    # later on the seed's "Connection refused" instead (#1048). The
    # assignment keeps the substitution's status, so the real error is
    # the one GitLab shows.
    - mv_env="$(scripts/live-env.sh up)"
    - eval "$mv_env"
    - trap 'scripts/live-env.sh down >/dev/null 2>&1 || true' EXIT
    # Seed before measuring. Without this the probe rendered an empty
    # instance: `up` creates no events, and the 300-event baseline other
    # suites feed comes from run-scenarios.sh, which this job does not
    # call. The first successful run (job 5833) measured 16.7ms frames
    # and zero long tasks on every surface -- which is what an idle app
    # with nothing on screen looks like, not a result. A gate that
    # renders an empty screen passes exactly the regressions that only
    # appear with rows on it, which is the failure #690 describes.
    #
    # perfseed's defaults -- 3000 stream events and 500 port scans --
    # are gate numbers, not realistic ones: enough to fill the docket,
    # the stream and the entity lists, well short of the demo's
    # pathological hour (~8000 events, 2462 New device episodes, #690),
    # and fixed so run-to-run comparison stays meaningful. Change either
    # and the baseline must be regenerated -- perf-compare.mjs would
    # otherwise be diffing two different workloads.
    #
    # #1100: this was `syslog 3000 perf-seed`, whose every line went to
    # port 443, so no detector ever fired. The docket was empty on every
    # run, the baseline recording included, and the scroll phase below
    # measured scrolling an empty list. perfseed sends both halves.
    - scripts/live-env.sh perfseed
    - t3=$(date +%s)
    - node frontend/scripts/probe-perf.mjs --json perf-current.json
    - 't4=$(date +%s); echo "probe wall seconds: $((t4 - t3))"'
    - |
      if [ -f frontend/perf-baseline.json ]; then
        node frontend/scripts/perf-compare.mjs frontend/perf-baseline.json perf-current.json
      else
        echo "no baseline -- commit perf-current.json as frontend/perf-baseline.json"
      fi
  after_script:
    - scripts/quiet-host.sh release
  artifacts:
    when: always
    paths:
      - perf-current.json
    expire_in: 4 weeks

# ---------------------------------------------------------------------------
# SECURITY — parallel jobs, diff-scoped Semgrep on MRs, full scan on dev.
# ---------------------------------------------------------------------------

security:semgrep:
  stage: security
  tags: [light]
  image: semgrep/semgrep:1.183.0
  <<: *dev_or_mr_code
  variables:
    # The whole history, as gitleaks below. On a merge request the scan
    # is diff-scoped against $CI_MERGE_REQUEST_DIFF_BASE_SHA, and on the
    # dev -> preview promotion that base is the preview tip, a thousand
    # commits back: outside GitLab's 20-commit shallow default, so
    # semgrep's `git diff --merge-base <base>` failed (exit 128) and the
    # job died with "Exception in BaselineHandler initialization" before
    # scanning a file (!980, first promotion run under #1003). A dev MR
    # never saw it because its base is always within reach.
    GIT_DEPTH: 0
  script:
    # The image sets SEMGREP_IN_DOCKER, which makes semgrep insist the
    # code is bind-mounted at /src and chdir there before it looks at
    # anything (config_resolver.adjust_for_docker). GitLab's docker
    # executor mounts the checkout at $CI_PROJECT_DIR instead and gives
    # a job no way to add a volume, so /src is empty and every run died
    # with "Detected Docker environment without a code volume" -- before
    # scanning a single file. Unsetting it here leaves semgrep working
    # from the job's own directory, which is where the code actually is.
    # Reproduced and the fix confirmed locally under the same image
    # (#912).
    - unset SEMGREP_IN_DOCKER
    # A rule that exceeds --timeout is skipped for that file, and after
    # --timeout-threshold of them semgrep abandons the file entirely and
    # still exits 0. So the job got *greener* the slower the runner was,
    # and a file could contribute no findings without saying so. Two runs
    # over an unchanged tree disagreed: scripts/seed-demo.py reported
    # disabled-cert-validation on one and was abandoned on the other
    # (#918).
    #
    # 120s rather than the 5s default so the slow rules finish, threshold
    # 0 so no file is ever abandoned, and the grep below so that a
    # timeout that still happens fails the job instead of quietly
    # shrinking the scan. An incomplete scan is not a pass.
    - |
      set -o pipefail
      run_semgrep() {
        semgrep scan --config p/security-audit --config p/owasp-top-ten \
          --timeout 120 --timeout-threshold 0 \
          --sarif --output semgrep.sarif --error "$@" 2>&1 | tee semgrep.log
      }
      status=0
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        run_semgrep --baseline-commit "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || status=$?
      else
        run_semgrep || status=$?
      fi
      if grep -q 'timeout error' semgrep.log; then
        echo "A rule timed out, so this scan covered less than it reported on (#918):"
        grep 'timeout error' semgrep.log
        exit 1
      fi
      exit $status
  artifacts:
    when: always
    paths:
      - semgrep.sarif
      - semgrep.log
    expire_in: 1 week
  # See security:gosec's retry comment below (#950): same artifact-upload
  # flake, same fix.
  retry:
    max: 2
    when: [runner_system_failure, api_failure]

security:gosec:
  stage: security
  # Stays on big: gosec loads the whole module graph and peaks at ~6.7 GB,
  # over the light lane's 6 GB cap.
  # ghcr, not Docker Hub. gosec stopped publishing to Docker Hub after
  # 2.24.6, so `securego/gosec:2.28.0` resolved to nothing and the job
  # failed before it started -- an image pull failure, which reads like
  # a registry outage rather than a tag that was never published.
  # Bumped to the current release while here, per AGENTS.md's
  # pin-to-latest rule (#912).
  #
  # entrypoint: [""] for the same reason gitleaks and trivy below carry
  # it: this image's entrypoint is a wrapper that execs `/bin/gosec $@`,
  # so GitLab's generated shell script would arrive as gosec's arguments
  # rather than as a script to run. That is the failure this job would
  # have hit next, once the pull succeeded.
  image:
    name: ghcr.io/securego/gosec:2.30.0
    entrypoint: [""]
  <<: *dev_or_mr_code
  # The image ships its own Go (1.27.0 in 2.29.0) with GOTOOLCHAIN=local,
  # so the moment go.mod asks for a newer patch (#1312 pinned 1.27.3;
  # 1.27.4 since #1202)
  # gosec cannot load a single package -- and in SARIF mode it says
  # nothing about why: exit 1, an empty results array, one second of
  # runtime. The fix installs the exact go.mod toolchain over the
  # image's own, the same tarball-and-cache dance test:build-checks and
  # security:licence-policy already do -- see go_toolchain_cache_entry
  # above -- rather than paying for a fresh download from go.dev on
  # every MR and dev pipeline. `auto` stays set as a safety net: if the
  # cache is ever stale (go.mod bumped past what the tarball below
  # names), Go still fetches the right one itself instead of failing the
  # way GOTOOLCHAIN=local would. `go version` prints which one actually
  # ran so the next mismatch is readable in the log rather than
  # reconstructed from the timing.
  variables:
    GOTOOLCHAIN: auto
  cache:
    - *go_toolchain_cache_entry
  script:
    # This image is Alpine (gosec's own base), with tar but no curl --
    # the one line the other two jobs' node:26-bookworm image does not
    # need.
    - apk add --no-cache curl
    - mkdir -p .go-toolchain-cache
    - test -f .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz || curl -fsSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - tar -C /usr/local -xzf .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - gosec -fmt=sarif -out=gosec.sarif -severity=high -confidence=high ./...
  artifacts:
    when: always
    paths:
      - gosec.sarif
    expire_in: 1 week
  # #950: this job's scan finished clean three times in a row on MR !944
  # and still failed the merge, because GitLab's coordinator returned 502
  # to the runner's artifact upload each time and the runner gave up
  # rather than retrying that class of failure -- a red job for a green
  # scan. runner_system_failure covers the runner exhausting its own
  # upload attempts; api_failure covers the coordinator-side error a 502
  # is. Confirmed accepted by the CI lint API (`glab api -X POST
  # projects/53/ci/lint`), including a warning that the deprecated
  # stuck_or_timeout_failure/job_execution_timeout pair (not used here)
  # should not be added. Never add script_failure: that would retry past
  # a real gosec finding instead of just past the upload flake.
  retry:
    max: 2
    when: [runner_system_failure, api_failure]

security:govulncheck:
  stage: security
  tags: [light]
  image: golang:1.27.4
  <<: [*dev_or_mr_code, *git_safe]
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - govulncheck -format=json ./... > govulncheck.json
    # The JSON run above exits 0 whatever it finds -- that is how -format
    # json behaves -- so on its own this job could only ever pass. The
    # plain run is the gate: it exits non-zero on a reachable
    # vulnerability, as GitHub's ci.yml did before #935 step 7 moved that
    # check here.
    - govulncheck ./...
  artifacts:
    when: always
    paths:
      - govulncheck.json
    expire_in: 1 week
  # See security:gosec's retry comment above (#950): same artifact-upload
  # flake, same fix.
  retry:
    max: 2
    when: [runner_system_failure, api_failure]

# The two remaining halves of GitHub's ci.yml `security` job, moved here
# under #935 step 7. Their long rationale is in that file's history
# (ci.yml at 65fbc05); the short form:
#
# The fuzz step is a regression gate, not a campaign: it replays each
# parser's seed corpus (the f.Add calls in its own source, #526) plus a
# little fresh exploration, so a newly-introduced crash on attacker-shaped
# input fails the merge request. Budgets are execution counts (`Nx`), not
# durations, so the gate does the same work on a busy runner as an idle
# one (#523) -- do not "tidy" them back to `30s`. A crashing input is
# written to internal/<pkg>/testdata/fuzz/, which the artifact below
# rescues from the discarded workspace; commit it, and plain `go test`
# replays it forever.
security:fuzz:
  stage: security
  tags: [light]
  image: golang:1.27.4
  <<: [*dev_or_mr_code_heavy, *git_safe]
  timeout: 15m
  script:
    - go test ./internal/routeros/ -run FuzzParse -fuzz FuzzParse -fuzztime=160000x
    - go test ./internal/syslog/ -run FuzzParseEnvelope -fuzz FuzzParseEnvelope -fuzztime=590000x
    - go test ./internal/ingest/ -run FuzzDecodePayload -fuzz FuzzDecodePayload -fuzztime=156000x
  artifacts:
    when: on_failure
    paths:
      - internal/*/testdata/fuzz/
    expire_in: 30 days

# zizmor (MIT) on .github/workflows/, offline (no GitHub token). It has no
# release checksums file and its image sets an entrypoint a job script cannot
# use, so the release tarball is fetched into node:26-bookworm and checked
# with sha256sum -c; the sum is GitHub's recorded digest for the asset and was
# checked against a download.
security:zizmor:
  stage: security
  tags: [light]
  image: node:26-bookworm
  needs: []
  <<: *dev_or_mr
  interruptible: true
  # blocking since its findings reached zero (#1462)
  variables:
    ZIZMOR_VERSION: "1.32.0"
    ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
  script:
    - curl -fsSL -o /tmp/zizmor.tgz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
    - echo "${ZIZMOR_SHA256}  /tmp/zizmor.tgz" | sha256sum -c -
    - tar -xzf /tmp/zizmor.tgz -C /tmp zizmor
    - rc=0
    - /tmp/zizmor --offline --format=plain .github/workflows/ > zizmor-report.txt || rc=$?
    - cat zizmor-report.txt
    - exit $rc
  artifacts:
    when: always
    paths:
      - zizmor-report.txt
    expire_in: 30 days

security:npm-audit:
  stage: security
  tags: [light]
  image: node:26-alpine
  <<: [*dev_or_mr_code_frontend, *npm_cache]
  script:
    - cd frontend
    # The image's bundled npm tries the fast bulk advisory endpoint
    # first, and only on a failure there falls back to
    # /-/npm/v1/security/audits/quick -- the endpoint the registry is
    # retiring, and the one that actually 400'd on #931 (npm's own
    # @npmcli/arborist, lib/audit-report.js: bulk POST wrapped in a
    # try/catch whose catch calls quick). The bulk call passes cleanly
    # against this lockfile every time it was tried; the intermittent
    # trigger was whatever made it fail once and fall through to the
    # endpoint being shut down. npm 12.0.2 -- the current `latest`, checked
    # 2026-09-05 -- removed that fallback outright and only calls bulk, so
    # pin to it rather than trust whatever patch of the image's bundled
    # npm a given runner has cached. Verified in a throwaway node:22-alpine
    # container -- the image this job ran on before #1106 -- against this
    # frontend/: `npm install -g npm@12.0.2 && npm ci && npm audit
    # --audit-level=high` -> "found 0 vulnerabilities", with `--loglevel
    # verbose` showing only a POST to .../security/advisories/bulk, never
    # to .../audits/quick. That check was not re-run on node:26-alpine and
    # does not need to be: the explicit pin above is what decides which npm
    # runs, so the image's own bundled version never gets a say.
    - npm install -g npm@12.0.2
    - npm ci
    - npm audit --audit-level=high

# Checks the licence of every dependency mikroview actually ships -- Go
# modules and the frontend's bundled npm packages, the same inventory
# tools/licenses/generate-notices.mjs attributes -- against
# supply-chain/licence-policy.yml. Replaces
# .github/dependency-review-config.yml, which actions/dependency-review-action
# read on a pull-request diff and stopped running when GitHub became a
# push-mirror with no pull requests (#935); deliberately scoped to what ships
# rather than the whole installed tree, since an earlier version of this job
# walking node_modules wholesale failed on twelve build/test-tooling packages
# that never reach the binary (#945 item 3, #948).
#
# tools/licenses/licence-policy.mjs is the npm half and the one place the
# allow-list lives (supply-chain/licence-policy.yml); its --print-allowed
# feeds the same list into go-licenses' --allowed_licenses for the Go half,
# so the two checks cannot drift apart into disagreeing about what is
# allowed.
#
# licence-policy.mjs also looks inside what ships (#1432): npm
# bundleDependencies by the same licence rules, and a recorded
# bundled-assets review for every npm asset file (images, styles, fonts,
# media, wasm and binary/data/archive types; not .json/.txt/.md/.map), every
# Go //go:embed file of any type, licence-less vendored Go directory and
# inlined other-project source the shipped packages carry. That is why the job's last step needs Go on PATH too.
#
# mikroview itself is AGPL-3.0-only (LICENSE) -- go-licenses' --ignore flag
# below excludes mikroview's own module, so this never flags the project
# shipping under its own licence. That is not the same as allowing AGPL: it
# is not in allow-licenses, so an actual dependency under AGPL still fails,
# exactly like any other disallowed licence.
#
# node:26-bookworm plus the Go tarball, the same combination
# test:build-checks uses: this job needs both toolchains in one image, and
# the Go toolchain is the official tarball pinned to go.mod's version, since
# Debian's packaged Go is too old to read this module.
security:licence-policy:
  stage: security
  tags: [light]
  image: node:26-bookworm
  <<: [*dev_or_mr_code, *git_safe]
  # #1304 item E6: same reasoning as test:build-checks above -- a job
  # cannot merge two `cache:`-defining anchors, so both entries are
  # written out here rather than merging in .npm_cache.
  cache:
    - *npm_cache_entry
    - *go_toolchain_cache_entry
  script:
    - node --test tools/licenses/licence-policy.test.mjs
    - mkdir -p .go-toolchain-cache
    - test -f .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz || curl -fsSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - tar -C /usr/local -xzf .go-toolchain-cache/go1.27.4.linux-amd64.tar.gz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    # `go install` drops the binary in $(go env GOPATH)/bin, which the node
    # image does not have on PATH; pipeline 287 failed with "command not
    # found" for exactly that reason.
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - go install github.com/google/go-licenses/v2@v2.0.1
    - go-licenses check ./... --ignore github.com/tomlawesome/mikroview --allowed_licenses="$(node tools/licenses/licence-policy.mjs --print-allowed)"
    # --ignore-scripts: this install only needs to feed the Vite build
    # licence-policy.mjs runs internally (via npmPackages()) to see which
    # packages' source actually reached the bundle; no postinstall step
    # changes that set (sharp's platform binaries arrive as ordinary
    # optionalDependencies, not through a lifecycle script).
    - (cd frontend && npm ci --ignore-scripts)
    - node tools/licenses/licence-policy.mjs

security:gitleaks:
  stage: security
  tags: [light]
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  # Not gated by #1038. A secret pastes into a paragraph as easily as into
  # code -- a token in a README example, a key in a migration guide -- and
  # this job scans the whole tree, so a docs-only diff is exactly the case
  # it has to keep covering.
  #
  # A fast check (ai/agent-infra#113): it is one of the few jobs that runs on
  # the push to dev, with the 5 minute timeout from .dev-landing-check. Its
  # own rules otherwise stay .dev_or_mr's, minus that anchor's dev-landing
  # skip, which would switch it off on that push.
  extends: .dev-landing-check
  rules:
    - !reference [.dev-landing-check, rules]
    - !reference [.catchup-check, job_rule]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true" || $SIGN_TAG != "")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    # The whole history, not GitLab's shallow default. This job reported
    # 28 leaks that are not leaks, and the depth is why: `.gitleaksignore`
    # pins each accepted finding to commit:path:rule:line, and a shallow
    # clone's oldest commit presents the entire tree as newly added under
    # *its* SHA rather than the SHA that really introduced each line. So
    # every fingerprint missed, and every fixture key in
    # recovery_prompt_test.go came back as a finding. The byte counts say
    # the same thing: 177MB over 102 commits shallow, against 20MB over
    # 999 full, because a truncated history has no diffs to scan, only
    # whole files.
    #
    # Reproduced with `git clone --depth 20` of this repo and the job's
    # own command: 24 findings, all in the file `.gitleaksignore` already
    # covers. A full clone finds none (#912).
    GIT_DEPTH: 0
  script:
    # --redact for the same reason secret-scan.yml gives on the GitHub
    # side: without it, a job that finds a real secret republishes it into
    # the build log and into an artifact anyone with repository access can
    # download. The finding still names the file, the rule and the commit,
    # which is what anyone fixing it needs. This lane had no redaction at
    # all until #912.
    - gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks.sarif
    expire_in: 1 week
  # See security:gosec's retry comment above (#950): same artifact-upload
  # flake, same fix.
  retry:
    max: 2
    when: [runner_system_failure, api_failure]

# Shared by the Trivy jobs. Pinned by digest, never by tag (#1462): Trivy's
# own release channels were hijacked in March 2026 (CVE-2026-33634) by
# repointing tags. The digest is the multi-arch index of 0.76.2, the same
# on Docker Hub and GHCR. test:container copies the binary out of this
# same reference; change both together (supply-chain/pins-policy.json).
.trivy:
  stage: security
  tags: [light]
  image:
    name: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache
  # See security:gosec's retry comment above (#950): same artifact-upload
  # flake, same fix.
  retry:
    max: 2
    when: [runner_system_failure, api_failure]

security:trivy-fs:
  extends: .trivy
  <<: *dev_or_mr_code
  script:
    # Full-severity report kept as the SARIF artifact for visibility only --
    # exit-code 0, never fails the job by itself. --include-dev-deps:
    # frontend/package.json declares 0 runtime "dependencies" (this Vite
    # layout puts everything under devDependencies even though it all
    # reaches the built bundle), so without the flag trivy silently reports
    # "no supported files" for npm and this scan covers Go modules only.
    - trivy fs --exit-code 0 --severity CRITICAL,HIGH,MEDIUM,LOW --scanners vuln,license --include-dev-deps --format sarif --output trivy-fs.sarif .
    # The real gate (#1079): fails the job on a fixed-available CRITICAL or
    # HIGH vulnerability (--ignore-unfixed: no point blocking on a fix that
    # doesn't exist yet). Licences stay report-only above, not gated here.
    # Trivy's licence scanner reads the whole npm tree including build-only
    # native tooling -- sharp/libvips (LGPL-3.0-or-later) and lightningcss
    # (MPL-2.0) -- none of which reaches the shipped frontend bundle. The
    # project's own shipped-scope licence gate (security:licence-policy,
    # tools/licenses/licence-policy.mjs) already covers what actually ships
    # and deliberately excludes build tooling for this reason; gating here
    # too would fail the pipeline on packages already decided to be fine.
    - trivy fs --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --include-dev-deps .
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
    expire_in: 1 week

# Misconfiguration scan (#1462) of the whole checkout: every Dockerfile
# (Dockerfile, live-check.Dockerfile, scripts/live-routeros*.dockerfile)
# and deploy/docker-compose.yml. Trivy 0.76 has no compose checks, so it
# lists the compose file as nothing to scan; it is named here so it is
# covered the day it gains them. False alarms sit in .trivyignore.yaml,
# which, unlike .trivyignore, can scope an ignore to one file, so a check
# waived for a workstation fixture still runs on the shipped Dockerfile.
security:trivy-config:
  extends: .trivy
  <<: *dev_or_mr_code
  script:
    - trivy config --ignorefile .trivyignore.yaml --exit-code 1 --severity HIGH,CRITICAL .

# #1472 job 4: the SBOM of the image build:image built, read straight from
# its image.tar -- no daemon, no rebuild -- in SPDX JSON, kept 90 days as
# the evidence sign:release-digest attests to the pushed digest (`cosign
# attest --type spdxjson`). The second command is a vulnerability gate at
# security:trivy-fs's policy (fixed-available HIGH or CRITICAL fails), on
# the image rather than the checkout; test:container runs the same scan
# (#1462), which is cheap, and this one is the one publish:image names.
# Runs on merge requests and dev too, so a broken SBOM step shows up
# before a promotion rather than on the push that should publish.
security:trivy-image:
  extends: .trivy
  rules:
    - !reference [.publish_ref, rules]
    - !reference [.dev_or_mr_code_heavy, rules]
  needs:
    - job: build:image
      artifacts: true
  script:
    - trivy image --input image.tar --format spdx-json -o image.spdx.json
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --input image.tar
  artifacts:
    paths:
      - image.spdx.json
    expire_in: 90 days

# ---------------------------------------------------------------------------
# SYNC — GitHub is a mirror of dev, preview and main, and of release tags.
# After a push to any of the three (a merge here lands as a push),
# mirror-to-github pushes that branch to GitHub. It runs only once the
# owner has set MIRROR_TO_GITHUB=true (#935 step 4).
#
# A `v*` tag is a release (owner decision on #572, 2026-09-10: the tag is
# made here, because GitLab is the source of truth, and GitHub's docker
# workflow publishes from the tag it receives). The tag must be protected
# (`v*` under Settings > Repository) or the protected variable below is
# empty and the job fails on its first check -- which is the right
# outcome for an unprotected tag claiming to be a release.
#
# The mirror pushes over SSH with a GitHub deploy key -- one repository,
# push only, no API access -- held in GITHUB_MIRROR_SSH_KEY, a protected
# file-type CI/CD variable. GitHub's rulesets on the three branches exempt
# deploy keys and nothing else, so no owner token is ever able to bypass
# them (owner decision on #935, 2026-09-04). Protected-only means the
# variable is empty on an unprotected branch: preview and main must be
# protected here before their first promotion.
#
# GitHub's SSH host keys come from api.github.com/meta over TLS rather than
# ssh-keyscan, so the first connection is verified rather than trusted.
#
# There was a second job here that closed GitHub issues from the merged
# merge request. It is gone: issues live on GitLab now (owner decision on
# #935, 2026-09-04), and GitLab closes them itself from the merge request
# description, because dev is this project's default branch.
# ---------------------------------------------------------------------------

sync:mirror-to-github:
  stage: sync
  # Light lane (#949): a git push, no build.
  tags: [light]
  # Plain alpine plus git, like policy:promotion-hop. alpine/git's entrypoint
  # is git itself, so the runner's shell arrives as `git sh` and the job dies
  # before its script (dev pipeline 193).
  image: alpine:3.24
  # `needs: []`: the mirror reflects the branch, not the pipeline. The merge
  # request already ran lint, test and security before it merged; a flaky
  # test on the post-merge run must not leave GitHub behind, silently.
  needs: []
  # #952: pushes to GitHub -- never cut mid-write.
  interruptible: false
  # Not gated by #1038: the mirror reflects the branch, not the diff. A
  # docs-only merge is a commit GitHub must receive like any other, and
  # this job's rule keys off `push` rather than .dev_or_mr anyway.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
      variables:
        MIRROR_REF: refs/heads/$CI_COMMIT_BRANCH
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && $CI_COMMIT_TAG =~ /^v[0-9]/'
      variables:
        MIRROR_REF: refs/tags/$CI_COMMIT_TAG
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is ${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH} protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # GitLab's variable editor trims the key's final newline, and OpenSSH
    # refuses a key without one ("error in libcrypto", dev pipeline 198).
    # Strip CRs, put the newline back, and prove the key loads before
    # trying GitHub -- without printing any of it.
    - tr -d '\r' < "$GITHUB_MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
    - '[ -n "$(tail -c1 ~/.ssh/mirror_key)" ] && echo >> ~/.ssh/mirror_key || true'
    - 'head -1 ~/.ssh/mirror_key | grep -q "PRIVATE KEY" || { echo "GITHUB_MIRROR_SSH_KEY does not begin with a PRIVATE KEY header -- was the public half pasted?"; exit 1; }'
    - 'ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null || { echo "GITHUB_MIRROR_SSH_KEY is not a readable private key ($(wc -l < ~/.ssh/mirror_key) lines) -- re-paste the whole file"; exit 1; }'
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/mikroview.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/mikroview.git
    # Never --force: if this is refused non-fast-forward, something wrote to
    # GitHub's copy and the branch has forked. Reconcile by merge (#935).
    # A tag refused as already existing means GitHub has a different
    # commit under that name -- a release that was never made here.
    - git push github "HEAD:$MIRROR_REF"

# ---------------------------------------------------------------------------
# PUBLISH (#1472) -- GitLab builds, signs and publishes the product image;
# GitHub only copies the signed digest to GHCR (.github/workflows/
# publish-from-gitlab.yml on preview, release-on-tag.yml on a v* tag;
# docker.yml no longer builds).
#
# Build once, test the built bytes, promote by digest -- orbit's shape
# (build_image -> record_image -> sign_evidence -> publish_channel):
#
#   build:image          the one build, saved as image.tar
#   test:container,      smoke test, release checks and SBOM/vulnerability
#   release:check-version, scan, all on that tar
#   security:trivy-image
#   publish:image        pushes the tar to $CI_REGISTRY_IMAGE:sha-<commit>,
#                        records the digest it landed on (evidence JSON)
#   sign:release-digest  key-based signature + SPDX attestation, on that digest
#   publish:channel      verifies the signature, then gives the digest its
#                        consumable name: :preview or :vX.Y.Z
#
# Registry scheme, registry.tomlawson.io/ai/mikroview: sha-<full sha>
# (kept 7 days by the cleanup policy), preview and vX.Y.Z (kept). No
# `latest` here: latest is GHCR's, moved by GitHub on the highest release
# tag (owner, #1472). Nothing consumable exists before its signature verifies.
# ---------------------------------------------------------------------------

# #1472 job 5. The needs are the full bar on a publishing ref: every
# test:* and security:* job that runs there (the rest run on the merge
# request that was promoted), plus the release checks on a tag.
#
# The pushed digest is pulled back and its image ID compared with the
# tested image's (orbit's publish-image.sh): the evidence then names the
# bytes that were tested, not merely whatever the sha- tag resolved to.
# The evidence is written the moment that check passes, before anything
# else (scripts/gitlab-record-tested-image.sh says why). No channel tag
# moves here; publish:channel does that once the signature verifies.
publish:image:
  extends: .dind
  stage: sync
  # Pushes to the registry -- never cut mid-write (#952).
  interruptible: false
  timeout: 20m
  rules:
    - !reference [.publish_ref, rules]
  needs:
    - job: build:image
      artifacts: true
    - job: release:check-version
      optional: true
    - job: test:container
    - job: security:trivy-image
  script:
    - apk add --no-cache bash >/dev/null
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      set -eu
      tested_id="$(docker image inspect --format '{{.Id}}' "mikroview-ci:$CI_COMMIT_SHA")"
      built_at="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' "mikroview-ci:$CI_COMMIT_SHA")"
      docker tag "mikroview-ci:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA"
      docker push "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA"
      digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA" --format '{{.Manifest.Digest}}')"
      case "$digest" in
        sha256:????????????????????????????????????????????????????????????????) ;;
        *) echo "publish:image: the registry returned no sha256 digest for sha-$CI_COMMIT_SHA (got '$digest')" >&2; exit 1 ;;
      esac
      docker pull "$CI_REGISTRY_IMAGE@$digest"
      published_id="$(docker image inspect --format '{{.Id}}' "$CI_REGISTRY_IMAGE@$digest")"
      if [ "$published_id" != "$tested_id" ]; then
        echo "publish:image: $CI_REGISTRY_IMAGE@$digest is image $published_id, not the tested $tested_id" >&2
        exit 1
      fi
      bash scripts/gitlab-record-tested-image.sh "$CI_REGISTRY_IMAGE@$digest" "$digest" "$built_at"
      cat .mv-supply-chain/gitlab-tested-image.json
  artifacts:
    paths:
      - .mv-supply-chain/gitlab-tested-image.json
    expire_in: 90 days

# #1472 job 7. Verifies the key-based signature on the recorded digest
# against the committed cosign.pub -- the same classification
# countersign.yml uses (scripts/verify-release-signature.sh: absence,
# expiry, mismatch, ambiguity all refuse) -- and only then creates the
# channel tag, registry-side (`imagetools create`: no bytes move, so the
# digest cannot change between verification and publication).
#
# The source of the retag is the verified digest itself, not the sha- tag:
# a tag is mutable, a digest is not. The sha- tag must still name that
# digest (anything else means the registry moved under the pipeline and
# nothing is published), and the channel tag is re-read afterwards and
# must resolve to it (gate:image's pattern; --prefer-index=false keeps a
# single manifest on its own digest, #1407).
publish:channel:
  extends: .dind
  stage: sync
  # Publishes a consumable name -- never cut mid-write (#952).
  interruptible: false
  # #1472: one channel retag at a time, project-wide. GitLab runs a
  # resource group's jobs one by one but not in pipeline order, so an
  # older pipeline can still reach the retag after a newer one; the head
  # check below is what stops that rolling :preview back.
  resource_group: publish-channel
  timeout: 20m
  rules:
    - !reference [.publish_ref, rules]
  needs:
    - job: publish:image
      artifacts: true
    - job: sign:release-digest
  script:
    # bash for both scripts; curl and coreutils for ensure-cosign.sh's
    # pinned, checksum-verified download; python3 for the evidence and
    # for verify-release-signature.sh's JSON check.
    - apk add --no-cache bash coreutils curl git python3 >/dev/null
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      set -eu
      digest="$(python3 -I scripts/gitlab-tested-image.py digest .mv-supply-chain/gitlab-tested-image.json "$CI_REGISTRY_IMAGE")"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        channel="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        channel="$CI_REGISTRY_IMAGE:preview"
      fi
      MV_COSIGN="$(bash scripts/ensure-cosign.sh)" bash scripts/verify-release-signature.sh "$CI_REGISTRY_IMAGE@$digest"
      sha_digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHA" --format '{{.Manifest.Digest}}')"
      if [ "$sha_digest" != "$digest" ]; then
        echo "publish:channel: sha-$CI_COMMIT_SHA now names $sha_digest, not the signed $digest -- publishing nothing" >&2
        exit 1
      fi
      # A preview push publishes only while its commit is still preview's
      # head: a newer push's pipeline owns :preview from then on, and an
      # older one finishing late must not move it back. Read through
      # CI_REPOSITORY_URL (the job token's own read access); the URL
      # carries that token, so it is never echoed. A v* tag names one
      # commit for good, so tags skip the check.
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        # ls-remote matches by suffix (zz/refs/heads/preview would match too),
        # so keep only the line for exactly this branch's ref.
        head="$(git ls-remote "$CI_REPOSITORY_URL" "refs/heads/$CI_COMMIT_BRANCH" | awk -v r="refs/heads/$CI_COMMIT_BRANCH" '$2 == r { print $1 }')"
        if [ "$head" != "$CI_COMMIT_SHA" ]; then
          echo "publish:channel: $CI_COMMIT_BRANCH is now at ${head:-<unknown>}, not this pipeline's $CI_COMMIT_SHA -- a newer pipeline publishes :preview; publishing nothing" >&2
          exit 1
        fi
      fi
      docker buildx imagetools create --prefer-index=false -t "$channel" "$CI_REGISTRY_IMAGE@$digest"
      got="$(docker buildx imagetools inspect "$channel" --format '{{.Manifest.Digest}}')"
      if [ "$got" != "$digest" ]; then
        echo "publish:channel: retag moved the digest: $channel is $got, expected $digest" >&2
        exit 1
      fi
      echo "publish:channel: published $CI_REGISTRY_IMAGE@$digest as $channel"

# ---------------------------------------------------------------------------
# RECORD:UPGRADE-FIXTURE — #1247, the second half of the upgrade
# framework (docs/decisions/upgrade-framework.md). Every release needs a
# recording of what it actually wrote, so the next release's gate can
# open it; without this job someone has to remember to run
# scripts/record-upgrade-fixture.sh by hand after every tag, and a
# release nobody remembered is a release nothing tests.
#
# The recording boots the *released image*. Since #1472 that is the one
# this same tag pipeline built, signed and published to this project's
# registry, so the job simply needs publish:channel and pulls the exact
# digest publish:image recorded -- no polling another CI system for it any
# more. scripts/record-upgrade-fixture.sh is handed that reference through
# MV_IMAGE_REF; by hand it still defaults to the GHCR tag.
#
# allow_failure is scoped to exit code 75 (EX_TEMPFAIL), deliberately,
# not a blanket true (#1268 finding 6). The tag is already cut and the
# image already published by the time this runs, so a registry pull that
# fails is not worth a red tag pipeline -- the pull below exits 75 for
# exactly that case, and only that case is allowed to pass quietly. Any
# other failure -- a bug in record-upgrade-fixture.sh or
# upgrade-fixture-session.py, a Docker problem, pg_dump breaking -- exits
# some other code and blocks the pipeline for real, because those mean
# the recording nobody is watching for (see below) silently did not
# happen for a reason that recurs on the next tag too. A red-but-allowed
# job (the 75 case) says "run scripts/record-upgrade-fixture.sh <tag> by
# hand", which is exactly the remedy.
#
# Nothing in this job watches for either kind of failure and says so
# out loud: check:upgrade-fixture-recorded below does (#1274), by
# listing the registry against the committed fixtures on every push
# to dev. This job only stopped lying about which failures are fine.
#
# Stage `sync`, beside the GitHub mirror and the publish jobs: it is the
# same kind of work — something published outside this pipeline once the
# commit is final. The two stages after it exist only for the scheduled
# CHR and Renovate lanes, which a release job has no business sitting in.
#
# Uploads use CI_JOB_TOKEN. That token can write a package and nothing
# else — it cannot push a branch or open a merge request — which is why
# the manifest is uploaded beside the recording rather than committed
# (#1247's decision, 2026-09-16). Committing it stays a review step;
# scripts/fetch-upgrade-fixtures.sh and the two upgrade tests already
# prefer the committed copy and fall back to the uploaded one, so dev's
# next run tests the new release either way.
# ---------------------------------------------------------------------------

record:upgrade-fixture:
  stage: sync
  # Three short-lived containers on a throwaway daemon of its own (.dind)
  # -- read test:container's header for what that does and does not
  # allow. Nothing here publishes a port, which is what makes that work:
  # the recording drives the released container from inside its own
  # network namespace (scripts/upgrade-fixture-session.py).
  extends: .dind
  # The digest comes from publish:image's evidence; publish:channel is
  # what says that digest verified and is now the release.
  needs:
    - job: publish:image
      artifacts: true
    - job: publish:channel
  # #952: this job uploads packages -- never cut mid-write.
  interruptible: false
  # 75 (EX_TEMPFAIL) is only the "could not pull the released image" exit
  # below -- everything else fails the job for real. See the header
  # comment above for why a blanket true was wrong.
  allow_failure:
    exit_codes: 75
  # Three container starts and a pg_dump.
  timeout: 30m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    # bash because both scripts are `#!/usr/bin/env bash` and Alpine
    # ships ash; python3 for the manifest the recording writes and the
    # evidence read below; curl for the package upload; coreutils for
    # `sort -V`, which busybox's sort does not have and the script's
    # version comparison needs. No postgresql-client: pg_dump runs inside
    # the Postgres container itself, so the client is always the server's
    # own major version.
    - apk add --no-cache bash coreutils curl python3 >/dev/null
    - |
      digest="$(python3 -I scripts/gitlab-tested-image.py digest .mv-supply-chain/gitlab-tested-image.json "$CI_REGISTRY_IMAGE")" || exit 1
      export MV_IMAGE_REF="$CI_REGISTRY_IMAGE@$digest"
      # 75 (EX_TEMPFAIL): the one exit code allow_failure above tolerates
      # -- see this job's header comment.
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" &&
        docker pull "$MV_IMAGE_REF" ||
        { echo "could not pull $MV_IMAGE_REF -- record it by hand with scripts/record-upgrade-fixture.sh $CI_COMMIT_TAG"; exit 75; }
      echo "recording $CI_COMMIT_TAG from $MV_IMAGE_REF"
    # The file backend's recording: uploads the tarball and the manifest.
    - bash scripts/record-upgrade-fixture.sh "$CI_COMMIT_TAG"
    # The database's: the same scripted session against a throwaway
    # postgres:18-alpine, uploaded as a gzip'd pg_dump. Recorded on every
    # tag even where the schema version has not moved -- the job cannot
    # know that it has not, and a spare dump costs kilobytes, while a
    # missing one costs a hand step nobody will remember.
    - bash scripts/record-upgrade-fixture.sh --postgres "$CI_COMMIT_TAG"

# #1358 item 3: record:upgrade-fixture above only ever runs on a v* tag,
# against the released image -- so the one time the recorder's scripted
# session first runs against a real image is after the release is cut.
# That is exactly how #1358 happened: v0.6.1 added a second-factor
# enrolment step the session did not do, and nothing caught it before the
# tag because nothing exercised the session any earlier.
#
# There is no published image to point at on a dev -> preview merge
# request -- preview's image is only published after this MR merges, and
# dev deliberately publishes nothing. So this job runs the session against
# build:image's image.tar from this pipeline (#1472): the same Dockerfile
# and checkout, content-identical to what preview will publish once this
# MR lands bar the VERSION stamp. scripts/record-upgrade-fixture.sh
# --check runs the same session against it and never uploads (enforced in
# the script itself, not just by omitting a flag here). Nothing here
# pushes the image anywhere, and nothing commits a fixture; a red job is
# only ever "the session broke."
check:upgrade-fixture-recorder:
  extends: .dind
  stage: test
  needs:
    - job: build:image
      artifacts: true
  rules:
    - !reference [.dev-landing, job_rule]
    - !reference [.catchup-check, job_rule]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview"'
  timeout: 20m
  script:
    - apk add --no-cache bash coreutils python3 >/dev/null
    - docker load -i image.tar
    - bash scripts/record-upgrade-fixture.sh --check "mikroview-ci:$CI_COMMIT_SHA"

# The GitLab half of #1309's two signatures, and the automatic one: this
# job runs on every publishing pipeline -- a push to preview and a v* tag
# (owner, #1472: preview images are signed too) -- and adds a key-based
# signature from a private key that exists only on this dedicated,
# protected `mikroview-signing` runner's host, mounted read-only into its
# jobs. The second, keyless (Sigstore/OIDC) signature is GitHub's, added
# by .github/workflows/countersign.yml -- deliberately manual, started by
# the owner by hand after it verifies this key-based signature against
# the committed cosign.pub (docs/release-signing.md). Requiring the
# owner's own GitHub login for that half is the point: compromising
# GitHub's OIDC issuer alone is not enough to forge both signatures over
# the same digest.
# Same runner-is-the-key-fence reasoning as orbit's `sign_evidence`
# (orbit/docs/releasing.md): this GitLab is CE, which has no protected
# environments or environment-scoped variables, so a CI/CD variable would
# be readable by every job in a protected-branch pipeline.
#
# Since #1472 it signs the digest publish:image pushed to this project's
# registry and recorded in its evidence, rather than waiting for GHCR,
# and attests security:trivy-image's SPDX SBOM to the same digest
# (`cosign attest --type spdxjson`). publish:channel verifies the
# signature before anything gets a consumable name. All the logic is in
# the script -- unit tested in scripts/sign-release-digest.test.sh
# against stubbed docker/cosign, never the network -- so this job only
# installs what it needs and calls it.
sign:release-digest:
  stage: sync
  tags: [mikroview-signing]
  # No daemon and no dind, the same shape orbit's sign_evidence job uses:
  # `docker buildx imagetools inspect` and `docker login` are registry
  # operations the CLI performs itself over HTTPS, and cosign talks to the
  # registry directly too. Verified against a real GHCR tag with
  # DOCKER_HOST pointed at a socket that does not exist (2026-09-22). So
  # this job needs no Docker socket mounted into it, which matters: the
  # signing runner is the better-protected half of the pair, and handing
  # it daemon access to earn a digest lookup would be a poor trade.
  #
  # Pinned by digest (#1472): this job holds the signing key. Plain Docker
  # Hub, not the image cache the dind jobs use, as before. 29.9.2 is the
  # newest 29.x CLI at least 3 days old on 2026-11-15 (29.9.3's digest was
  # two days old); the multi-arch index digest, as Docker Hub lists it.
  # Change with supply-chain/pins-policy.json.
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  # Optional only for the SIGN_TAG exercise pipeline below, which has
  # neither job; in a publishing pipeline both are present and must pass.
  needs:
    - job: publish:image
      artifacts: true
      optional: true
    - job: security:trivy-image
      artifacts: true
      optional: true
  # A cancelled signing run leaves a published digest with only part of
  # its signature and attestation and nothing to show why -- never cut
  # mid-write.
  interruptible: false
  # One signing run at a time, across pipelines (GitLab's standard way to
  # serialise a job): two runs on one digest could otherwise both pass the
  # script's already-signed check and both sign, which
  # verify-release-signature.sh then refuses as ambiguous.
  resource_group: sign-release-digest
  timeout: 20m
  rules:
    # A publishing pipeline: preview or a v* tag. The script signs the
    # digest in publish:image's evidence.
    - !reference [.publish_ref, rules]
    # The exercise path (#1309). A v* tag on this project *is* a release,
    # so there is no throwaway tag that exercises signing without also
    # cutting a release. Instead the job is started by hand against an
    # already-published tag in this project's registry, and SIGN_TAG is on
    # the `never` lists above so triggering it does not re-run all of dev
    # (#951).
    #
    # SIGN_TAG is the only variable: naming a tag by hand is already
    # unambiguous intent, so a second SIGN_EXERCISE switch was one more name
    # to spell correctly and nothing else. It was misspelled on the first
    # attempt (pipeline 1483, 2026-09-22), which silently ran all of dev and
    # signed nothing.
    - if: '$SIGN_TAG != "" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    # bash because the script is `#!/usr/bin/env bash` and Alpine ships
    # ash; curl for ensure-cosign.sh's pinned download; coreutils for the
    # checksum verification inside it; python3 to read the evidence.
    - apk add --no-cache bash coreutils curl python3 >/dev/null
    # No argument in a publishing pipeline: the script signs the recorded
    # digest. SIGN_TAG only when exercising by hand: the script resolves
    # that tag in $CI_REGISTRY_IMAGE instead.
    - bash scripts/sign-release-digest.sh ${SIGN_TAG:+"$SIGN_TAG"}

# record:upgrade-fixture above is allow_failure (a registry pull failure
# must not redden a tag already cut -- see its own header), so it
# can fail unseen. This is #1274's automated replacement for the manual
# "Promote to main" checklist line that used to be the only thing
# catching that: it asserts every released v[0-9]* tag has a fixture
# recorded, in the registry or committed to testdata/upgrade/, and names
# the exact command for whichever one is missing. Not gated by #1038 (a
# docs-only push must not skip it) and needs full tag history, not
# GitLab's shallow default.
check:upgrade-fixture-recorded:
  stage: sync
  tags: [light]
  image: alpine:3.24
  needs: []
  # A fast history check (ai/agent-infra#113): runs on the push to dev with
  # the 5 minute timeout.
  extends: .dev-landing-check
  rules:
    - !reference [.dev-landing-check, rules]
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git curl
  script:
    - bash scripts/check-upgrade-fixtures-recorded.sh

# ---------------------------------------------------------------------------
# CHR-EXERCISE — #894: weekly, boots MikroTik's own CHR image under
# software-emulated QEMU (no /dev/kvm needed — this exercises
# configuration commands, not throughput, per the owner's decision on
# #894) at the newest stable RouterOS release, and runs the setup
# wizard's starting commands against it. Green with nothing to exercise
# is silent; green after actually booting a CHR opens a merge request
# appending the verified row; red names the refused command.
#
# Inert on every pipeline source except a GitLab Pipeline Schedule that
# itself carries a CHR_EXERCISE=true variable — set on that one
# schedule, not project-wide, so this cannot fire from a dev push or a
# merge request, and cannot collide with any other scheduled pipeline
# this project adds later. The owner has already created that schedule
# (weekly, matching routeros-freshness.yml's GitHub cron: 0 7 * * 1) and
# the GITLAB_MR_TOKEN CI/CD variable scripts/routeros-chr-open-mr.sh
# needs — see that script's header and docs/routeros-chr-exercise.md.
#
# No Docker anywhere in this job, and so no privileged runner and no
# runner tag: #894 only exercises RouterOS command syntax, never
# throughput, which is exactly what QEMU's software emulation (-accel
# tcg) is for. TCG needs no /dev/kvm and no elevated privilege, so
# scripts/routeros-chr-boot.sh runs qemu-system-x86_64 directly inside
# this job's own container — installed below — on the same untagged
# shared runner the rest of this file already uses. scripts/live-routeros.sh's
# Docker path stays for local development, unused by this job — see
# routeros-chr-boot.sh's header for why the two scripts are split.
# ---------------------------------------------------------------------------

chr-exercise:run:
  stage: chr-exercise
  image: golang:1.27.4
  # #952: this job pushes chr/last-run.json to the chr-reports branch on
  # every run (scripts/chr-report.sh) and, on a fully clean exercise, also
  # pushes a branch and opens a merge request
  # (scripts/routeros-chr-open-mr.sh) -- never cut mid-write.
  interruptible: false
  # This job gates nothing. It boots a CHR and records which of the
  # wizard's commands RouterOS still accepts (#894); a unit test failing
  # on this runner says nothing about that. Without `needs: []` it sits
  # in the last stage behind lint, test and security, so any failure
  # anywhere ahead of it skips it -- which is exactly what had happened:
  # it had never run once, in any pipeline, because something earlier
  # always failed first (#908, #923). A skipped job reports nothing while
  # looking like it was considered.
  needs: []
  # The weekly schedule, plus an on-demand path from the web UI or the
  # API. Without one, a change to this job can only be tested by waiting
  # for the next Monday, which in practice means it never gets tested --
  # the same argument the testing rules make for keeping heavy validation
  # reachable without waiting on the trigger that normally runs it.
  # CHR_EXERCISE stays required, so an ordinary pipeline never picks it up
  # by accident.
  rules:
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "api"'
  before_script:
    # Repeated rather than merged from .git_safe: a job-level before_script
    # replaces an inherited one outright, so this job cannot have both.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - apt-get update -qq && apt-get install -y -qq qemu-system-x86 qemu-utils python3 unzip curl >/dev/null
    # Quoted whole: a bare "key: value" inside the message makes YAML read
    # this line as a mapping and GitLab reject the file (pipeline 145).
    - 'command -v qemu-system-x86_64 >/dev/null 2>&1 || { echo "chr-exercise: qemu-system-x86_64 missing after installing qemu-system-x86 -- cannot boot CHR"; exit 1; }'
  script:
    # #929: the chr-watch job has to hear about this run whether it passed
    # or failed -- the failure path matters more, since that is the one a
    # plain `script:` line would silently skip. A script section stops
    # at the first non-zero line, and `after_script` runs afterwards in
    # a brand new shell that only sees files left on disk, not anything
    # this shell computed -- and the report's summary needs more than a
    # bare exit code, so building it here (where the exercise's own log
    # is already sitting in a file this same shell just wrote) is
    # simpler than reconstructing it from scratch in a second shell.
    # Capturing the status and reporting from it, then exiting with that
    # same status at the end, keeps this one job both always-reporting
    # and still red when the exercise itself failed.
    - |
      set +e
      scripts/routeros-chr-exercise.sh >chr-exercise.log 2>&1
      status=$?
      set -e
      cat chr-exercise.log

      if [ "$status" -eq 0 ]; then
        result=pass
        summary="$(grep -m1 -E 'already covered|every starting command parsed' chr-exercise.log || true)"
      elif grep -q 'failed after 3 attempts' chr-exercise.log; then
        # The retry loop in routeros-chr-boot.sh's chr_image() already
        # gave the download three tries with a pause between (#929: a
        # reset partway through the ~43 MB image, reproduced on two
        # hosts, must not read as an exercise failure). Exhausting all
        # three is a real failure, but naming it here keeps it from
        # being reported as "the exercise failed" when RouterOS itself
        # was never even reached.
        result=fail
        summary="the CHR image download failed after 3 attempts (network reset before reaching RouterOS), not the exercise itself"
      elif grep -q 'refused a command:' chr-exercise.log; then
        result=fail
        cmd="$(grep -A1 'refused a command:' chr-exercise.log | tail -n1 | sed 's/^ *//')"
        summary="RouterOS refused a command: $cmd"
      else
        result=fail
        summary="$(grep -m1 -E 'would not boot|could not (reach|compare|determine)' chr-exercise.log || true)"
      fi
      summary="$(printf '%s' "$summary" | sed 's/^routeros-chr-exercise: //')"
      [ -n "$summary" ] || summary="CHR exercise finished with exit $status -- see the job log"
      routeros_version="$(grep -oE '(RouterOS|CHR) [0-9]+\.[0-9]+(\.[0-9]+)?' chr-exercise.log | head -n1 | awk '{print $2}')"

      # A failure to publish the report is never allowed to hide, or to
      # stand in for, the exercise's own result -- report, then exit with
      # the exercise's real status regardless of how reporting went.
      if ! CHR_REPORT_RESULT="$result" CHR_REPORT_SUMMARY="$summary" \
        CHR_REPORT_ROUTEROS_VERSION="$routeros_version" scripts/chr-report.sh; then
        echo "chr-exercise: publishing the run report to GitLab failed -- see above"
      fi

      exit "$status"

# ---------------------------------------------------------------------------
# CHR-WATCH — #929, moved to GitLab by #943: reads chr/last-run.json off the
# chr-reports branch that chr-exercise:run above (via scripts/chr-report.sh)
# writes on every run, decides what it means (scripts/chr-watch/chr-watch.js,
# tested in chr-watch.test.js), and opens, comments on or closes a single
# tracking issue accordingly (scripts/chr-watch/run.js). Green closes a
# stale issue if one is open and otherwise does nothing; anything else
# (failing, stale, missing) fails this job on purpose, so the schedule
# itself shows red.
#
# Inert on every pipeline source except a GitLab Pipeline Schedule that
# itself carries a CHR_WATCH=true variable, the same pattern CHR_EXERCISE
# uses above. The owner creates that schedule (daily, matching the old
# GitHub workflow's cron) and it needs the same GITLAB_MR_TOKEN CI/CD
# variable chr-exercise:run already needs, since this job reads and writes
# issues through the same GitLab API.
# ---------------------------------------------------------------------------

chr-watch:run:
  stage: chr-exercise
  # Light lane (#949): reads one report and calls the API.
  tags: [light]
  image: node:26-alpine
  # #952: opens, comments on or closes a tracking issue via the GitLab API
  # -- never cut mid-write.
  interruptible: false
  # This job only reads the report chr-exercise:run already wrote and talks
  # to the GitLab API -- nothing earlier in the pipeline can invalidate
  # that, and it must still run (and still be able to report a stale report)
  # even if something earlier in the same pipeline failed.
  needs: []
  rules:
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "api"'
  script:
    - node scripts/chr-watch/run.js

# ---------------------------------------------------------------------------
# RENOVATE — #945: self-hosted Renovate, replacing the Dependabot config retired
# in d3c152a now that dependency work happens on GitLab. renovate.json at the
# repo root carries the policy (dev as base branch, 7-day cooldown, minor and
# patch grouped per ecosystem, majors separate, ten open MRs); this job only
# executes it. The github-actions manager is deliberately off: the remaining
# .github/workflows/*.yml are the mirror side and are updated by hand.
#
# Inert on every pipeline source except a Pipeline Schedule carrying
# RENOVATE=true (schedule 10, Mondays 05:00 London) and the web/API paths, the
# same pattern as CHR_EXERCISE and CHR_WATCH above. RENOVATE_TOKEN is an
# impersonation token of mikroview-bot held as a masked, protected CI/CD
# variable; never echo it. GITHUB_COM_TOKEN, if set the same way, lets Renovate
# fetch release notes from github.com without hitting the anonymous rate limit.
# ---------------------------------------------------------------------------

renovate:run:
  stage: renovate
  # Pinned by version and digest (#1434): this job holds RENOVATE_TOKEN, so
  # whoever can publish a new image under a moving tag would run code with
  # it. Renovate's gitlabci manager keeps both current, after the same
  # 7-day wait as every other update.
  image: renovate/renovate:44.222.2@sha256:227e723ed8c57f1b8b629066c7e0ad8d8f933d905f4a2f6fb4d597a74118637c
  needs: []
  # #952: opens and updates merge requests via the GitLab API -- never cut
  # mid-write.
  interruptible: false
  rules:
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "api"'
  variables:
    RENOVATE_GIT_AUTHOR: "mikroview-bot <mikroview-bot@noreply.gitlab.tomlawson.io>"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
    LOG_LEVEL: info
  script:
    - renovate --platform gitlab --endpoint "$CI_API_V4_URL" "$CI_PROJECT_PATH"
