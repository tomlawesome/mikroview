# ============================================================
# GitLab is where mikroview is developed: branches, merge requests and
# the dev -> preview -> main promotions all happen here, and this file is
# the CI that gates them. GitHub is a read-only mirror of those three
# branches -- the `sync` stage pushes each one after a merge -- and keeps
# what already works there: CodeQL, the container registry and cosign
# signing, Pages, secret scanning and chr-watch. #935 is the migration
# record; the general model is in the gitlab-first-migration skill.
#
# The `sync` stage is inert until the owner sets MIRROR_TO_GITHUB=true as
# a project CI/CD variable (#935 step 4). Nothing in this file sets it.
#
# The live-check gate is not here and never will be: it runs on the
# second host, after the merge (AGENTS.md, "The gate runs on `dev`").
# ============================================================
#
# Runner: rootless-Docker executor, single group runner, untagged jobs only.
# Tool versions pinned below were verified current as of this session (Aug 2026)
# in gitlab-ci-plan/01-tool-research.md — re-check before bumping blindly.

stages:
  - lint
  - test
  - security
  - sync
  - chr-exercise

variables:
  GOFLAGS: "-mod=readonly"

.dev_or_mr: &dev_or_mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# Every job that shells out to git needs this. `go build` stamps VCS metadata
# by running git, and git refuses a repository owned by another user unless it
# is marked safe — which failed the whole lint stage with nothing but
# "error obtaining VCS status: exit status 128" to go on (#908).
#
# The likely owner mismatch is our own doing: test:go chowns $CI_PROJECT_DIR to
# ci-test, and the runner reuses its build directory between pipelines, so a
# later job running as root meets a checkout owned by uid 10001. test:go now
# hands ownership back, but marking the directory safe is the durable half —
# it costs nothing and does not depend on that cleanup having run.
#
# The check below exists because the Go wrapper swallows git's actual message.
# If git is still unusable, fail here with the real error rather than three
# stages later with a riddle.
.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      if ! git rev-parse --git-dir >/dev/null 2>&1; then
        echo "git cannot read the checkout at $CI_PROJECT_DIR. Real error:"
        git status || true
        exit 1
      fi

# ---------------------------------------------------------------------------
# POLICY — the three-lane promotion order, dev -> preview -> main, with no
# shortcuts. Replaces .github/workflows/branch-policy.yml, which cannot see
# a merge that happens here. Only bites if the project requires a passing
# pipeline to merge (Settings > Merge requests > "Pipelines must succeed"),
# which is the owner's setting; without it this job is a warning, not a gate.
# ---------------------------------------------------------------------------

policy:promotion-hop:
  stage: lint
  image: alpine:3.22
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  script:
    - 'echo "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        main)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "preview" ]; then
            echo "main only accepts merge requests from preview (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME') -- promote dev -> preview first, then preview -> main."
            exit 1
          fi
          ;;
        preview)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "dev" ]; then
            echo "preview only accepts merge requests from dev (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME')."
            exit 1
          fi
          ;;
      esac

# ---------------------------------------------------------------------------
# LINT — mirrors what ci.yml already does on GitHub (build+vet+gofmt, svelte-check),
# not introducing golangci-lint since mikroview doesn't use it today.
# ---------------------------------------------------------------------------

lint:go:
  stage: lint
  image: golang:1.27
  <<: [*dev_or_mr, *git_safe]
  script:
    - go build ./...
    - go vet ./...
    - |
      # Count the files first. A broken git makes `git ls-files` print nothing,
      # gofmt then reads stdin instead of a file list, and the check passes
      # having examined nothing at all — reported success, zero coverage.
      # Reproduced locally on 2026-09-03 while diagnosing #908.
      files=$(git ls-files '*.go')
      if [ -z "$files" ]; then
        echo "git ls-files returned no Go files -- refusing to report a gofmt pass on an empty list"
        exit 1
      fi
      unformatted=$(gofmt -l $files)
      if [ -n "$unformatted" ]; then
        echo "Not gofmt-clean:"
        echo "$unformatted"
        gofmt -d $files
        exit 1
      fi

lint:frontend:
  stage: lint
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  script:
    # The GitHub-side helper scripts (.github/scripts) have node:test suites
    # that no workflow runs; the issue closer below depends on the matcher,
    # so its tests run here.
    - node --test .github/scripts/*.test.js
    - cd frontend
    - npm ci
    - npx svelte-check --tsconfig ./tsconfig.app.json

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

test:go:
  stage: test
  image: golang:1.27
  <<: *dev_or_mr
  # GitLab's docker executor runs this container as root by default; GitHub's
  # ci.yml runs the same test directly on the runner VM as an unprivileged
  # user. That mismatch makes permission-enforcement tests (e.g.
  # TestUnwritableStorePathSurfacesPersistErrButStillLoads, which chmods a
  # directory unwritable and expects the code under test to see a real
  # permission error) fail here specifically, since root bypasses Unix
  # permission bits (CAP_DAC_OVERRIDE) — not because the code is wrong.
  # Dropping to a non-root user for the actual `go test` run matches both
  # GitHub's environment and mikroview's own production posture (its
  # Dockerfile runs USER nonroot:nonroot). See
  # docs/decisions/gitlab-ci-root-in-container-test-failure.md.
  script:
    - useradd -m -u 10001 ci-test
    - chown -R ci-test:ci-test "$CI_PROJECT_DIR"
    - su ci-test -c "cd '$CI_PROJECT_DIR' && HOME=/home/ci-test go test ./... -race -coverprofile=coverage.out"
  # The runner reuses its build directory between pipelines, so leaving the
  # checkout owned by ci-test hands the next pipeline's root-run jobs a
  # repository git will not touch. Give it back (#908).
  after_script:
    - chown -R root:root "$CI_PROJECT_DIR" || true
  artifacts:
    paths:
      - coverage.out

test:frontend:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  # The other half of #684. lint:frontend above proves the frontend compiles;
  # nothing here proved it behaves, so this lane had the same hole GitHub did
  # and 542 real assertions gated nothing on either. jsdom, so no browser and
  # no runner image beyond the one lint:frontend already uses.
  script:
    - cd frontend
    - npm ci
    - npm test

# ---------------------------------------------------------------------------
# SECURITY — parallel jobs, diff-scoped Semgrep on MRs, full scan on dev.
# ---------------------------------------------------------------------------

security:semgrep:
  stage: security
  image: semgrep/semgrep:1.176.0
  <<: *dev_or_mr
  script:
    # The image sets SEMGREP_IN_DOCKER, which makes semgrep insist the
    # code is bind-mounted at /src and chdir there before it looks at
    # anything (config_resolver.adjust_for_docker). GitLab's docker
    # executor mounts the checkout at $CI_PROJECT_DIR instead and gives
    # a job no way to add a volume, so /src is empty and every run died
    # with "Detected Docker environment without a code volume" -- before
    # scanning a single file. Unsetting it here leaves semgrep working
    # from the job's own directory, which is where the code actually is.
    # Reproduced and the fix confirmed locally under the same image
    # (#912).
    - unset SEMGREP_IN_DOCKER
    # A rule that exceeds --timeout is skipped for that file, and after
    # --timeout-threshold of them semgrep abandons the file entirely and
    # still exits 0. So the job got *greener* the slower the runner was,
    # and a file could contribute no findings without saying so. Two runs
    # over an unchanged tree disagreed: scripts/seed-demo.py reported
    # disabled-cert-validation on one and was abandoned on the other
    # (#918).
    #
    # 120s rather than the 5s default so the slow rules finish, threshold
    # 0 so no file is ever abandoned, and the grep below so that a
    # timeout that still happens fails the job instead of quietly
    # shrinking the scan. An incomplete scan is not a pass.
    - |
      set -o pipefail
      run_semgrep() {
        semgrep scan --config p/security-audit --config p/owasp-top-ten \
          --timeout 120 --timeout-threshold 0 \
          --sarif --output semgrep.sarif --error "$@" 2>&1 | tee semgrep.log
      }
      status=0
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        run_semgrep --baseline-commit "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || status=$?
      else
        run_semgrep || status=$?
      fi
      if grep -q 'timeout error' semgrep.log; then
        echo "A rule timed out, so this scan covered less than it reported on (#918):"
        grep 'timeout error' semgrep.log
        exit 1
      fi
      exit $status
  artifacts:
    when: always
    paths:
      - semgrep.sarif
      - semgrep.log

security:gosec:
  stage: security
  # ghcr, not Docker Hub. gosec stopped publishing to Docker Hub after
  # 2.24.6, so `securego/gosec:2.28.0` resolved to nothing and the job
  # failed before it started -- an image pull failure, which reads like
  # a registry outage rather than a tag that was never published.
  # Bumped to the current release while here, per AGENTS.md's
  # pin-to-latest rule (#912).
  #
  # entrypoint: [""] for the same reason gitleaks and trivy below carry
  # it: this image's entrypoint is a wrapper that execs `/bin/gosec $@`,
  # so GitLab's generated shell script would arrive as gosec's arguments
  # rather than as a script to run. That is the failure this job would
  # have hit next, once the pull succeeded.
  image:
    name: ghcr.io/securego/gosec:2.29.0
    entrypoint: [""]
  <<: *dev_or_mr
  script:
    - gosec -fmt=sarif -out=gosec.sarif -severity=high -confidence=high ./...
  artifacts:
    when: always
    paths:
      - gosec.sarif

security:govulncheck:
  stage: security
  image: golang:1.27
  <<: [*dev_or_mr, *git_safe]
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
    - govulncheck -format=json ./... > govulncheck.json

  artifacts:
    when: always
    paths:
      - govulncheck.json

security:gitleaks:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  <<: *dev_or_mr
  variables:
    # The whole history, not GitLab's shallow default. This job reported
    # 28 leaks that are not leaks, and the depth is why: `.gitleaksignore`
    # pins each accepted finding to commit:path:rule:line, and a shallow
    # clone's oldest commit presents the entire tree as newly added under
    # *its* SHA rather than the SHA that really introduced each line. So
    # every fingerprint missed, and every fixture key in
    # recovery_prompt_test.go came back as a finding. The byte counts say
    # the same thing: 177MB over 102 commits shallow, against 20MB over
    # 999 full, because a truncated history has no diffs to scan, only
    # whole files.
    #
    # Reproduced with `git clone --depth 20` of this repo and the job's
    # own command: 24 findings, all in the file `.gitleaksignore` already
    # covers. A full clone finds none (#912).
    GIT_DEPTH: 0
  script:
    # --redact for the same reason secret-scan.yml gives on the GitHub
    # side: without it, a job that finds a real secret republishes it into
    # the build log and into an artifact anyone with repository access can
    # download. The finding still names the file, the rule and the commit,
    # which is what anyone fixing it needs. This lane had no redaction at
    # all until #912.
    - gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks.sarif

security:trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.73.0
    entrypoint: [""]
  <<: *dev_or_mr
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache
  script:
    - trivy fs --exit-code 0 --severity CRITICAL,HIGH,MEDIUM,LOW --scanners vuln,license --format sarif --output trivy-fs.sarif .
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
  allow_failure: true

# ---------------------------------------------------------------------------
# SYNC — GitHub is a mirror of dev, preview and main. After a push to any of
# the three (a merge here lands as a push), mirror-to-github pushes that
# branch to GitHub; after a push to dev only, close-github-issues closes the
# GitHub issues the merged merge request said it closes. Both jobs run only
# once the owner has set MIRROR_TO_GITHUB=true (#935 step 4).
#
# The mirror pushes over SSH with a GitHub deploy key -- one repository,
# push only, no API access -- held in GITHUB_MIRROR_SSH_KEY, a protected
# file-type CI/CD variable. GitHub's rulesets on the three branches exempt
# deploy keys and nothing else, so no owner token is ever able to bypass
# them (owner decision on #935, 2026-09-04). Protected-only means the
# variable is empty on an unprotected branch: preview and main must be
# protected here before their first promotion.
#
# GitHub's SSH host keys come from api.github.com/meta over TLS rather than
# ssh-keyscan, so the first connection is verified rather than trusted.
#
# The closer reads the merge request, not the merge commit: GitLab's default
# merge commit carries only the MR title, and `Closes #N` lives in the
# description. It uses GITHUB_ISSUES_TOKEN (issues: read and write, this
# repository only) and GITLAB_MR_TOKEN (to read the MR). Not allow_failure:
# a closer that fails silently is how issues stay open after the work
# shipped (#99, #133, #134), so a red job here is the signal.
# ---------------------------------------------------------------------------

sync:mirror-to-github:
  stage: sync
  image: alpine/git:2.47.3
  # `needs: []`: the mirror reflects the branch, not the pipeline. The merge
  # request already ran lint, test and security before it merged; a flaky
  # test on the post-merge run must not leave GitHub behind, silently.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is $CI_COMMIT_BRANCH protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - install -m 600 "$GITHUB_MIRROR_SSH_KEY" ~/.ssh/mirror_key
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/mikroview.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/mikroview.git
    # Never --force: if this is refused non-fast-forward, something wrote to
    # GitHub's copy and the branch has forked. Reconcile by merge (#935).
    - git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH"

sync:close-github-issues:
  stage: sync
  image: node:22-alpine
  needs:
    - sync:mirror-to-github
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true"'
  script:
    - node .github/scripts/close-issues-from-gitlab.js

# ---------------------------------------------------------------------------
# CHR-EXERCISE — #894: weekly, boots MikroTik's own CHR image under
# software-emulated QEMU (no /dev/kvm needed — this exercises
# configuration commands, not throughput, per the owner's decision on
# #894) at the newest stable RouterOS release, and runs the setup
# wizard's starting commands against it. Green with nothing to exercise
# is silent; green after actually booting a CHR opens a merge request
# appending the verified row; red names the refused command.
#
# Inert on every pipeline source except a GitLab Pipeline Schedule that
# itself carries a CHR_EXERCISE=true variable — set on that one
# schedule, not project-wide, so this cannot fire from a dev push or a
# merge request, and cannot collide with any other scheduled pipeline
# this project adds later. The owner has already created that schedule
# (weekly, matching routeros-freshness.yml's GitHub cron: 0 7 * * 1) and
# the GITLAB_MR_TOKEN CI/CD variable scripts/routeros-chr-open-mr.sh
# needs — see that script's header and docs/routeros-chr-exercise.md.
#
# No Docker anywhere in this job, and so no privileged runner and no
# runner tag: #894 only exercises RouterOS command syntax, never
# throughput, which is exactly what QEMU's software emulation (-accel
# tcg) is for. TCG needs no /dev/kvm and no elevated privilege, so
# scripts/routeros-chr-boot.sh runs qemu-system-x86_64 directly inside
# this job's own container — installed below — on the same untagged
# shared runner the rest of this file already uses. scripts/live-routeros.sh's
# Docker path stays for local development, unused by this job — see
# routeros-chr-boot.sh's header for why the two scripts are split.
# ---------------------------------------------------------------------------

chr-exercise:run:
  stage: chr-exercise
  image: golang:1.27
  # This job gates nothing. It boots a CHR and records which of the
  # wizard's commands RouterOS still accepts (#894); a unit test failing
  # on this runner says nothing about that. Without `needs: []` it sits
  # in the last stage behind lint, test and security, so any failure
  # anywhere ahead of it skips it -- which is exactly what had happened:
  # it had never run once, in any pipeline, because something earlier
  # always failed first (#908, #923). A skipped job reports nothing while
  # looking like it was considered.
  needs: []
  # The weekly schedule, plus an on-demand path from the web UI or the
  # API. Without one, a change to this job can only be tested by waiting
  # for the next Monday, which in practice means it never gets tested --
  # the same argument the testing rules make for keeping heavy validation
  # reachable without waiting on the trigger that normally runs it.
  # CHR_EXERCISE stays required, so an ordinary pipeline never picks it up
  # by accident.
  rules:
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "api"'
  before_script:
    # Repeated rather than merged from .git_safe: a job-level before_script
    # replaces an inherited one outright, so this job cannot have both.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - apt-get update -qq && apt-get install -y -qq qemu-system-x86 qemu-utils python3 unzip curl >/dev/null
    # Quoted whole: a bare "key: value" inside the message makes YAML read
    # this line as a mapping and GitLab reject the file (pipeline 145).
    - 'command -v qemu-system-x86_64 >/dev/null 2>&1 || { echo "chr-exercise: qemu-system-x86_64 missing after installing qemu-system-x86 -- cannot boot CHR"; exit 1; }'
  script:
    # #929: GitHub has to hear about this run whether it passed or
    # failed -- the failure path matters more, since that is the one a
    # plain `script:` line would silently skip. A script section stops
    # at the first non-zero line, and `after_script` runs afterwards in
    # a brand new shell that only sees files left on disk, not anything
    # this shell computed -- and the report's summary needs more than a
    # bare exit code, so building it here (where the exercise's own log
    # is already sitting in a file this same shell just wrote) is
    # simpler than reconstructing it from scratch in a second shell.
    # Capturing the status and reporting from it, then exiting with that
    # same status at the end, keeps this one job both always-reporting
    # and still red when the exercise itself failed.
    - |
      set +e
      scripts/routeros-chr-exercise.sh >chr-exercise.log 2>&1
      status=$?
      set -e
      cat chr-exercise.log

      if [ "$status" -eq 0 ]; then
        result=pass
        summary="$(grep -m1 -E 'already covered|every starting command parsed' chr-exercise.log || true)"
      elif grep -q 'failed after 3 attempts' chr-exercise.log; then
        # The retry loop in routeros-chr-boot.sh's chr_image() already
        # gave the download three tries with a pause between (#929: a
        # reset partway through the ~43 MB image, reproduced on two
        # hosts, must not read as an exercise failure). Exhausting all
        # three is a real failure, but naming it here keeps it from
        # being reported as "the exercise failed" when RouterOS itself
        # was never even reached.
        result=fail
        summary="the CHR image download failed after 3 attempts (network reset before reaching RouterOS), not the exercise itself"
      elif grep -q 'refused a command:' chr-exercise.log; then
        result=fail
        cmd="$(grep -A1 'refused a command:' chr-exercise.log | tail -n1 | sed 's/^ *//')"
        summary="RouterOS refused a command: $cmd"
      else
        result=fail
        summary="$(grep -m1 -E 'would not boot|could not (reach|compare|determine)' chr-exercise.log || true)"
      fi
      summary="$(printf '%s' "$summary" | sed 's/^routeros-chr-exercise: //')"
      [ -n "$summary" ] || summary="CHR exercise finished with exit $status -- see the job log"
      routeros_version="$(grep -oE '(RouterOS|CHR) [0-9]+\.[0-9]+(\.[0-9]+)?' chr-exercise.log | head -n1 | awk '{print $2}')"

      # A failure to publish the report is never allowed to hide, or to
      # stand in for, the exercise's own result -- report, then exit with
      # the exercise's real status regardless of how reporting went.
      if ! CHR_REPORT_RESULT="$result" CHR_REPORT_SUMMARY="$summary" \
        CHR_REPORT_ROUTEROS_VERSION="$routeros_version" scripts/chr-report.sh; then
        echo "chr-exercise: publishing the run report to GitHub failed -- see above"
      fi

      exit "$status"
