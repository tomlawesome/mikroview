# ============================================================
# GitLab is where mikroview is developed: branches, merge requests and
# the dev -> preview -> main promotions all happen here, and this file is
# the CI that gates them. GitHub is a read-only mirror of those three
# branches -- the `sync` stage pushes each one after a merge -- and keeps
# what already works there: CodeQL, the container registry and cosign
# signing, Pages and secret scanning. #935 is the migration record; the
# general model is in the gitlab-first-migration skill.
#
# The `sync` stage is inert until the owner sets MIRROR_TO_GITHUB=true as
# a project CI/CD variable (#935 step 4). Nothing in this file sets it.
#
# The live-check gate is not here and never will be: it runs on the
# second host, after the merge (AGENTS.md, "The gate runs on `dev`").
# ============================================================
#
# Runner: rootless-Docker executor, single group runner, untagged jobs only.
# Tool versions pinned below were verified current as of this session (Aug 2026)
# in gitlab-ci-plan/01-tool-research.md — re-check before bumping blindly.

stages:
  - lint
  - test
  - security
  - sync
  - chr-exercise
  - renovate

# Runner lanes (#949, ai/agent-infra#3). Every job names its lane: `big`
# is gitlab-runners-01 (8 CPU / 18 GB, two at a time) and `light` is the
# 2 CPU / 2 GB runner (three at a time). A job with no matching tag does
# not run at all, so a new job must pick one.
default:
  tags: [big]

variables:
  GOFLAGS: "-mod=readonly"

# Scheduled pipelines exist only to carry the CHR exercise, CHR watch and
# Renovate jobs, which select themselves on $CHR_EXERCISE / $CHR_WATCH /
# $RENOVATE. Without the `never` line every schedule on dev also ran the full
# lint, test and security set -- a daily CI run for a job that reads one JSON
# file. The same jobs' on-demand path (web UI or API, same variable) was
# doing it too (#951: pipelines 358 and 362 each re-ran all of dev 357), so
# a web/API run carrying one of those variables is treated like a schedule.
# A web/API run of dev with no variable still runs everything: that is what
# "run pipeline" should mean.
.dev_or_mr: &dev_or_mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && ($CHR_EXERCISE == "true" || $CHR_WATCH == "true" || $RENOVATE == "true")
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

# Every job that shells out to git needs this. `go build` stamps VCS metadata
# by running git, and git refuses a repository owned by another user unless it
# is marked safe — which failed the whole lint stage with nothing but
# "error obtaining VCS status: exit status 128" to go on (#908).
#
# The likely owner mismatch is our own doing: test:go chowns $CI_PROJECT_DIR to
# ci-test, and the runner reuses its build directory between pipelines, so a
# later job running as root meets a checkout owned by uid 10001. test:go now
# hands ownership back, but marking the directory safe is the durable half —
# it costs nothing and does not depend on that cleanup having run.
#
# The check below exists because the Go wrapper swallows git's actual message.
# If git is still unusable, fail here with the real error rather than three
# stages later with a riddle.
.git_safe: &git_safe
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      if ! git rev-parse --git-dir >/dev/null 2>&1; then
        echo "git cannot read the checkout at $CI_PROJECT_DIR. Real error:"
        git status || true
        exit 1
      fi

# ---------------------------------------------------------------------------
# POLICY — the three-lane promotion order, dev -> preview -> main, with no
# shortcuts. Replaces .github/workflows/branch-policy.yml, which cannot see
# a merge that happens here. Only bites if the project requires a passing
# pipeline to merge (Settings > Merge requests > "Pipelines must succeed"),
# which is the owner's setting; without it this job is a warning, not a gate.
# ---------------------------------------------------------------------------

policy:promotion-hop:
  stage: lint
  # Light lane (#949): a shell script, no build.
  tags: [light]
  image: alpine:3.22
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "preview" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
  script:
    - 'echo "MR !$CI_MERGE_REQUEST_IID: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME -> $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"'
    - |
      case "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" in
        main)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "preview" ]; then
            echo "main only accepts merge requests from preview (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME') -- promote dev -> preview first, then preview -> main."
            exit 1
          fi
          ;;
        preview)
          if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "dev" ]; then
            echo "preview only accepts merge requests from dev (got '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME')."
            exit 1
          fi
          ;;
      esac

# ---------------------------------------------------------------------------
# LINT — mirrors what ci.yml already does on GitHub (build+vet+gofmt, svelte-check),
# not introducing golangci-lint since mikroview doesn't use it today.
# ---------------------------------------------------------------------------

lint:go:
  stage: lint
  image: golang:1.27
  <<: [*dev_or_mr, *git_safe]
  script:
    - go build ./...
    - go vet ./...
    - |
      # Count the files first. A broken git makes `git ls-files` print nothing,
      # gofmt then reads stdin instead of a file list, and the check passes
      # having examined nothing at all — reported success, zero coverage.
      # Reproduced locally on 2026-09-03 while diagnosing #908.
      files=$(git ls-files '*.go')
      if [ -z "$files" ]; then
        echo "git ls-files returned no Go files -- refusing to report a gofmt pass on an empty list"
        exit 1
      fi
      unformatted=$(gofmt -l $files)
      if [ -n "$unformatted" ]; then
        echo "Not gofmt-clean:"
        echo "$unformatted"
        gofmt -d $files
        exit 1
      fi

lint:frontend:
  stage: lint
  # Light lane (#949): svelte-check and a few node:test files fit in 2 GB.
  tags: [light]
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  script:
    # The CHR watch suites (scripts/chr-watch) have node:test suites that no
    # other job runs, so they run here.
    - node --test scripts/chr-watch/*.test.js
    - cd frontend
    - npm ci
    - npx svelte-check --tsconfig ./tsconfig.app.json

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

test:go:
  stage: test
  image: golang:1.27
  <<: *dev_or_mr
  # GitLab's docker executor runs this container as root by default; GitHub's
  # ci.yml runs the same test directly on the runner VM as an unprivileged
  # user. That mismatch makes permission-enforcement tests (e.g.
  # TestUnwritableStorePathSurfacesPersistErrButStillLoads, which chmods a
  # directory unwritable and expects the code under test to see a real
  # permission error) fail here specifically, since root bypasses Unix
  # permission bits (CAP_DAC_OVERRIDE) — not because the code is wrong.
  # Dropping to a non-root user for the actual `go test` run matches both
  # GitHub's environment and mikroview's own production posture (its
  # Dockerfile runs USER nonroot:nonroot). See
  # docs/decisions/gitlab-ci-root-in-container-test-failure.md.
  script:
    - useradd -m -u 10001 ci-test
    - chown -R ci-test:ci-test "$CI_PROJECT_DIR"
    - su ci-test -c "cd '$CI_PROJECT_DIR' && HOME=/home/ci-test go test ./... -race -coverprofile=coverage.out"
  # The runner reuses its build directory between pipelines, so leaving the
  # checkout owned by ci-test hands the next pipeline's root-run jobs a
  # repository git will not touch. Give it back (#908).
  after_script:
    - chown -R root:root "$CI_PROJECT_DIR" || true
  artifacts:
    paths:
      - coverage.out

test:frontend:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  # The other half of #684. lint:frontend above proves the frontend compiles;
  # nothing here proved it behaves, so this lane had the same hole GitHub did
  # and 542 real assertions gated nothing on either. jsdom, so no browser and
  # no runner image beyond the one lint:frontend already uses.
  script:
    - cd frontend
    - npm ci
    - npm test

# The checks that need the frontend actually built, moved here from GitHub's
# ci.yml `test` job (#935 step 7). Each one's reason is in the script it
# runs: the bundle budget (frontend/scripts/check-bundle-budget.mjs, #462)
# measures the real dist/, THIRD-PARTY-NOTICES.md is generated from what
# that build bundled plus `go list` over the binary's modules, and the docs
# link check (tools/docs/check-anchors.mjs) rides along because it is a
# node one-liner with nowhere better to live.
#
# node plus Go in one image: the notices generator needs both. The Go
# toolchain is the official tarball, pinned to go.mod's version; Debian's
# packaged Go is too old to read this module.
test:build-checks:
  stage: test
  image: node:22-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  <<: *git_safe
  script:
    - curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    - (cd frontend && npm ci && npm run build)
    - node frontend/scripts/check-bundle-budget.mjs
    - node tools/licenses/generate-notices.mjs --check
    - node tools/docs/check-anchors.mjs

# Postgres integration (#131), ported from GitHub's ci.yml (#942). Same
# image and the same TLS-only shape: internal/persist refuses any
# connection that could fall back to plaintext (its requireTLS), so the
# server must present a certificate. GitHub built a one-line derived
# image to get the cert in; here the service's entrypoint is overridden
# to generate it before handing over to the stock entrypoint, which
# needs no image build and no Docker inside the job. The cert is
# self-signed and one day old at most, hence sslmode=require rather
# than verify-full -- this checks the storage logic, not certificate
# validation. Runs in every lane, dev included, for the reason ci.yml's
# header gave: this job's absence from dev once let a storage defect
# sit for 41 commits (#273).
test:postgres:
  stage: test
  image: golang:1.27
  <<: *dev_or_mr
  services:
    - name: postgres:18-alpine
      alias: postgres
      entrypoint: ["sh", "-c"]
      command:
        - |
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout /certs/server.key -out /certs/server.crt
          chown postgres:postgres /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          exec docker-entrypoint.sh postgres -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
  variables:
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: mikroview
    MIKROVIEW_TEST_POSTGRES: postgres://postgres:ci@postgres:5432/mikroview?sslmode=require
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The runner only waits for the service's port, and Postgres listens
    # briefly during its own init before restarting, so a port check can
    # pass early. Ask the server itself, as ci.yml did. Debian's client
    # is older than the server; pg_isready does not care. No `exit` in
    # this loop: before_script and script share one shell, and an early
    # exit here would end the job green with nothing tested.
    - apt-get -qq update && apt-get -qq install -y postgresql-client >/dev/null
    - |
      ready=0
      for attempt in $(seq 1 40); do
        if pg_isready -h postgres -U postgres -d mikroview >/dev/null 2>&1; then ready=1; break; fi
        sleep 1
      done
      [ "$ready" = 1 ] || { echo "postgres never became ready"; false; }
  script:
    # internal/matchlog alongside internal/persist (#243 slice 6): its
    # Postgres backend is a second, independent SQL sink with its own
    # table and needs the same real-database coverage.
    - go test -race -count=1 ./internal/persist/... ./internal/matchlog/...

# Container smoke test, ported from GitHub's ci.yml (#942, the second
# half). Builds the production image and runs it the way
# deploy/docker-compose.yml runs it -- read-only root, tmpfs for /tmp and
# the data directory, every capability dropped, no-new-privileges, pid,
# memory and CPU limits -- and asks /api/healthz whether it came up.
#
# This is the one job that needs a Docker daemon from inside a job. The
# runner is a rootless-Docker executor with no privileged mode, so the
# owner binds the runner's own rootless daemon socket into every job
# (`volumes = [".../docker.sock:/var/run/docker.sock"]` in the runner's
# config.toml; owner decision 137a on #942, 2026-09-05). Consequences
# this job is written around:
#
# - The daemon is the runner host's, not this container's. `docker build`
#   ships the checkout over the socket as its context, so paths inside
#   this job container do not matter; `--publish` would bind a port on
#   the runner host, which this container cannot reach, so nothing is
#   published. The health check instead runs in a throwaway container
#   joined to the app container's network namespace, where 127.0.0.1 is
#   the app.
# - Two pipelines can run at once on the one daemon, so every name here
#   carries $CI_JOB_ID, and after_script removes the container and the
#   image tag whatever happened. The layer cache stays on the daemon,
#   which is what keeps the build quick when the Dockerfile inputs have
#   not changed.
# - The image runs as uid 65532 (Dockerfile), so the tmpfs at the data
#   directory is created with that owner: without a writable data
#   directory the container has nowhere to persist its CA, and the app
#   once carried a "persistence is optional" contract purely to keep this
#   test green (#535). Same flags as ci.yml had.
#
# `-k` on the health check: TLS is on by default (self-signed, generated
# on first start -- internal/servertls), and this only asks whether the
# server answers, not whether the chain verifies.
test:container:
  stage: test
  image: docker:28-cli
  <<: *dev_or_mr
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    APP: mikroview-test-$CI_JOB_ID
  script:
    - docker version --format 'client {{.Client.Version}} / daemon {{.Server.Version}}'
    - docker build --tag "$APP" .
    - >-
      docker run --detach --name "$APP"
      --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
      --tmpfs /var/lib/mikroview:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
      --cap-drop ALL --security-opt no-new-privileges
      --pids-limit 64 --memory 128m --cpus 0.5
      "$APP"
    - |
      for attempt in $(seq 1 20); do
        if docker run --rm --network "container:$APP" alpine:3.22 \
             wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8080/api/healthz; then
          echo "healthz answered on attempt $attempt"
          exit 0
        fi
        sleep 1
      done
      echo "healthz never answered; container log follows"
      docker logs "$APP"
      exit 1
  after_script:
    - docker rm --force "mikroview-test-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker image rm "mikroview-test-$CI_JOB_ID" >/dev/null 2>&1 || true

# ---------------------------------------------------------------------------
# SECURITY — parallel jobs, diff-scoped Semgrep on MRs, full scan on dev.
# ---------------------------------------------------------------------------

security:semgrep:
  stage: security
  image: semgrep/semgrep:1.176.0
  <<: *dev_or_mr
  script:
    # The image sets SEMGREP_IN_DOCKER, which makes semgrep insist the
    # code is bind-mounted at /src and chdir there before it looks at
    # anything (config_resolver.adjust_for_docker). GitLab's docker
    # executor mounts the checkout at $CI_PROJECT_DIR instead and gives
    # a job no way to add a volume, so /src is empty and every run died
    # with "Detected Docker environment without a code volume" -- before
    # scanning a single file. Unsetting it here leaves semgrep working
    # from the job's own directory, which is where the code actually is.
    # Reproduced and the fix confirmed locally under the same image
    # (#912).
    - unset SEMGREP_IN_DOCKER
    # A rule that exceeds --timeout is skipped for that file, and after
    # --timeout-threshold of them semgrep abandons the file entirely and
    # still exits 0. So the job got *greener* the slower the runner was,
    # and a file could contribute no findings without saying so. Two runs
    # over an unchanged tree disagreed: scripts/seed-demo.py reported
    # disabled-cert-validation on one and was abandoned on the other
    # (#918).
    #
    # 120s rather than the 5s default so the slow rules finish, threshold
    # 0 so no file is ever abandoned, and the grep below so that a
    # timeout that still happens fails the job instead of quietly
    # shrinking the scan. An incomplete scan is not a pass.
    - |
      set -o pipefail
      run_semgrep() {
        semgrep scan --config p/security-audit --config p/owasp-top-ten \
          --timeout 120 --timeout-threshold 0 \
          --sarif --output semgrep.sarif --error "$@" 2>&1 | tee semgrep.log
      }
      status=0
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        run_semgrep --baseline-commit "$CI_MERGE_REQUEST_DIFF_BASE_SHA" || status=$?
      else
        run_semgrep || status=$?
      fi
      if grep -q 'timeout error' semgrep.log; then
        echo "A rule timed out, so this scan covered less than it reported on (#918):"
        grep 'timeout error' semgrep.log
        exit 1
      fi
      exit $status
  artifacts:
    when: always
    paths:
      - semgrep.sarif
      - semgrep.log

security:gosec:
  stage: security
  # ghcr, not Docker Hub. gosec stopped publishing to Docker Hub after
  # 2.24.6, so `securego/gosec:2.28.0` resolved to nothing and the job
  # failed before it started -- an image pull failure, which reads like
  # a registry outage rather than a tag that was never published.
  # Bumped to the current release while here, per AGENTS.md's
  # pin-to-latest rule (#912).
  #
  # entrypoint: [""] for the same reason gitleaks and trivy below carry
  # it: this image's entrypoint is a wrapper that execs `/bin/gosec $@`,
  # so GitLab's generated shell script would arrive as gosec's arguments
  # rather than as a script to run. That is the failure this job would
  # have hit next, once the pull succeeded.
  image:
    name: ghcr.io/securego/gosec:2.29.0
    entrypoint: [""]
  <<: *dev_or_mr
  script:
    - gosec -fmt=sarif -out=gosec.sarif -severity=high -confidence=high ./...
  artifacts:
    when: always
    paths:
      - gosec.sarif

security:govulncheck:
  stage: security
  image: golang:1.27
  <<: [*dev_or_mr, *git_safe]
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
    - govulncheck -format=json ./... > govulncheck.json
    # The JSON run above exits 0 whatever it finds -- that is how -format
    # json behaves -- so on its own this job could only ever pass. The
    # plain run is the gate: it exits non-zero on a reachable
    # vulnerability, as GitHub's ci.yml did before #935 step 7 moved that
    # check here.
    - govulncheck ./...
  artifacts:
    when: always
    paths:
      - govulncheck.json

# The two remaining halves of GitHub's ci.yml `security` job, moved here
# under #935 step 7. Their long rationale is in that file's history
# (ci.yml at 65fbc05); the short form:
#
# The fuzz step is a regression gate, not a campaign: it replays each
# parser's seed corpus (the f.Add calls in its own source, #526) plus a
# little fresh exploration, so a newly-introduced crash on attacker-shaped
# input fails the merge request. Budgets are execution counts (`Nx`), not
# durations, so the gate does the same work on a busy runner as an idle
# one (#523) -- do not "tidy" them back to `30s`. A crashing input is
# written to internal/<pkg>/testdata/fuzz/, which the artifact below
# rescues from the discarded workspace; commit it, and plain `go test`
# replays it forever.
security:fuzz:
  stage: security
  image: golang:1.27
  <<: [*dev_or_mr, *git_safe]
  timeout: 15m
  script:
    - go test ./internal/routeros/ -run FuzzParse -fuzz FuzzParse -fuzztime=160000x
    - go test ./internal/syslog/ -run FuzzParseEnvelope -fuzz FuzzParseEnvelope -fuzztime=590000x
    - go test ./internal/ingest/ -run FuzzDecodePayload -fuzz FuzzDecodePayload -fuzztime=156000x
  artifacts:
    when: on_failure
    paths:
      - internal/*/testdata/fuzz/
    expire_in: 30 days

security:npm-audit:
  stage: security
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: ["frontend/package.json"]
    - if: $CI_COMMIT_BRANCH == "dev"
      exists: ["frontend/package.json"]
  script:
    - cd frontend
    - npm ci
    - npm audit --audit-level=high

# Checks the licence of every dependency mikroview actually ships -- Go
# modules and the frontend's bundled npm packages, the same inventory
# tools/licenses/generate-notices.mjs attributes -- against
# supply-chain/licence-policy.yml. Replaces
# .github/dependency-review-config.yml, which actions/dependency-review-action
# read on a pull-request diff and stopped running when GitHub became a
# push-mirror with no pull requests (#935); deliberately scoped to what ships
# rather than the whole installed tree, since an earlier version of this job
# walking node_modules wholesale failed on twelve build/test-tooling packages
# that never reach the binary (#945 item 3, #948).
#
# tools/licenses/licence-policy.mjs is the npm half and the one place the
# allow-list lives (supply-chain/licence-policy.yml); its --print-allowed
# feeds the same list into go-licenses' --allowed_licenses for the Go half,
# so the two checks cannot drift apart into disagreeing about what is
# allowed.
#
# mikroview itself is AGPL-3.0-only (LICENSE) -- go-licenses' --ignore flag
# below excludes mikroview's own module, so this never flags the project
# shipping under its own licence. That is not the same as allowing AGPL: it
# is not in allow-licenses, so an actual dependency under AGPL still fails,
# exactly like any other disallowed licence.
#
# node:22-bookworm plus the Go tarball, the same combination
# test:build-checks uses: this job needs both toolchains in one image, and
# the Go toolchain is the official tarball pinned to go.mod's version, since
# Debian's packaged Go is too old to read this module.
security:licence-policy:
  stage: security
  image: node:22-bookworm
  <<: [*dev_or_mr, *git_safe]
  script:
    - node --test tools/licenses/licence-policy.test.mjs
    - curl -fsSL https://go.dev/dl/go1.27.0.linux-amd64.tar.gz | tar -C /usr/local -xz
    - export PATH="/usr/local/go/bin:$PATH" && go version
    # `go install` drops the binary in $(go env GOPATH)/bin, which the node
    # image does not have on PATH; pipeline 287 failed with "command not
    # found" for exactly that reason.
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - go install github.com/google/go-licenses/v2@v2.0.1
    - go-licenses check ./... --ignore github.com/tomlawesome/mikroview --allowed_licenses="$(node tools/licenses/licence-policy.mjs --print-allowed)"
    # --ignore-scripts: this install only needs to feed the Vite build
    # licence-policy.mjs runs internally (via npmPackages()) to see which
    # packages' source actually reached the bundle; no postinstall step
    # changes that set (sharp's platform binaries arrive as ordinary
    # optionalDependencies, not through a lifecycle script).
    - (cd frontend && npm ci --ignore-scripts)
    - node tools/licenses/licence-policy.mjs

security:gitleaks:
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  <<: *dev_or_mr
  variables:
    # The whole history, not GitLab's shallow default. This job reported
    # 28 leaks that are not leaks, and the depth is why: `.gitleaksignore`
    # pins each accepted finding to commit:path:rule:line, and a shallow
    # clone's oldest commit presents the entire tree as newly added under
    # *its* SHA rather than the SHA that really introduced each line. So
    # every fingerprint missed, and every fixture key in
    # recovery_prompt_test.go came back as a finding. The byte counts say
    # the same thing: 177MB over 102 commits shallow, against 20MB over
    # 999 full, because a truncated history has no diffs to scan, only
    # whole files.
    #
    # Reproduced with `git clone --depth 20` of this repo and the job's
    # own command: 24 findings, all in the file `.gitleaksignore` already
    # covers. A full clone finds none (#912).
    GIT_DEPTH: 0
  script:
    # --redact for the same reason secret-scan.yml gives on the GitHub
    # side: without it, a job that finds a real secret republishes it into
    # the build log and into an artifact anyone with repository access can
    # download. The finding still names the file, the rule and the commit,
    # which is what anyone fixing it needs. This lane had no redaction at
    # all until #912.
    - gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1
  artifacts:
    when: always
    paths:
      - gitleaks.sarif

security:trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.73.0
    entrypoint: [""]
  <<: *dev_or_mr
  variables:
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache
  script:
    - trivy fs --exit-code 0 --severity CRITICAL,HIGH,MEDIUM,LOW --scanners vuln,license --format sarif --output trivy-fs.sarif .
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
  allow_failure: true

# ---------------------------------------------------------------------------
# SYNC — GitHub is a mirror of dev, preview and main. After a push to any of
# the three (a merge here lands as a push), mirror-to-github pushes that
# branch to GitHub. It runs only once the owner has set
# MIRROR_TO_GITHUB=true (#935 step 4).
#
# The mirror pushes over SSH with a GitHub deploy key -- one repository,
# push only, no API access -- held in GITHUB_MIRROR_SSH_KEY, a protected
# file-type CI/CD variable. GitHub's rulesets on the three branches exempt
# deploy keys and nothing else, so no owner token is ever able to bypass
# them (owner decision on #935, 2026-09-04). Protected-only means the
# variable is empty on an unprotected branch: preview and main must be
# protected here before their first promotion.
#
# GitHub's SSH host keys come from api.github.com/meta over TLS rather than
# ssh-keyscan, so the first connection is verified rather than trusted.
#
# There was a second job here that closed GitHub issues from the merged
# merge request. It is gone: issues live on GitLab now (owner decision on
# #935, 2026-09-04), and GitLab closes them itself from the merge request
# description, because dev is this project's default branch.
# ---------------------------------------------------------------------------

sync:mirror-to-github:
  stage: sync
  # Light lane (#949): a git push, no build.
  tags: [light]
  # Plain alpine plus git, like policy:promotion-hop. alpine/git's entrypoint
  # is git itself, so the runner's shell arrives as `git sh` and the job dies
  # before its script (dev pipeline 193).
  image: alpine:3.22
  # `needs: []`: the mirror reflects the branch, not the pipeline. The merge
  # request already ran lint, test and security before it merged; a flaky
  # test on the post-merge run must not leave GitHub behind, silently.
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $MIRROR_TO_GITHUB == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "preview" || $CI_COMMIT_BRANCH == "main")'
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git openssh-client curl jq >/dev/null
    - test -n "$GITHUB_MIRROR_SSH_KEY" || { echo "GITHUB_MIRROR_SSH_KEY is not set -- is $CI_COMMIT_BRANCH protected?"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # GitLab's variable editor trims the key's final newline, and OpenSSH
    # refuses a key without one ("error in libcrypto", dev pipeline 198).
    # Strip CRs, put the newline back, and prove the key loads before
    # trying GitHub -- without printing any of it.
    - tr -d '\r' < "$GITHUB_MIRROR_SSH_KEY" > ~/.ssh/mirror_key && chmod 600 ~/.ssh/mirror_key
    - '[ -n "$(tail -c1 ~/.ssh/mirror_key)" ] && echo >> ~/.ssh/mirror_key || true'
    - 'head -1 ~/.ssh/mirror_key | grep -q "PRIVATE KEY" || { echo "GITHUB_MIRROR_SSH_KEY does not begin with a PRIVATE KEY header -- was the public half pasted?"; exit 1; }'
    - 'ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null || { echo "GITHUB_MIRROR_SSH_KEY is not a readable private key ($(wc -l < ~/.ssh/mirror_key) lines) -- re-paste the whole file"; exit 1; }'
    - curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com \(.)"' > ~/.ssh/known_hosts
    - test -s ~/.ssh/known_hosts
    - export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
    - git remote add github git@github.com:tomlawesome/mikroview.git 2>/dev/null || git remote set-url github git@github.com:tomlawesome/mikroview.git
    # Never --force: if this is refused non-fast-forward, something wrote to
    # GitHub's copy and the branch has forked. Reconcile by merge (#935).
    - git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH"

# ---------------------------------------------------------------------------
# CHR-EXERCISE — #894: weekly, boots MikroTik's own CHR image under
# software-emulated QEMU (no /dev/kvm needed — this exercises
# configuration commands, not throughput, per the owner's decision on
# #894) at the newest stable RouterOS release, and runs the setup
# wizard's starting commands against it. Green with nothing to exercise
# is silent; green after actually booting a CHR opens a merge request
# appending the verified row; red names the refused command.
#
# Inert on every pipeline source except a GitLab Pipeline Schedule that
# itself carries a CHR_EXERCISE=true variable — set on that one
# schedule, not project-wide, so this cannot fire from a dev push or a
# merge request, and cannot collide with any other scheduled pipeline
# this project adds later. The owner has already created that schedule
# (weekly, matching routeros-freshness.yml's GitHub cron: 0 7 * * 1) and
# the GITLAB_MR_TOKEN CI/CD variable scripts/routeros-chr-open-mr.sh
# needs — see that script's header and docs/routeros-chr-exercise.md.
#
# No Docker anywhere in this job, and so no privileged runner and no
# runner tag: #894 only exercises RouterOS command syntax, never
# throughput, which is exactly what QEMU's software emulation (-accel
# tcg) is for. TCG needs no /dev/kvm and no elevated privilege, so
# scripts/routeros-chr-boot.sh runs qemu-system-x86_64 directly inside
# this job's own container — installed below — on the same untagged
# shared runner the rest of this file already uses. scripts/live-routeros.sh's
# Docker path stays for local development, unused by this job — see
# routeros-chr-boot.sh's header for why the two scripts are split.
# ---------------------------------------------------------------------------

chr-exercise:run:
  stage: chr-exercise
  image: golang:1.27
  # This job gates nothing. It boots a CHR and records which of the
  # wizard's commands RouterOS still accepts (#894); a unit test failing
  # on this runner says nothing about that. Without `needs: []` it sits
  # in the last stage behind lint, test and security, so any failure
  # anywhere ahead of it skips it -- which is exactly what had happened:
  # it had never run once, in any pipeline, because something earlier
  # always failed first (#908, #923). A skipped job reports nothing while
  # looking like it was considered.
  needs: []
  # The weekly schedule, plus an on-demand path from the web UI or the
  # API. Without one, a change to this job can only be tested by waiting
  # for the next Monday, which in practice means it never gets tested --
  # the same argument the testing rules make for keeping heavy validation
  # reachable without waiting on the trigger that normally runs it.
  # CHR_EXERCISE stays required, so an ordinary pipeline never picks it up
  # by accident.
  rules:
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CHR_EXERCISE == "true" && $CI_PIPELINE_SOURCE == "api"'
  before_script:
    # Repeated rather than merged from .git_safe: a job-level before_script
    # replaces an inherited one outright, so this job cannot have both.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - apt-get update -qq && apt-get install -y -qq qemu-system-x86 qemu-utils python3 unzip curl >/dev/null
    # Quoted whole: a bare "key: value" inside the message makes YAML read
    # this line as a mapping and GitLab reject the file (pipeline 145).
    - 'command -v qemu-system-x86_64 >/dev/null 2>&1 || { echo "chr-exercise: qemu-system-x86_64 missing after installing qemu-system-x86 -- cannot boot CHR"; exit 1; }'
  script:
    # #929: the chr-watch job has to hear about this run whether it passed
    # or failed -- the failure path matters more, since that is the one a
    # plain `script:` line would silently skip. A script section stops
    # at the first non-zero line, and `after_script` runs afterwards in
    # a brand new shell that only sees files left on disk, not anything
    # this shell computed -- and the report's summary needs more than a
    # bare exit code, so building it here (where the exercise's own log
    # is already sitting in a file this same shell just wrote) is
    # simpler than reconstructing it from scratch in a second shell.
    # Capturing the status and reporting from it, then exiting with that
    # same status at the end, keeps this one job both always-reporting
    # and still red when the exercise itself failed.
    - |
      set +e
      scripts/routeros-chr-exercise.sh >chr-exercise.log 2>&1
      status=$?
      set -e
      cat chr-exercise.log

      if [ "$status" -eq 0 ]; then
        result=pass
        summary="$(grep -m1 -E 'already covered|every starting command parsed' chr-exercise.log || true)"
      elif grep -q 'failed after 3 attempts' chr-exercise.log; then
        # The retry loop in routeros-chr-boot.sh's chr_image() already
        # gave the download three tries with a pause between (#929: a
        # reset partway through the ~43 MB image, reproduced on two
        # hosts, must not read as an exercise failure). Exhausting all
        # three is a real failure, but naming it here keeps it from
        # being reported as "the exercise failed" when RouterOS itself
        # was never even reached.
        result=fail
        summary="the CHR image download failed after 3 attempts (network reset before reaching RouterOS), not the exercise itself"
      elif grep -q 'refused a command:' chr-exercise.log; then
        result=fail
        cmd="$(grep -A1 'refused a command:' chr-exercise.log | tail -n1 | sed 's/^ *//')"
        summary="RouterOS refused a command: $cmd"
      else
        result=fail
        summary="$(grep -m1 -E 'would not boot|could not (reach|compare|determine)' chr-exercise.log || true)"
      fi
      summary="$(printf '%s' "$summary" | sed 's/^routeros-chr-exercise: //')"
      [ -n "$summary" ] || summary="CHR exercise finished with exit $status -- see the job log"
      routeros_version="$(grep -oE '(RouterOS|CHR) [0-9]+\.[0-9]+(\.[0-9]+)?' chr-exercise.log | head -n1 | awk '{print $2}')"

      # A failure to publish the report is never allowed to hide, or to
      # stand in for, the exercise's own result -- report, then exit with
      # the exercise's real status regardless of how reporting went.
      if ! CHR_REPORT_RESULT="$result" CHR_REPORT_SUMMARY="$summary" \
        CHR_REPORT_ROUTEROS_VERSION="$routeros_version" scripts/chr-report.sh; then
        echo "chr-exercise: publishing the run report to GitLab failed -- see above"
      fi

      exit "$status"

# ---------------------------------------------------------------------------
# CHR-WATCH — #929, moved to GitLab by #943: reads chr/last-run.json off the
# chr-reports branch that chr-exercise:run above (via scripts/chr-report.sh)
# writes on every run, decides what it means (scripts/chr-watch/chr-watch.js,
# tested in chr-watch.test.js), and opens, comments on or closes a single
# tracking issue accordingly (scripts/chr-watch/run.js). Green closes a
# stale issue if one is open and otherwise does nothing; anything else
# (failing, stale, missing) fails this job on purpose, so the schedule
# itself shows red.
#
# Inert on every pipeline source except a GitLab Pipeline Schedule that
# itself carries a CHR_WATCH=true variable, the same pattern CHR_EXERCISE
# uses above. The owner creates that schedule (daily, matching the old
# GitHub workflow's cron) and it needs the same GITLAB_MR_TOKEN CI/CD
# variable chr-exercise:run already needs, since this job reads and writes
# issues through the same GitLab API.
# ---------------------------------------------------------------------------

chr-watch:run:
  stage: chr-exercise
  # Light lane (#949): reads one report and calls the API.
  tags: [light]
  image: node:22-alpine
  # This job only reads the report chr-exercise:run already wrote and talks
  # to the GitLab API -- nothing earlier in the pipeline can invalidate
  # that, and it must still run (and still be able to report a stale report)
  # even if something earlier in the same pipeline failed.
  needs: []
  rules:
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CHR_WATCH == "true" && $CI_PIPELINE_SOURCE == "api"'
  script:
    - node scripts/chr-watch/run.js

# ---------------------------------------------------------------------------
# RENOVATE — #945: self-hosted Renovate, replacing the Dependabot config retired
# in d3c152a now that dependency work happens on GitLab. renovate.json at the
# repo root carries the policy (dev as base branch, 7-day cooldown, minor and
# patch grouped per ecosystem, majors separate, ten open MRs); this job only
# executes it. The github-actions manager is deliberately off: the remaining
# .github/workflows/*.yml are the mirror side and are updated by hand.
#
# Inert on every pipeline source except a Pipeline Schedule carrying
# RENOVATE=true (schedule 10, Mondays 05:00 London) and the web/API paths, the
# same pattern as CHR_EXERCISE and CHR_WATCH above. RENOVATE_TOKEN is an
# impersonation token of mikroview-bot held as a masked, protected CI/CD
# variable; never echo it. GITHUB_COM_TOKEN, if set the same way, lets Renovate
# fetch release notes from github.com without hitting the anonymous rate limit.
# ---------------------------------------------------------------------------

renovate:run:
  stage: renovate
  image: renovate/renovate:44
  needs: []
  rules:
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$RENOVATE == "true" && $CI_PIPELINE_SOURCE == "api"'
  variables:
    RENOVATE_GIT_AUTHOR: "mikroview-bot <mikroview-bot@noreply.gitlab.tomlawson.io>"
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
    LOG_LEVEL: info
  script:
    - renovate --platform gitlab --endpoint "$CI_API_V4_URL" "$CI_PROJECT_PATH"
