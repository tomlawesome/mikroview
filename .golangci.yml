# golangci-lint v2, CI-only (lint:golangci, report-only until #1462/#1463
# switch it to blocking). The standard set is errcheck, govet, ineffassign,
# staticcheck and unused; dupl is added on top. gosec stays off: the
# security:gosec job already runs it.
version: "2"
linters:
  default: standard
  enable:
    - dupl
  settings:
    dupl:
      threshold: 150
