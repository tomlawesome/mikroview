name: CodeQL

# Static analysis (SAST) via GitHub's own tooling. Runs on PRs into
# preview/main (not dev -- keeps dev's fast-feedback loop cheap; a SAST
# pass on half-finished dev work isn't actionable the way it is once
# something's headed toward a release) plus a weekly scan so a newly
# published CodeQL query set still gets applied to existing code, not
# just new changes.
on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
