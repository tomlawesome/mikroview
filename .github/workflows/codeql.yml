name: CodeQL

# Static analysis (SAST) via GitHub's own tooling. Runs on PRs into
# preview/main (not dev -- keeps dev's fast-feedback loop cheap; a SAST
# pass on half-finished dev work isn't actionable the way it is once
# something's headed toward a release) plus a weekly scan so a newly
# published CodeQL query set still gets applied to existing code, not
# just new changes.
on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
