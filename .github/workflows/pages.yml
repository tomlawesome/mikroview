name: pages

# Publishes site/ as the project's public marketing page on GitHub
# Pages. The site represents the released state of the project, so run
# it by hand after a release reaches main.
#
# Dispatch only, under the mirror rule (#1464). GitLab has no Pages job
# yet, so this manual run is the only way the site is published:
#   build  -> none (no GitLab Pages job yet; dispatch by hand)
#   deploy -> none (no GitLab Pages job yet; dispatch by hand)
#
# site/ itself doesn't carry its own copies of the screenshots/logo --
# those already live in docs/screenshots/ and brand/ as the single
# source of truth (referenced from README.md and BRANDING.md too).
# This workflow assembles them into the deployed artifact at build
# time, so there's no duplicated binary content to keep in sync in git.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the deploy artifact
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          for shot in fall-dark topography-map-dark stream-dark; do
            cp "docs/screenshots/$shot.png" "_site/img/$shot.png"
          done
          cp brand/logo-mark.svg _site/img/logo-mark.svg

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
