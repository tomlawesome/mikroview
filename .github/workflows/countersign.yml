name: countersign

# The second, independent signature #1309 sets up. GitLab signs a
# released digest automatically with a key it fences (private half never
# leaves the runner host); this workflow is the GitHub half, and it is
# deliberately manual -- an automatic second signer stops nothing, since
# whoever can trigger the first workflow can trigger the second. Requiring
# the owner's own GitHub login to run this means a bad release needs two
# independent compromises on two hosts, not one.
#
# It verifies GitLab's evidence where it lives: the key-based signature
# and SPDX attestation on the GitLab registry digest
# (registry.tomlawson.io/ai/mikroview@<digest>), against the committed
# cosign.pub, *before* adding anything, and refuses on mismatch, absence,
# ambiguity or expiry rather than falling through to a generic failure.
# Only once that verification passes does it add the keyless
# (Sigstore/OIDC) signature to the GHCR digest, then verifies it.
#
# Since #1472 step 3 the GHCR digest is GitLab's own bytes: release-on-tag.yml
# (and publish-from-gitlab.yml for preview) verifies at the source and copies
# the image only, by digest; GitLab's signature stays in the GitLab registry,
# so this checks it there. Dispatch this with the digest release-on-tag.yml
# reports; the digest must also resolve on GHCR. A re-run of
# release-on-tag.yml leaves this countersignature in place.
#
# Secrets: GITLAB_READ_TOKEN_NAME and GITLAB_READ_TOKEN, the read-only GitLab
# project access token the publish workflows use, to read the GitLab
# registry; plus the built-in GITHUB_TOKEN with id-token: write (keyless
# signing) and packages: write (pushing the signature to our own package).
#
# No GitLab job replaces this, by design: it is the GitHub half of two
# signatures.
#   countersign -> none (second custody; GitLab's half is sign:release-digest)
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Released image digest to countersign (sha256:<64 hex chars>)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  countersign:
    name: Verify the key-based signature, then countersign keyless
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SOURCE_IMAGE: registry.tomlawson.io/ai/mikroview
      # Reaches every run: step through this variable, never inline as
      # ${{ inputs.digest }} -- inline, a crafted input would be pasted
      # into the shell as code (semgrep run-shell-injection), matching
      # the convention docker.yml's release job uses for VERSION.
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the digest input
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::'$DIGEST' is not a bare digest (want sha256:<64 hex chars>) -- refusing"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the GitLab registry (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: registry.tomlawson.io
          username: ${{ secrets.GITLAB_READ_TOKEN_NAME }}
          password: ${{ secrets.GITLAB_READ_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Check the digest is on GHCR
        run: |
          got="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{.Manifest.Digest}}')"
          if [ "${got}" != "${DIGEST}" ]; then
            echo "::error::${IMAGE}@${DIGEST} resolved to ${got:-nothing} -- refusing"
            exit 1
          fi

      # The classification below (absence / expiry / mismatch / ambiguous,
      # each explicit and named, never a fall-through) lives in
      # scripts/verify-release-signature.sh, tested by
      # scripts/verify-release-signature.test.sh (Q6-F1).
      - name: Verify GitLab's key-based signature and SBOM attestation at the source
        run: |
          scripts/verify-release-signature.sh "${SOURCE_IMAGE}@${DIGEST}"
          cosign verify-attestation --key cosign.pub --type spdxjson "${SOURCE_IMAGE}@${DIGEST}" > /dev/null

      - name: Countersign keyless
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the countersignature
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github.com/tomlawesome/mikroview/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
