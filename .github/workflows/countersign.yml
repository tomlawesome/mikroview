name: countersign

# The second, independent signature #1309 sets up. GitLab signs a
# released digest automatically with a key it fences (private half never
# leaves the runner host); this workflow is the GitHub half, and it is
# deliberately manual -- an automatic second signer stops nothing, since
# whoever can trigger the first workflow can trigger the second. Requiring
# the owner's own GitHub login to run this means a bad release needs two
# independent compromises on two hosts, not one.
#
# It verifies GitLab's key-based signature against the committed
# cosign.pub *before* adding anything, and refuses on mismatch, absence,
# ambiguity or expiry rather than falling through to a generic failure.
# Only once that verification passes does it add the keyless
# (Sigstore/OIDC) signature -- the same kind docker.yml's release job used
# to add automatically.
#
# No new secret: the built-in GITHUB_TOKEN, plus id-token: write (keyless
# signing) and packages: write (pushing the signature to our own
# package), is the whole permission set.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Released image digest to countersign (sha256:<64 hex chars>)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  countersign:
    name: Verify the key-based signature, then countersign keyless
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Reaches every run: step through this variable, never inline as
      # ${{ inputs.digest }} -- inline, a crafted input would be pasted
      # into the shell as code (semgrep run-shell-injection), matching
      # the convention docker.yml's release job uses for VERSION.
      DIGEST: ${{ inputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the digest input
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::'$DIGEST' is not a bare digest (want sha256:<64 hex chars>) -- refusing"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Each refusal below is explicit and named, not a fall-through:
      #   - absence:  cosign reports no matching signatures at all.
      #   - expiry:   the digest no longer resolves in the registry (the
      #               registry does not carry it -- expired, pruned by
      #               retention, or never pushed).
      #   - mismatch: cosign reports failure for any other reason, i.e. a
      #               signature exists but does not verify against
      #               cosign.pub.
      #   - ambiguous: cosign verifies successfully but returns other
      #               than exactly one matching signature.
      - name: Verify GitLab's key-based signature
        run: |
          set +e
          output="$(cosign verify --key cosign.pub --output json "${IMAGE}@${DIGEST}" 2>&1)"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            if grep -qiE 'no matching signatures' <<< "$output"; then
              echo "::error::no key-based signature found for ${DIGEST} -- refusing (absence)"
            elif grep -qiE 'MANIFEST_UNKNOWN|manifest unknown|NAME_UNKNOWN|404 Not Found' <<< "$output"; then
              echo "::error::${DIGEST} does not resolve in ${IMAGE} (expired, pruned, or never pushed) -- refusing (expiry)"
            else
              echo "::error::the key-based signature on ${DIGEST} does not verify against cosign.pub -- refusing (mismatch)"
            fi
            echo "$output" >&2
            exit 1
          fi

          count="$(jq 'length' <<< "$output")"
          if [ "$count" -ne 1 ]; then
            echo "::error::${DIGEST} resolved to ${count} verified key-based signatures, expected exactly 1 -- refusing (ambiguous)"
            echo "$output" >&2
            exit 1
          fi

          echo "Verified exactly one key-based signature on ${DIGEST} against cosign.pub."

      - name: Countersign keyless
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
