name: live-check image

# Builds the image the live-check gate runs in on a CI runner, and
# publishes it to this repo's own package namespace.
#
# Separate from docker.yml on purpose. That workflow publishes the
# product -- distroless, nonroot, signed, promoted by digest through
# preview to main. This one publishes a toolchain: Go, Node and
# Playwright's Chromium, which exist so a gate run does not spend its
# first ten minutes installing them. The two have different lifecycles
# (this changes when a pinned toolchain moves, not when the app does)
# and different audiences, so mixing them would tie a tooling rebuild to
# the release lane for no reason.
#
# Publishing from dev, which docker.yml deliberately does not do, is the
# same reasoning read the other way: a moving-target *product* image is
# not worth shipping, but a gate that cannot run until something reaches
# preview is a gate nobody uses.
on:
  push:
    branches: [dev]
    paths:
      - live-check.Dockerfile
      - .github/workflows/live-check-image.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish the gate image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing, exactly as docker.yml does it: the workflow's
      # OIDC identity is exchanged for a short-lived certificate, so
      # there is no long-lived key to store. This image is not shipped
      # to anyone, but it does execute the project's own code on a
      # self-hosted runner, which is a good enough reason to be able to
      # tell whether a given digest came from here.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Two tags: a moving `latest` for the runner to pull, and an
      # immutable commit tag so a run that behaved oddly can say which
      # image it used.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/live-check
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sha.outputs.short }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: live-check.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Signs the digest, never a tag -- a tag is a mutable pointer, so
      # signing one would let it be moved to different content and still
      # verify.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}/live-check@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/live-check
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
