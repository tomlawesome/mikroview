name: Publish the GitLab-tested image to GHCR

# GitLab (gitlab.tomlawson.io, ai/mikroview) is where mikroview is built,
# tested, signed and merged; this repository is its push mirror (#1472 step
# 3). When a merge to `preview` arrives here, the GitLab pipeline for the same
# commit has built the image once, run test:container and the security jobs
# against those bytes, pushed it to registry.tomlawson.io (publish:image),
# signed the digest with the fenced key and attested its SPDX SBOM
# (sign:release-digest), and verified that signature before naming the digest
# `:preview` there (publish:channel). This workflow copies that exact digest
# to GHCR, where operators pull from, and attests it. It never builds: a
# rebuild here would be a different image from the one that was tested.
#
# Pattern: verify the signed evidence at the source, promote the image by
# digest, attest the copy under GitHub's own trust root (orbit's shape); the
# signature never travels, the digest does. Verify before copy: the `gitlab`
# job checks GitLab's key-based signature and SPDX attestation on the GitLab
# registry digest against the committed cosign.pub, so nothing reaches GHCR
# unless they verify. Copy: `docker buildx imagetools create
# --prefer-index=false` moves the image manifest and blobs only, after the
# source is re-checked, and each GHCR tag is re-read against the digest.
# Attest after copy: GitHub's own provenance and SBOM attestations on the
# GHCR digest. GitLab's signature stays in the GitLab registry.
#
# Tags: `preview-<short7>` always; `preview` only while this commit is still
# the head of `preview` (exact ref match, as GitLab's publish:channel checks),
# so a slow run for an older commit never rolls `:preview` back.
#
# The mirror push lands within minutes of the merge while the GitLab pipeline
# takes much longer, so the first step waits for it. If GitLab's pipeline
# fails, this fails too and publishes nothing, and GHCR keeps its previous
# `preview`; once GitLab is green, re-run this from the Actions tab.
#
# Secrets: GITLAB_READ_TOKEN_NAME and GITLAB_READ_TOKEN, a project access
# token on ai/mikroview with the Reporter role and the read_api and
# read_registry scopes: enough to list pipelines, download job artifacts and
# pull the image. Nothing here can write to GitLab. Nothing is installed but
# cosign and buildx (no Node setup, no Go, no npm ci): #1435.
#
# Three jobs, least privilege: `gitlab` waits, fetches and verifies with
# read-only permissions; `copy` holds the GitLab token and packages: write to
# copy; `attest` never sees the GitLab token and attests the SBOM the
# `gitlab` job took out of GitLab's verified attestation, handed over as an
# artifact.

on:
  push:
    branches: [preview]
  workflow_dispatch: {}

concurrency:
  group: publish-from-gitlab-${{ github.ref }}
  # A running copy is never cancelled mid-write. GitHub keeps at most one
  # running and only the newest pending run per group: a merge whose run is
  # still pending when a newer one arrives is dropped, so it may get no
  # preview-<short7> tag of its own. Only the branch head moves `:preview`
  # (checked below).
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GITLAB_API_URL: https://gitlab.tomlawson.io/api/v4
  GITLAB_PROJECT_ID: "53"
  GITLAB_REGISTRY: registry.tomlawson.io

jobs:
  gitlab:
    name: Wait for GitLab and verify its signed digest
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.evidence.outputs.digest }}
      source_reference: ${{ steps.evidence.outputs.source_reference }}
      pipeline_url: ${{ steps.evidence.outputs.pipeline_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for GitLab and fetch its tested-image evidence
        id: evidence
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
          MV_COMMIT: ${{ github.sha }}
          MV_REF: ${{ github.ref_name }}
          MV_EVIDENCE_DIR: gitlab-evidence
        run: bash scripts/ci/gitlab-await-tested-image.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Log in to the GitLab registry (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GITLAB_REGISTRY }}
          username: ${{ secrets.GITLAB_READ_TOKEN_NAME }}
          password: ${{ secrets.GITLAB_READ_TOKEN }}

      # The await step checked the evidence at the transport level. This is
      # the cryptographic check, on the GitLab registry digest: exactly one
      # key-based signature and exactly one SPDX attestation must verify with
      # the committed cosign.pub, or the copy job never runs. The SBOM GitHub
      # attests is that attestation's predicate, not the trivy file the await
      # step fetched (kept as evidence under gitlab-evidence/).
      - name: Verify GitLab's signature and SBOM attestation at the source
        env:
          SOURCE: ${{ steps.evidence.outputs.source_reference }}
        run: |
          scripts/verify-release-signature.sh "${SOURCE}"
          cosign verify --key cosign.pub "${SOURCE}" > signature-verification.json
          cosign verify-attestation --key cosign.pub --type spdxjson "${SOURCE}" > attestations.jsonl
          count="$(grep -c . attestations.jsonl)"
          if [ "${count}" != 1 ]; then
            echo "::error::expected exactly one verified SPDX attestation on ${SOURCE}, found ${count}"
            exit 1
          fi
          jq -r '.payload' attestations.jsonl | base64 -d | jq -e '.predicate | select(type == "object" and has("spdxVersion"))' > image.spdx.json

      - name: Upload GitLab evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikroview-gitlab-evidence
          path: |
            gitlab-evidence/gitlab-tested-image.json
            gitlab-evidence/image.spdx.json
            image.spdx.json
            signature-verification.json
            attestations.jsonl
          if-no-files-found: warn
          retention-days: 90

  copy:
    name: Copy the tested, signed digest to GHCR
    needs: gitlab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.copy.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitLab registry (read only)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GITLAB_REGISTRY }}
          username: ${{ secrets.GITLAB_READ_TOKEN_NAME }}
          password: ${{ secrets.GITLAB_READ_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the exact tested digest
        id: copy
        env:
          SOURCE: ${{ needs.gitlab.outputs.source_reference }}
          DIGEST: ${{ needs.gitlab.outputs.digest }}
        run: |
          short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          # The source must still resolve to the digest the gitlab job verified.
          got="$(docker buildx imagetools inspect "${SOURCE}" --format '{{.Manifest.Digest}}')"
          if [ "${got}" != "${DIGEST}" ]; then
            echo "::error::${SOURCE} now resolves to ${got}, expected ${DIGEST}; nothing copied"
            exit 1
          fi
          # Every GHCR tag written must resolve to the GitLab digest afterwards.
          check() {
            got="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}')"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "::error::$1 resolved to ${got} after the copy, expected ${DIGEST}"
              exit 1
            fi
          }
          # --prefer-index=false: a single-manifest source is not wrapped in a
          # new index under a different digest (#1407).
          docker buildx imagetools create --prefer-index=false --tag "ghcr.io/tomlawesome/mikroview:preview-${short}" "${SOURCE}"
          check "ghcr.io/tomlawesome/mikroview:preview-${short}"
          tags="preview-${short}"

          # ls-remote matches by suffix, so only the line whose ref is exactly
          # refs/heads/preview counts (as GitLab's publish:channel checks).
          head="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" refs/heads/preview | awk '$2 == "refs/heads/preview" {print $1}')"
          if [ "${head}" = "${GITHUB_SHA}" ]; then
            docker buildx imagetools create --prefer-index=false --tag "ghcr.io/tomlawesome/mikroview:preview" "${SOURCE}"
            check "ghcr.io/tomlawesome/mikroview:preview"
            tags="${tags} preview"
          else
            echo "::notice::${GITHUB_SHA} is no longer the head of preview (now ${head:-unknown}); published preview-${short} only"
          fi
          printf 'tags=%s\n' "${tags}" >> "${GITHUB_OUTPUT}"

  attest:
    name: Attest the GHCR digest
    needs: [gitlab, copy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM the gitlab job took out of GitLab's verified attestation,
      # handed over as an artifact so this job never holds the GitLab token.
      - name: Fetch the verified SBOM from the gitlab job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mikroview-gitlab-evidence

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tomlawesome/mikroview
          subject-digest: ${{ needs.gitlab.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tomlawesome/mikroview
          subject-digest: ${{ needs.gitlab.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify published image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.gitlab.outputs.digest }}
        run: |
          ref="oci://ghcr.io/tomlawesome/mikroview@${DIGEST}"
          gh attestation verify "${ref}" --repo "${GITHUB_REPOSITORY}" \
            --format json > provenance-verification.json
          gh attestation verify "${ref}" --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json > sbom-verification.json

      - name: Upload publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikroview-published-from-gitlab
          path: |
            image.spdx.json
            provenance-verification.json
            sbom-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record published image
        env:
          TAGS: ${{ needs.copy.outputs.tags }}
          DIGEST: ${{ needs.gitlab.outputs.digest }}
          SOURCE: ${{ needs.gitlab.outputs.source_reference }}
          PIPELINE_URL: ${{ needs.gitlab.outputs.pipeline_url }}
        run: |
          {
            printf '## mikroview preview image, copied from GitLab\n\n'
            printf -- '- Image: `ghcr.io/tomlawesome/mikroview`\n'
            printf -- '- Tags: `%s`\n' "${TAGS}"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Copied from: `%s`\n' "${SOURCE}"
            printf -- '- Tested and signed by: %s\n' "${PIPELINE_URL}"
            printf -- '- Source revision: `%s`\n' "${GITHUB_SHA}"
            printf '\nNo container was built here.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
