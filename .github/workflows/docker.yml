name: docker

# dev deliberately publishes nothing -- keeps dev cheap/fast, and a
# moving-target image built from unreviewed dev work isn't something
# worth shipping to the registry. preview publishes the actual release
# candidate; main never rebuilds, it only ever promotes (retags) the
# exact digest that was already built and smoke-tested from preview --
# see ci.yml's container/security jobs, which both run on preview.
on:
  push:
    branches: [preview, main]
  workflow_dispatch: {}

jobs:
  publish-preview:
    name: Build + publish preview image
    if: github.ref_name == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless (Fulcio/Rekor) signing exchanges this workflow's OIDC
      # identity for a short-lived certificate -- there is no long-lived
      # private key to store or leak. What gets recorded is "this
      # workflow, on this repo, at this commit, produced this digest".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=raw,value=preview-${{ steps.sha.outputs.short }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=preview:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Records how the image was built (source, workflow, inputs)
          # in a form a verifier can check without trusting the image.
          provenance: mode=max
          sbom: true

      # Everything below signs and attests the *digest*, never a tag. A
      # tag is a mutable pointer -- signing one would let it be moved to
      # different content afterwards and still verify.
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Is this merge a release? Keyed on whether the tag for the VERSION
  # file's contents already exists, which makes the answer a fact about
  # the repository rather than a guess about intent -- and makes the
  # whole thing idempotent if a workflow is re-run.
  detect-release:
    name: Release or ordinary merge?
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged -- this is an ordinary merge, not a release"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag yet -- releasing"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, test and publish the release
    needs: detect-release
    if: github.ref_name == 'main' && needs.detect-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # creating the release tag
      packages: write
      id-token: write        # keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Published under the version tag ONLY at this point. `latest` does
      # not move until the smoke test below passes -- see the note on the
      # smoke-test step for why that ordering is the whole point.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.detect-release.outputs.version }}
          build-args: |
            VERSION=${{ needs.detect-release.outputs.version }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      # Rebuilding on main forfeits the property promote-by-retag was
      # protecting: that the exact bytes smoke-tested are the bytes that
      # ship. This step buys it back on the release artefact rather than
      # inheriting it from preview's -- so it has to run against the
      # image just built, and before `latest` points at it.
      - name: Smoke-test the image that will become latest
        run: |
          docker run -d --name release-test             -p 8080:8080             ghcr.io/${{ github.repository }}:${{ needs.detect-release.outputs.version }}
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "healthy"
              docker rm --force release-test
              exit 0
            fi
            sleep 1
          done
          docker logs release-test
          docker rm --force release-test
          exit 1

      - name: Verify the binary reports the release version
        run: |
          got="$(docker run --rm --entrypoint /mikroview             ghcr.io/${{ github.repository }}:${{ needs.detect-release.outputs.version }} -version)"
          want="${{ needs.detect-release.outputs.version }}"
          echo "binary reports: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got' but this release is '$want'"
            exit 1
          fi

      - name: Move latest to the tested release
        run: |
          src="ghcr.io/${{ github.repository }}:${{ needs.detect-release.outputs.version }}"
          docker buildx imagetools create --tag "ghcr.io/${{ github.repository }}:latest" "$src"

      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Last, so a failure anywhere above leaves no tag claiming a
      # release happened.
      - name: Tag the release
        run: |
          git tag "${{ needs.detect-release.outputs.version }}"
          git push origin "${{ needs.detect-release.outputs.version }}"

  promote-to-main:
    name: Promote the tested preview image to latest
    needs: detect-release
    if: github.ref_name == 'main' && needs.detect-release.outputs.is_release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve which preview commit this merge promotes
        id: source
        run: |
          # A standard (non-squash, non-rebase) merge commit's second
          # parent is preview's tip at merge time -- what
          # publish-preview built and tagged preview-<short sha> from.
          # Falls back to HEAD itself for a fast-forward merge (no
          # second parent), same commit either way.
          parent="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          echo "short=$(git rev-parse --short=7 "$parent")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Retag the exact preview digest as latest -- no rebuild
        run: |
          src="ghcr.io/${{ github.repository }}:preview-${{ steps.source.outputs.short }}"
          dst="ghcr.io/${{ github.repository }}:latest"
          echo "Promoting $src -> $dst (no rebuild)"
          docker buildx imagetools create --tag "$dst" "$src"
