name: docker

# RETIRED (#1472 step 3, #1464): GitHub no longer builds the product image.
# GitLab builds it once, tests, signs and publishes it, and GitHub only
# copies that digest to GHCR. This file is kept, workflow_dispatch only, until
# two preview publishes and one release have gone through the new path; then
# it is deleted. Its push and tag triggers are gone in the same commit that
# added the copying workflows, so GHCR `:preview` and `:latest` are never
# written by two workflows. Every job carries a hard `if: false`, so a
# manual dispatch on preview or a tag cannot build or push anything.
#
# Where each old job went:
#   publish-preview  -> GitLab build:image, test:container, security:*
#                       (security:trivy-image writes the SBOM), publish:image,
#                       sign:release-digest, publish:channel; then GitHub's
#                       publish-from-gitlab.yml copies the digest to
#                       ghcr.io as preview-<short7> and preview.
#   release          -> GitLab release:check-version (tag equals v<VERSION>,
#                       binary reports it), plus the same build:image,
#                       test:container, security:* and publish:* jobs on the
#                       tag; then GitHub's release-on-tag.yml copies the
#                       digest to ghcr.io as vX.Y.Z.
#   promote-to-main  -> release-on-tag.yml's `latest` move, on the release tag
#                       rather than the main merge.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-preview:
    name: Build + publish preview image
    if: false  # retired (#1472): was github.ref_name == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless (Fulcio/Rekor) signing exchanges this workflow's OIDC
      # identity for a short-lived certificate -- there is no long-lived
      # private key to store or leak. What gets recorded is "this
      # workflow, on this repo, at this commit, produced this digest".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          # A signing job builds from a clean state: no cache another run
          # could have written (#1479).
          cache: false
      - run: go test ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=raw,value=preview-${{ steps.sha.outputs.short }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=preview:${{ steps.sha.outputs.short }}
          # Records how the image was built (source, workflow, inputs)
          # in a form a verifier can check without trusting the image.
          provenance: mode=max
          sbom: true

      # Everything below signs and attests the *digest*, never a tag. A
      # tag is a mutable pointer -- signing one would let it be moved to
      # different content afterwards and still verify.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Build, test and publish the release
    if: false  # retired (#1472): was github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # needed for the provenance attestation below (OIDC)
      attestations: write
    env:
      # The tag reaches every `run:` step through this variable, never as
      # `${{ github.ref_name }}` inline -- inline, a crafted tag name would
      # be pasted into the shell as code (semgrep run-shell-injection).
      VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the trigger; the file is the check. A tag that does not
      # match VERSION at the tagged commit is a mistake, not a release.
      - name: Check the tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "$want" ]; then
            echo "::error::tag '$VERSION' but VERSION says '$want' -- tag the commit whose VERSION matches, or bump VERSION first"
            exit 1
          fi

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Published under the version tag ONLY at this point. `latest` does
      # not move until the smoke test below passes -- see the note on the
      # smoke-test step for why that ordering is the whole point.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      # Rebuilding on main forfeits the property promote-by-retag was
      # protecting: that the exact bytes smoke-tested are the bytes that
      # ship. This step buys it back on the release artefact rather than
      # inheriting it from preview's -- so it has to run against the
      # image just built, and before `latest` points at it.
      - name: Smoke-test the image that will become latest
        run: |
          # From v0.7.0 the server refuses to start with no key mounted
          # (CFG-0083, #1202 ruling 2: there is no unencrypted mode), so a bare
          # `docker run` of this image never answers healthz and latest never
          # moves. Make a throwaway key the way install.sh and .gitlab-ci.yml's
          # test:container do -- in a volume, written by a helper container,
          # owned by the image's uid 1000, mounted read-only at the app folder
          # -- so this step starts the image the way an operator does.
          docker volume create release-test-etc >/dev/null
          docker run --rm -v release-test-etc:/etc/mikroview alpine:3.24 sh -c \
            'mkdir -p /etc/mikroview/keys &&
             head -c 32 /dev/urandom | base64 > /etc/mikroview/keys/history.key &&
             chown 1000:1000 /etc/mikroview/keys/history.key &&
             chmod 600 /etc/mikroview/keys/history.key'
          docker run -d --name release-test -p 8080:8080 \
            -v release-test-etc:/etc/mikroview:ro \
            $IMAGE:$VERSION
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "healthy"
              docker rm --force release-test
              docker volume rm release-test-etc
              exit 0
            fi
            sleep 1
          done
          docker logs release-test
          docker rm --force release-test
          docker volume rm release-test-etc
          exit 1

      - name: Verify the binary reports the release version
        run: |
          got="$(docker run --rm --entrypoint /mikroview             $IMAGE:$VERSION -version)"
          want="$VERSION"
          echo "binary reports: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got' but this release is '$want'"
            exit 1
          fi

      - name: Move latest to the tested release
        run: |
          src="$IMAGE:$VERSION"
          dst="$IMAGE:latest"
          # $src is built with provenance: mode=max and sbom: true above,
          # so it is already an OCI index -- --prefer-index=false is a
          # no-op there, confirmed locally against a throwaway registry.
          # It stays on in case that ever changes (#1407): without it,
          # a single-manifest source gets wrapped in a new index under a
          # different digest.
          docker buildx imagetools create --prefer-index=false --tag "$dst" "$src"
          src_digest="$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}')"
          got_digest="$(docker buildx imagetools inspect "$dst" --format '{{.Manifest.Digest}}')"
          if [ "$got_digest" != "$src_digest" ]; then
            echo "::error::retag moved the digest: $dst is $got_digest, expected $src_digest from $src"
            exit 1
          fi

      # Keyless signing used to happen here, automatically. Two
      # signatures made by the same workflow are one signature -- anyone
      # who can trigger this job produces both. The keyless signature now
      # comes from .github/workflows/countersign.yml, a workflow_dispatch
      # the owner runs by hand against this same digest (#1309).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-to-main:
    name: Promote the tested preview image to latest
    if: false  # retired (#1472): was github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve which preview commit this merge promotes
        id: source
        run: |
          # A standard (non-squash, non-rebase) merge commit's second
          # parent is preview's tip at merge time -- what
          # publish-preview built and tagged preview-<short sha> from.
          # Falls back to HEAD itself for a fast-forward merge (no
          # second parent), same commit either way.
          parent="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          echo "short=$(git rev-parse --short=7 "$parent")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Retag the exact preview digest as latest -- no rebuild
        env:
          REPO: ${{ github.repository }}
          SHORT: ${{ steps.source.outputs.short }}
        run: |
          src="ghcr.io/${REPO}:preview-${SHORT}"
          dst="ghcr.io/${REPO}:latest"
          echo "Promoting $src -> $dst (no rebuild)"
          # $src is built with provenance: mode=max and sbom: true, so it
          # is already an OCI index -- --prefer-index=false is a no-op
          # there, confirmed locally against a throwaway registry. It
          # stays on in case that ever changes (#1407): without it, a
          # single-manifest source gets wrapped in a new index under a
          # different digest.
          docker buildx imagetools create --prefer-index=false --tag "$dst" "$src"
          src_digest="$(docker buildx imagetools inspect "$src" --format '{{.Manifest.Digest}}')"
          got_digest="$(docker buildx imagetools inspect "$dst" --format '{{.Manifest.Digest}}')"
          if [ "$got_digest" != "$src_digest" ]; then
            echo "::error::retag moved the digest: $dst is $got_digest, expected $src_digest from $src"
            exit 1
          fi
