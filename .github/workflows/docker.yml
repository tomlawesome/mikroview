name: docker

# dev deliberately publishes nothing -- keeps dev cheap/fast, and a
# moving-target image built from unreviewed dev work isn't something
# worth shipping to the registry. preview publishes the actual release
# candidate -- see .gitlab-ci.yml's test:container job and its
# security stage (security:semgrep, security:gosec,
# security:govulncheck, security:fuzz, security:npm-audit,
# security:licence-policy, security:gitleaks, security:trivy-fs),
# which carry that work now that ci.yml is retired.
#
# main does one thing: retags preview's exact already-tested digest as
# latest. No rebuild, no release.
#
# A release is a `v*` tag, created on GitLab (the source of truth) and
# pushed here by sync:mirror-to-github. The tag must equal `v<VERSION>`
# at the tagged commit, so the version bump is still part of the
# promotion diff (docs/decisions/release-versioning.md); the tag says
# *when*, the file says *what*. The release job builds a fresh image,
# smoke-tests that build, then moves latest to it. The rebuild is
# deliberate, not a bug -- see the comment on the release job for why.
# A failed release is re-run on the same tag once the cause is fixed;
# nothing is retagged or renumbered (owner decision on #572, 2026-09-10).
on:
  push:
    branches: [preview, main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish-preview:
    name: Build + publish preview image
    if: github.ref_name == 'preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless (Fulcio/Rekor) signing exchanges this workflow's OIDC
      # identity for a short-lived certificate -- there is no long-lived
      # private key to store or leak. What gets recorded is "this
      # workflow, on this repo, at this commit, produced this digest".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - run: go test ./...

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=preview
            type=raw,value=preview-${{ steps.sha.outputs.short }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=preview:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Records how the image was built (source, workflow, inputs)
          # in a form a verifier can check without trusting the image.
          provenance: mode=max
          sbom: true

      # Everything below signs and attests the *digest*, never a tag. A
      # tag is a mutable pointer -- signing one would let it be moved to
      # different content afterwards and still verify.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Build, test and publish the release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag is the trigger; the file is the check. A tag that does not
      # match VERSION at the tagged commit is a mistake, not a release.
      - name: Check the tag matches VERSION
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "${{ github.ref_name }}" != "$want" ]; then
            echo "::error::tag '${{ github.ref_name }}' but VERSION says '$want' -- tag the commit whose VERSION matches, or bump VERSION first"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Published under the version tag ONLY at this point. `latest` does
      # not move until the smoke test below passes -- see the note on the
      # smoke-test step for why that ordering is the whole point.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      # Rebuilding on main forfeits the property promote-by-retag was
      # protecting: that the exact bytes smoke-tested are the bytes that
      # ship. This step buys it back on the release artefact rather than
      # inheriting it from preview's -- so it has to run against the
      # image just built, and before `latest` points at it.
      - name: Smoke-test the image that will become latest
        run: |
          docker run -d --name release-test             -p 8080:8080             ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              echo "healthy"
              docker rm --force release-test
              exit 0
            fi
            sleep 1
          done
          docker logs release-test
          docker rm --force release-test
          exit 1

      - name: Verify the binary reports the release version
        run: |
          got="$(docker run --rm --entrypoint /mikroview             ghcr.io/${{ github.repository }}:${{ github.ref_name }} -version)"
          want="${{ github.ref_name }}"
          echo "binary reports: $got"
          if [ "$got" != "$want" ]; then
            echo "::error::binary reports '$got' but this release is '$want'"
            exit 1
          fi

      - name: Move latest to the tested release
        run: |
          src="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          docker buildx imagetools create --tag "ghcr.io/${{ github.repository }}:latest" "$src"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  promote-to-main:
    name: Promote the tested preview image to latest
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve which preview commit this merge promotes
        id: source
        run: |
          # A standard (non-squash, non-rebase) merge commit's second
          # parent is preview's tip at merge time -- what
          # publish-preview built and tagged preview-<short sha> from.
          # Falls back to HEAD itself for a fast-forward merge (no
          # second parent), same commit either way.
          parent="$(git rev-parse HEAD^2 2>/dev/null || git rev-parse HEAD)"
          echo "short=$(git rev-parse --short=7 "$parent")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Retag the exact preview digest as latest -- no rebuild
        run: |
          src="ghcr.io/${{ github.repository }}:preview-${{ steps.source.outputs.short }}"
          dst="ghcr.io/${{ github.repository }}:latest"
          echo "Promoting $src -> $dst (no rebuild)"
          docker buildx imagetools create --tag "$dst" "$src"
