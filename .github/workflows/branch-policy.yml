name: branch policy

# dev, preview and main are mirrored here from GitLab, where the merge
# requests and the dev -> preview -> main promotions happen (#935). A pull
# request into any of the three on GitHub is a write to a branch GitHub
# no longer owns: merging it forks the branch, after which the mirror
# push is refused and GitHub silently falls behind. So this check fails
# every such pull request, with the address of where the work goes.
#
# The hop-order rule (preview only from dev, main only from preview) that
# this workflow used to enforce lives in .gitlab-ci.yml as
# policy:promotion-hop. Keep this job's name in the rulesets' required
# status checks so a red here blocks the merge button, not just decorates
# it.
on:
  pull_request:
    branches: [dev, preview, main]
    types: [opened, reopened, synchronize]

# Reads the PR event payload only -- no checkout, no API calls -- so the
# GITHUB_TOKEN needs no scopes at all.
permissions: {}

jobs:
  enforce:
    name: Enforce dev -> preview -> main
    runs-on: ubuntu-latest
    steps:
      - name: Refuse pull requests into mirrored branches
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "::error::'$BASE' is mirrored from GitLab and does not accept pull requests here. Open a merge request from '$HEAD' on gitlab.tomlawson.io/ai/mikroview instead (#935)."
          exit 1
