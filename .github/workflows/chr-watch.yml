# SPDX-License-Identifier: AGPL-3.0-only
#
# The CHR exercise runs on the GitLab runner, and GitHub cannot see it at
# all -- no check, nothing in Actions, no record anywhere. That is why the
# job could sit unrun from the day it was written until 2026-09-03 and
# nobody noticed: nothing was watching, so silence looked like success
# (#929).
#
# GitLab now writes chr/last-run.json to the chr-reports branch at the end
# of every run, pass or fail. This workflow reads that file daily and
# turns it into something that is actually looked at: a red check plus a
# single tracking issue, opened or commented on chr-watch.js's decision
# (.github/scripts/chr-watch.js, tested in chr-watch.test.js). Green does
# nothing beyond closing an issue that was open.
#
# Scheduled rather than triggered by the file's own push: the report lands
# on a branch of its own precisely so it triggers no CI, and because the
# thing worth alerting on includes the report *not* arriving, which no
# push event can ever fire for.
#
# A scheduled workflow only ever runs from the repository's default
# branch. This does nothing at all until it reaches `main` -- merging to
# `dev` is not enough, and reports will accumulate unread on chr-reports
# until then.
name: CHR watch

on:
  schedule:
    # Daily. The underlying job is weekly, but this only has to notice a
    # change -- pass/fail flipping, or the file going stale -- and a day's
    # delay in noticing a flip is cheap next to the job sitting unwatched
    # for months, which is what happened before this existed.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check the last CHR exercise report
    runs-on: ubuntu-latest
    steps:
      # Checked out so the decision logic can be required from a tested,
      # version-controlled file rather than inlined in this YAML. Default
      # ref (the branch this schedule fired from) is correct here: there is
      # no PR-merge ref to prefer over it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { decideChrWatch } = require('${{ github.workspace }}/.github/scripts/chr-watch.js');

            const LABEL = 'chr-watch';

            // The report lives on its own orphan-ish branch so the bot
            // commits that write it never touch code history or trigger
            // CI (#929). It may not exist yet -- first run ever, or the
            // GitLab side hasn't landed a report -- and that is not a
            // crash, it is exactly the "missing" state the module has a
            // name for.
            let raw = null;
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo,
                path: 'chr/last-run.json',
                ref: 'chr-reports',
              });
              raw = Buffer.from(data.content, data.encoding || 'base64').toString('utf8');
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info('chr-reports branch or chr/last-run.json not found -- treating as missing.');
            }

            const decision = decideChrWatch(raw, new Date());
            core.info(`CHR watch decision: ${decision.state}`);

            const openIssues = (await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: LABEL,
            })).data;
            const openIssue = openIssues[0]; // Never more than one, by construction below.

            if (decision.state === 'ok') {
              if (openIssue) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: openIssue.number, body: decision.body,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: openIssue.number,
                  state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed #${openIssue.number}: latest run passed.`);
              } else {
                core.info('Latest run passed and no issue is open -- nothing to do.');
              }
              return;
            }

            // failing, stale, or missing: the check goes red, and the
            // single open issue (if any) gets this run's details as a new
            // comment rather than a new issue, so five weekly failures
            // read as one issue with five comments (#929).
            if (openIssue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: openIssue.number, body: decision.body,
              });
              core.info(`Commented on already-open #${openIssue.number} (${decision.state}).`);
            } else {
              const created = (await github.rest.issues.create({
                ...context.repo,
                title: decision.title,
                body: decision.body,
                labels: [LABEL],
              })).data;
              core.info(`Opened #${created.number} (${decision.state}).`);
            }

            core.setFailed(`CHR watch: ${decision.state}`);
