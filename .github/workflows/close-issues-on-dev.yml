name: close-issues-on-dev

# GitHub only auto-closes an issue when a PR merges into the DEFAULT
# branch. Every feature PR here merges into `dev`, so `Closes #123` in a
# PR body never fired, and issues stayed open long after the work
# shipped -- #99, #133 and #134 all sat open for exactly this reason,
# and it would have happened to every issue after them.
#
# Changing the default branch to `dev` would also fix it, and was
# deliberately not done: `main` being the default is what tells a
# visitor that the code they land on is the released code. Inverting
# that to win an automation is the wrong trade. This workflow closes the
# gap instead.
#
# The issue is closed on the merge to `dev`, which is when the work is
# actually done. It is not released at that point -- that needs
# preview, then main -- so the closing comment says so rather than
# implying a release happened.

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close issues this PR resolved
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Checked out so the matching logic can be required from a tested,
      # version-controlled file (.github/scripts/close-issues-matcher.js)
      # instead of living only as an inline script -- see #503. `ref: dev`
      # rather than the default PR-merge ref, since by the time this job
      # runs the merge has already landed there and that's the matcher
      # version this close decision should be made with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { extractClosedIssueNumbers } = require('${{ github.workspace }}/.github/scripts/close-issues-matcher.js');

            const pr = context.payload.pull_request;
            const text = `${pr.title}\n\n${pr.body || ''}`;

            // Closing keywords GitHub itself honours, with two
            // corrections GitHub's own default-branch behaviour already
            // makes and this workflow previously didn't (#503): a
            // negated keyword ("Not fixed: #123", "doesn't close #123")
            // is not a close, and a keyword quoted inside markdown code
            // (a code span or fenced block) is not a close either.
            const numbers = extractClosedIssueNumbers(text);

            if (numbers.size === 0) {
              core.info('No closing keywords in this PR -- nothing to do.');
              return;
            }

            for (const issue_number of numbers) {
              // Skip anything already closed, and skip PRs: #123 may
              // reference either, and closing a PR here would be wrong.
              let issue;
              try {
                issue = (await github.rest.issues.get({
                  ...context.repo, issue_number,
                })).data;
              } catch (e) {
                core.warning(`#${issue_number}: could not read (${e.status}) -- skipping`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request -- skipping`);
                continue;
              }
              if (issue.state === 'closed') {
                core.info(`#${issue_number} already closed -- skipping`);
                continue;
              }

              await github.rest.issues.createComment({
                ...context.repo, issue_number,
                body:
                  `Closed by #${pr.number}, merged to \`dev\`.\n\n` +
                  `Merged is not released — promotion to \`preview\` and then \`main\` ` +
                  `is a separate, deliberate step.`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number, state: 'closed', state_reason: 'completed',
              });
              core.info(`#${issue_number}: closed`);
            }
