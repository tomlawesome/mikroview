name: CI

# Three-lane model: dev (light, fast feedback) -> preview (heavier gate,
# publishes the release candidate image) -> main (promotion only, always
# gets a full audit regardless of what changed -- see the `security` and
# `container` jobs' `if:` conditions below).
on:
  push:
    branches: [main, preview, dev]
  pull_request:
    branches: [main, preview, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detects whether this change touches anything auth-related, so the
  # security job can run on every dev/preview change that's actually
  # relevant without adding overhead to every other change -- except a
  # PR targeting main, which always gets the full audit regardless (see
  # each downstream job's `if:`).
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            auth:
              - 'internal/auth/**'
              - 'internal/api/auth.go'
              - 'internal/api/auth_test.go'
              - 'internal/api/ws.go'
              - 'frontend/src/lib/auth.svelte.ts'
              - 'frontend/src/components/Auth*.svelte'
              - 'frontend/src/components/UsersOverlay.svelte'
              - 'frontend/src/components/SSOLinkOverlay.svelte'
              - 'go.mod'
              - 'go.sum'

  test:
    name: Go + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

  # Targeted: only runs when auth-related paths changed (see `changes`
  # above) -- except a PR into main, which gets it unconditionally as
  # part of the full pre-release audit, regardless of what changed.
  security:
    name: Security (auth-focused)
    needs: changes
    if: needs.changes.outputs.auth == 'true' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Race-detector tests (auth + API)
        run: go test -race ./internal/auth/... ./internal/api/...

      # Short bounded fuzz of the two parsers that handle unauthenticated
      # network input -- anything able to reach the syslog port controls
      # these bytes entirely. 30s each is not a deep campaign; it's a
      # regression gate that catches a newly-introduced crash on the
      # committed corpus plus a little fresh exploration, without turning
      # every PR into a fuzzing job. Seed corpora and any crashers found
      # are committed under testdata/, so a reproducer stays permanent.
      - name: Fuzz the unauthenticated parsers
        run: |
          go test ./internal/routeros/ -run FuzzParse -fuzz FuzzParse -fuzztime=30s
          go test ./internal/syslog/ -run FuzzParseEnvelope -fuzz FuzzParseEnvelope -fuzztime=30s

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

  # Not run on dev (see the on.push/pull_request branch lists above
  # already excluding it isn't possible per-job, so this gates itself):
  # dev stays fast/light on purpose. Preview and main both get the real
  # container smoke test.
  container:
    name: Container smoke test
    if: github.base_ref != 'dev' && github.ref_name != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag mikroview:test .

      - name: Run hardened container
        run: >-
          docker run --detach --name mikroview-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:8080:8080
          mikroview:test

      - name: Wait for healthz
        run: |
          # TLS is on by default (self-signed, generated on first start --
          # see internal/servertls) -- -k skips verification since this is
          # just confirming the server answers, not validating a cert
          # chain.
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mikroview-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force mikroview-test || true

  postgres:
    name: Postgres integration (#131)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      # Not a `services:` container. internal/persist refuses any
      # connection that could fall back to plaintext (see its
      # requireTLS), so the server has to present a certificate -- and a
      # services block can't generate one or fix its permissions before
      # postgres starts. Building a one-line image is the shortest path
      # to a server that actually speaks TLS.
      - name: Start Postgres with TLS
        run: |
          mkdir -p /tmp/pgtls
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout /tmp/pgtls/server.key -out /tmp/pgtls/server.crt
          cat > /tmp/pgtls/Dockerfile <<'EOF'
          FROM postgres:18-alpine
          COPY server.crt /certs/server.crt
          COPY server.key /certs/server.key
          RUN chown postgres:postgres /certs/server.crt /certs/server.key \
           && chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          EOF
          docker build -t mv-pg-tls /tmp/pgtls
          docker run -d --name mv-pg \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mikroview -p 5432:5432 \
            mv-pg-tls -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 40); do
            if docker exec mv-pg pg_isready -U postgres -d mikroview >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs mv-pg
          exit 1

      # sslmode=require, not verify-full: the certificate is generated
      # above and self-signed, so there is no chain to verify. The
      # documentation recommends verify-full for real deployments; this
      # job is checking the storage logic, not certificate validation.
      - name: Integration tests
        env:
          MIKROVIEW_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/mikroview?sslmode=require
        run: go test -race -count=1 ./internal/persist/...

      - name: Clean up
        if: always()
        run: docker rm --force mv-pg || true
