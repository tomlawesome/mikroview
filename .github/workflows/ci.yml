name: CI

# What is left of GitHub's CI after #935: the two jobs that need Docker on
# the runner, the container smoke test and the Postgres integration test.
# Everything else this file used to run -- build, vet, gofmt, the Go and
# frontend test suites, svelte-check, the bundle budget, the notices and
# doc-link checks, the auth race tests, the fuzz gate, govulncheck and npm
# audit -- now runs on GitLab (.gitlab-ci.yml), where the merge happens.
# GitHub only ever sees the merged result arrive on the mirror. These two
# stay until they are ported too; the tracker has the issue.
#
# Three-lane model: dev (fast feedback) -> preview (publishes the release
# candidate image) -> main (promotion only).
#
# Both jobs run in every lane. They did not used to: the container smoke
# test and the Postgres integration job were skipped on dev to keep it
# light, on the reasoning that preview would catch anything they would.
# Preview did catch something -- 41 commits after it landed (#273). A
# one-line mistake in internal/persist forced every connection onto the
# `public` schema, which silently overrode an operator's own
# `?search_path=` and, incidentally, broke the isolation those very tests
# rely on. Nine of them had been failing for six weeks with nothing
# running them.
#
# The trade was cheap feedback for late feedback, and late is what makes
# a defect expensive: by then it is buried under forty other changes and
# the promotion PR is the thing that fails. Both jobs finish in under a
# minute. That is not worth six weeks of blindness, so neither is gated
# any more.
on:
  push:
    branches: [main, preview, dev]
  pull_request:
    branches: [main, preview, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs in every lane, dev included -- see the file header for why the
  # `if:` that used to skip it here is gone.
  #
  # The cache below is the reason this stays quick. docker.yml's
  # publish-preview and release jobs populate it (cache-to: type=gha,
  # mode=max) building the same Dockerfile, and neither runs on dev, so a
  # dev push whose Dockerfile inputs have not changed since the last
  # promotion reuses those layers. When they have changed, it pays a full
  # build -- which is the case where a container smoke test is worth
  # most, so that is the right way round.
  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: mikroview:test
          # Read-only: docker.yml's publish-preview/release jobs already
          # populate this cache (cache-to: type=gha,mode=max) building
          # the same Dockerfile from the same commit -- this job has no
          # reason to also pay to write it.
          cache-from: type=gha

      # The tmpfs at /var/lib/mikroview is not a convenience: without a
      # writable data directory this container was the only deployment
      # anywhere that ran with nowhere to persist its CA, and the app
      # carried a "persistence is optional" contract purely so this job
      # would stay green (#535). The shipped deploy/docker-compose.yml
      # pairs read_only: true with the mikroview-data volume, so a real
      # hardened deployment always has one -- this now tests that shape,
      # with every hardening flag it tested before.
      - name: Run hardened container
        run: >-
          docker run --detach --name mikroview-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --tmpfs /var/lib/mikroview:rw,noexec,nosuid,size=16m,uid=65532,gid=65532
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:8080:8080
          mikroview:test

      - name: Wait for healthz
        run: |
          # TLS is on by default (self-signed, generated on first start --
          # see internal/servertls) -- -k skips verification since this is
          # just confirming the server answers, not validating a cert
          # chain.
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mikroview-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force mikroview-test || true

  # Runs in every lane, dev included. This is the job whose absence from
  # dev let a storage defect sit for 41 commits -- see the file header.
  #
  # It builds a postgres:18-alpine-derived image on every run, which was
  # the argument for gating it. Measured, that argument does not hold up:
  # the whole job takes about 35 seconds, because the base image is one
  # pull and the derived layer is a copy and a chmod.
  postgres:
    name: Postgres integration (#131)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'

      # Not a `services:` container. internal/persist refuses any
      # connection that could fall back to plaintext (see its
      # requireTLS), so the server has to present a certificate -- and a
      # services block can't generate one or fix its permissions before
      # postgres starts. Building a one-line image is the shortest path
      # to a server that actually speaks TLS.
      - name: Start Postgres with TLS
        run: |
          mkdir -p /tmp/pgtls
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout /tmp/pgtls/server.key -out /tmp/pgtls/server.crt
          cat > /tmp/pgtls/Dockerfile <<'EOF'
          FROM postgres:18-alpine
          COPY server.crt /certs/server.crt
          COPY server.key /certs/server.key
          RUN chown postgres:postgres /certs/server.crt /certs/server.key \
           && chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          EOF
          docker build -t mv-pg-tls /tmp/pgtls
          docker run -d --name mv-pg \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mikroview -p 5432:5432 \
            mv-pg-tls -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 40); do
            if docker exec mv-pg pg_isready -U postgres -d mikroview >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs mv-pg
          exit 1

      # sslmode=require, not verify-full: the certificate is generated
      # above and self-signed, so there is no chain to verify. The
      # documentation recommends verify-full for real deployments; this
      # job is checking the storage logic, not certificate validation.
      - name: Integration tests
        env:
          MIKROVIEW_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/mikroview?sslmode=require
        # internal/matchlog alongside internal/persist (#243 slice 6):
        # its Postgres backend is a second, independent SQL sink with its
        # own dedicated table -- see docs/decisions/postgres-backend.md
        # §1a -- and needs the same real-database coverage.
        run: go test -race -count=1 ./internal/persist/... ./internal/matchlog/...

      - name: Clean up
        if: always()
        run: docker rm --force mv-pg || true
