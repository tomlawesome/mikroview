name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag mikroview:test .

      - name: Run hardened container
        run: >-
          docker run --detach --name mikroview-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:8080:8080
          mikroview:test

      - name: Wait for healthz
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mikroview-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force mikroview-test || true
