name: CI

# Three-lane model: dev (light, fast feedback) -> preview (heavier gate,
# publishes the release candidate image) -> main (promotion only). The
# container smoke test is the one thing dev skips, on time grounds; see
# the `container` job's `if:` below. Everything else runs everywhere,
# including the security job -- see its comment for why it stopped being
# conditional.
on:
  push:
    branches: [main, preview, dev]
  pull_request:
    branches: [main, preview, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Go + frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # None of the three above care about formatting, so unformatted
      # code has reached dev green. gofmt -l prints nothing when there is
      # nothing to fix, so the list is the whole check.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $(git ls-files '*.go')
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx svelte-check --tsconfig ./tsconfig.app.json

  # Runs on every change, deliberately.
  #
  # This used to be gated on a paths-filter listing the auth-related
  # directories, so it only ran when one of them changed. That filter was
  # wrong in three separate ways at once: it named internal/auth and
  # internal/api/auth.go but not main.go -- where -transfer-admin,
  # -recover-admin-account and the recovery-key handling live, the
  # commands that hand over the admin role -- nor internal/oidc, the
  # entire SSO implementation, nor internal/api/server.go, which carries
  # the route table. A PR that changed who can become admin skipped this
  # job and reported green.
  #
  # The filter has to be kept in sync with where auth code lives, and
  # nothing fails when it drifts -- the job just quietly stops running,
  # which is the worst possible failure mode for a security gate. Two
  # and a half minutes on every PR is the cheaper side of that trade.
  security:
    name: Security (auth-focused)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Race-detector tests (auth + API)
        run: go test -race ./internal/auth/... ./internal/api/...

      # Short bounded fuzz of the parsers that handle attacker-shaped
      # input: the first two are wholly unauthenticated -- anything able
      # to reach the syslog port controls these bytes entirely. The third
      # (issue #186 step 2) sits behind an ingest token, but that token
      # only proves which device is speaking, not that its bytes are
      # well-formed -- a compromised router, a buggy router-side script,
      # or a leaked token (any read-capable RouterOS user can read one
      # out of a script, see docs/decisions/routeros-ingest-spike.md)
      # all reach it with content nothing has validated yet, the same
      # footing the other two are on. 30s each is not a deep campaign;
      # it's a regression gate that catches a newly-introduced crash on
      # the committed corpus plus a little fresh exploration, without
      # turning every PR into a fuzzing job. Seed corpora and any
      # crashers found are committed under testdata/, so a reproducer
      # stays permanent.
      - name: Fuzz the attacker-shaped-input parsers
        run: |
          go test ./internal/routeros/ -run FuzzParse -fuzz FuzzParse -fuzztime=30s
          go test ./internal/syslog/ -run FuzzParseEnvelope -fuzz FuzzParseEnvelope -fuzztime=30s
          go test ./internal/ingest/ -run FuzzDecodePayload -fuzz FuzzDecodePayload -fuzztime=30s

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

  # Not run on dev (see the on.push/pull_request branch lists above
  # already excluding it isn't possible per-job, so this gates itself):
  # dev stays fast/light on purpose. Preview and main both get the real
  # container smoke test.
  container:
    name: Container smoke test
    if: github.base_ref != 'dev' && github.ref_name != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag mikroview:test .

      - name: Run hardened container
        run: >-
          docker run --detach --name mikroview-test
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --cap-drop ALL --security-opt no-new-privileges
          --pids-limit 64 --memory 128m --cpus 0.5
          --publish 127.0.0.1:8080:8080
          mikroview:test

      - name: Wait for healthz
        run: |
          # TLS is on by default (self-signed, generated on first start --
          # see internal/servertls) -- -k skips verification since this is
          # just confirming the server answers, not validating a cert
          # chain.
          for attempt in $(seq 1 20); do
            if curl -k --fail --silent --show-error https://127.0.0.1:8080/api/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs mikroview-test
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force mikroview-test || true

  postgres:
    name: Postgres integration (#131)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      # Not a `services:` container. internal/persist refuses any
      # connection that could fall back to plaintext (see its
      # requireTLS), so the server has to present a certificate -- and a
      # services block can't generate one or fix its permissions before
      # postgres starts. Building a one-line image is the shortest path
      # to a server that actually speaks TLS.
      - name: Start Postgres with TLS
        run: |
          mkdir -p /tmp/pgtls
          openssl req -new -x509 -days 1 -nodes -subj "/CN=localhost" \
            -keyout /tmp/pgtls/server.key -out /tmp/pgtls/server.crt
          cat > /tmp/pgtls/Dockerfile <<'EOF'
          FROM postgres:18-alpine
          COPY server.crt /certs/server.crt
          COPY server.key /certs/server.key
          RUN chown postgres:postgres /certs/server.crt /certs/server.key \
           && chmod 600 /certs/server.key && chmod 644 /certs/server.crt
          EOF
          docker build -t mv-pg-tls /tmp/pgtls
          docker run -d --name mv-pg \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mikroview -p 5432:5432 \
            mv-pg-tls -c ssl=on \
            -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key

      - name: Wait for Postgres
        run: |
          for attempt in $(seq 1 40); do
            if docker exec mv-pg pg_isready -U postgres -d mikroview >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs mv-pg
          exit 1

      # sslmode=require, not verify-full: the certificate is generated
      # above and self-signed, so there is no chain to verify. The
      # documentation recommends verify-full for real deployments; this
      # job is checking the storage logic, not certificate validation.
      - name: Integration tests
        env:
          MIKROVIEW_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/mikroview?sslmode=require
        run: go test -race -count=1 ./internal/persist/...

      - name: Clean up
        if: always()
        run: docker rm --force mv-pg || true
