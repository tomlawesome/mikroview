name: Verify and attest the GitLab-published release on GHCR

# A release is a `vX.Y.Z` tag, created on GitLab (the source of truth) and
# pushed here by sync:mirror-to-github. Since #1563 the tag's own GitLab
# pipeline also pushes the release to GHCR: GitHub's hosted runners are
# geo-blocked from the owner's GitLab, so nothing here may reach it, and
# this workflow reads only ghcr.io.
#
# Pattern, as in publish-from-gitlab.yml: push from the trusted side; the
# signed evidence travels with the digest; verify at the destination. The
# tag's GitLab pipeline builds the image once (VERSION = the tag), checks
# the tag equals v<VERSION>, tests those bytes, signs the digest with the
# fenced key and attests its SPDX SBOM; publish:ghcr
# (scripts/publish-ghcr.sh) then copies that exact digest to
# ghcr.io/tomlawesome/mikroview as `vX.Y.Z` (and `latest` when it is the
# highest vX.Y.Z tag), and signs and attests it there with the same key.
# This workflow:
#
#   1. waits, bounded, for `vX.Y.Z` to resolve on GHCR to one image manifest
#      carrying its SPDX attestation;
#   2. verifies on that GHCR digest, against the committed cosign.pub,
#      exactly one key-based signature (scripts/verify-release-signature.sh)
#      and exactly one SPDX attestation, whose predicate becomes the SBOM
#      GitHub attests;
#   3. attests provenance and that SBOM with actions/attest and verifies
#      both with `gh attestation verify`.
#
# It writes no image tag (GitLab moves `latest`), builds nothing, and
# creates no GitHub Release (there has never been one). The keyless
# countersignature is still added by hand, afterwards, with countersign.yml
# against this digest; re-running this workflow leaves it alone.
#
# If GitLab's pipeline fails, the wait times out and nothing is attested.
# Re-run from the Actions tab once GitLab's publish:ghcr is green.
#
# Secrets: none beyond the built-in GITHUB_TOKEN.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-on-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/tomlawesome/mikroview
  # GitLab publishes the image a while after the mirror push lands.
  WAIT_MINUTES: "120"
  # The tag reaches every run: step through this variable, never inline as
  # ${{ github.ref_name }} (semgrep run-shell-injection).
  VERSION: ${{ github.ref_name }}

jobs:
  verify:
    name: Wait for the signed release digest on GHCR and verify it
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.wait.outputs.digest }}
      tag: ${{ steps.wait.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR (read)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # publish:ghcr writes the tag first and the attestation last, so the
      # tag alone is not "published": wait until the attestation is there
      # too. Each probe is read-only.
      - name: Wait for the version tag and its attestation on GHCR
        id: wait
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not a vX.Y.Z release tag -- refusing"
            exit 1
          fi
          ref="${IMAGE}:${VERSION}"
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            if manifest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' 2>/dev/null)"; then
              digest="$(jq -r '.digest' <<< "${manifest}")"
              media="$(jq -r '.mediaType' <<< "${manifest}")"
              case "${media}" in
                application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json) ;;
                *) echo "::error::${ref} is ${media}, not one image manifest -- refusing"; exit 1 ;;
              esac
              if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] &&
                 cosign verify-attestation --key cosign.pub --type spdxjson "${IMAGE}@${digest}" > /dev/null 2>&1; then
                break
              fi
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::${ref} did not resolve to a signed, attested digest within ${WAIT_MINUTES} minutes -- check GitLab's publish:ghcr job, then re-run"
              exit 1
            fi
            sleep 30
          done
          echo "${ref} resolves to ${digest}"
          printf 'digest=%s\ntag=%s\n' "${digest}" "${VERSION}" >> "${GITHUB_OUTPUT}"

      # The cryptographic check, on the GHCR digest itself: exactly one
      # key-based signature and exactly one SPDX attestation must verify
      # with the committed cosign.pub, or nothing is attested. The SBOM
      # GitHub attests is that attestation's predicate.
      - name: Verify GitLab's signature and SBOM attestation on GHCR
        env:
          DIGEST: ${{ steps.wait.outputs.digest }}
        run: |
          scripts/verify-release-signature.sh "ghcr.io/tomlawesome/mikroview@${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" > signature-verification.json
          cosign verify-attestation --key cosign.pub --type spdxjson "${IMAGE}@${DIGEST}" > attestations.jsonl
          count="$(grep -c . attestations.jsonl)"
          if [ "${count}" != 1 ]; then
            echo "::error::expected exactly one verified SPDX attestation on ${IMAGE}@${DIGEST}, found ${count}"
            exit 1
          fi
          jq -r '.payload' attestations.jsonl | base64 -d | jq -e '.predicate | select(type == "object" and has("spdxVersion"))' > image.spdx.json

      - name: Upload verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikroview-release-ghcr-evidence
          path: |
            image.spdx.json
            signature-verification.json
            attestations.jsonl
          if-no-files-found: warn
          retention-days: 90

  attest:
    name: Attest the GHCR release digest
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the verified SBOM from the verify job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mikroview-release-ghcr-evidence

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tomlawesome/mikroview
          subject-digest: ${{ needs.verify.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest published image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tomlawesome/mikroview
          subject-digest: ${{ needs.verify.outputs.digest }}
          sbom-path: image.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify published image attestations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: |
          ref="oci://ghcr.io/tomlawesome/mikroview@${DIGEST}"
          gh attestation verify "${ref}" --repo "${GITHUB_REPOSITORY}" \
            --format json > provenance-verification.json
          gh attestation verify "${ref}" --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --format json > sbom-verification.json

      - name: Upload publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mikroview-release-attested-on-ghcr
          path: |
            image.spdx.json
            provenance-verification.json
            sbom-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record the attested release
        env:
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: |
          # Read only: report where GitLab left latest.
          latest="$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ "${latest}" = "${DIGEST}" ]; then latest_note="latest points here"; else latest_note="latest is ${latest:-unknown}"; fi
          {
            printf '## mikroview %s, published by GitLab\n\n' "${VERSION}"
            printf -- '- Image: `ghcr.io/tomlawesome/mikroview`\n'
            printf -- '- Tag: `%s` (%s)\n' "${VERSION}" "${latest_note}"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf '\nNo container was built or tagged here. Countersign this digest with countersign.yml.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
