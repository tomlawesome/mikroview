# SPDX-License-Identifier: AGPL-3.0-only
name: Secret scan

# GitHub's free tier gives this public repository secret scanning and push
# protection for PARTNER patterns only: credential formats a provider has
# registered with GitHub. Non-provider patterns and validity checks belong to
# the paid Secret Protection add-on and read `disabled` here -- the API accepts
# a PATCH enabling them and silently leaves them off (#758).
#
# That leaves generic secrets -- private keys, connection strings, bespoke
# application tokens -- with no server-side detection at all. This host runs a
# gitleaks pre-commit gate which covers that class, but only for commits made
# on this host, while the hook is installed and not bypassed. Nothing covered a
# commit that arrived any other way.
#
# This job closes that gap for anything reaching the remote. It DETECTS rather
# than prevents: push protection is still the only control that stops a secret
# landing. Treat a failure here as "rotate the credential", not merely "amend
# the commit".
#
# The GitLab lane's own gitleaks job (.gitlab-ci.yml) is not a substitute: that
# cutover has never gone live, and AGENTS.md is explicit that the lane gates
# nothing yet.

on:
  push:
    branches: [main, preview, dev]
  pull_request:
    branches: [main, preview, dev]
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  # Only a superseded pull-request run is cancelled. A push must never cancel
  # an already-merged SHA's evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      # gitleaks itself is MIT. The gitleaks/gitleaks-action wrapper is not --
      # GitHub reports NOASSERTION and it is commercially licensed for
      # organisations. Installing the released binary keeps this on the MIT
      # tool and adds no third-party action to pin and review.
      #
      # 8.30.1 is the current release (checked 2026-09-03). The checksum was
      # verified independently against the published tarball rather than
      # copied from the sibling repository that first carried this job.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. The point of this job is catching a secret that
          # reached the remote in an earlier commit and is no longer in the
          # working tree, which a filesystem scan cannot see. Scanning is
          # cheap -- mikroview's 941 commits take under four seconds -- so
          # there is no reason to reach for a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          chmod +x "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Report gitleaks version
        run: gitleaks version

      - name: Scan full history for secrets
        # --redact keeps any finding out of this public repository's build log:
        # the log names the file, the rule and the commit, never the value.
        # Without it a failure would republish the secret it just found.
        run: gitleaks git --redact --no-banner --log-level error .
