# Values the shared private-details check (ai/agent-infra#32) allows on
# purpose, each for the named rules only. Never list commits here.
#
# The hook accepts only description, targetRules and paths (SPEC.md section 5
# in agent-infra's private-details scripts; #1550). paths are Go regexes
# searched in the repo-relative file path, and an entry turns its rules off for
# the whole of each file it matches, whatever the value. So each entry lists
# the exact files that hold such values, anchored, never a folder or a suffix:
# a new file with an address is caught until it is added here on purpose.
# scripts/private-details-allow.test.sh checks this file with the hook's own
# shape check (lint:script-tests).

[[allowlists]]
