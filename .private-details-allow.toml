# Values the shared private-details check (ai/agent-infra#32) allows on
# purpose, each for the named rules only. Never list commits here.

[[allowlists]]
description = "the drop-list's test range: it refuses every reserved and documentation range by design, so its tests need an ordinary public /24 (see internal/droplist/validate_test.go)"
targetRules = ["ip-address"]
regexTarget = "match"
regexes = ['''^203\.0\.114\.[0-9]{1,3}$''']

[[allowlists]]
description = "multicast group addresses (224.0.0.0/4), such as mDNS's 224.0.0.251: protocol constants, the same on every network"
targetRules = ["ip-address"]
regexTarget = "match"
regexes = ['''^2(2[4-9]|3[0-9])\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$''']

[[allowlists]]
description = "private (RFC 1918 and shared) addresses in tests, fixtures and demo data: they model a home network, and the product treats private and public addresses differently (#1456)"
targetRules = ["ip-address"]
condition = "AND"
regexTarget = "match"
regexes = [
    '''^10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^192\.168\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
]
paths = [
    '''_test\.go$''',
    '''\.test\.ts$''',
    '''\.test\.mjs$''',
    '''(?:^|/)testdata/''',
    '''^frontend/src/.*fixture[^/]*$''',
    '''^cmd/demo-history/''',
    '''^scripts/seed-demo\.py$''',
    # live scenarios, and the scripts that build the virtual router's network
    '''^frontend/scripts/live-[^/]+\.mjs$''',
    '''^scripts/live-(?:blocklist-chr|container|env|routeros|rule-coverage-probe)\.sh$''',
    '''^scripts/live-rule-coverage-check\.py$''',
]
