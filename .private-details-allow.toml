# Values the shared private-details check (ai/agent-infra#32) allows on
# purpose, each for the named rules only. Never list commits here.

[[allowlists]]
description = "the drop-list's test range: it refuses every reserved and documentation range by design, so its tests need an ordinary public /24 (see internal/droplist/validate_test.go)"
targetRules = ["ip-address"]
regexTarget = "match"
regexes = ['''^203\.0\.114\.[0-9]{1,3}$''']

[[allowlists]]
description = "multicast group addresses (224.0.0.0/4), such as mDNS's 224.0.0.251: protocol constants, the same on every network"
targetRules = ["ip-address"]
regexTarget = "match"
regexes = ['''^2(2[4-9]|3[0-9])\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$''']

[[allowlists]]
description = "private (RFC 1918 and shared) addresses in tests, fixtures and demo data: they model a home network, and the product treats private and public addresses differently (#1456)"
targetRules = ["ip-address"]
condition = "AND"
regexTarget = "match"
regexes = [
    '''^10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^192\.168\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
]
paths = [
    '''_test\.go$''',
    '''\.test\.ts$''',
    '''\.test\.mjs$''',
    '''(?:^|/)testdata/''',
    '''^frontend/src/.*fixture[^/]*$''',
    '''^cmd/demo-history/''',
    '''^scripts/seed-demo\.py$''',
    # live scenarios, and the scripts that build the virtual router's network
    '''^frontend/scripts/live-[^/]+\.mjs$''',
    '''^scripts/live-(?:blocklist-chr|container|env|routeros|rule-coverage-probe)\.sh$''',
    '''^scripts/live-rule-coverage-check\.py$''',
]

[[allowlists]]
description = "reserved special-use ranges and the CGNAT range base (link-local 169.254/16, 192.0.0.0/24, benchmarking 198.18/15, reserved 240/4, 100.64.0.0): range definitions and range-boundary values, in code and docs alike (#1456)"
targetRules = ["ip-address"]
regexTarget = "match"
regexes = [
    '''^169\.254\.''',
    '''^192\.0\.0\.''',
    '''^198\.1[89]\.''',
    '''^24[0-9]\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$''',
    '''^100\.64\.0\.0$''',
]

[[allowlists]]
description = "IPv6 addresses in tests: unique-local, link-local, boundary and published-prefix values that model a network or sit just outside a reserved range (#1456)"
targetRules = ["ipv6-address"]
paths = [
    '''_test\.go$''',
    '''\.test\.ts$''',
]

[[allowlists]]
description = "captured RouterOS records: kept as recorded (owner, 2026-11-13, #1456)"
targetRules = ["ip-address"]
paths = ['''^docs/routeros-verification-logs/''']

[[allowlists]]
description = "private and CGNAT addresses used as generic examples in docs, example config, comments and demo or capture scripts, listed by file: they model a network, are the usual vendor defaults, and none is a real machine (#1456)"
targetRules = ["ip-address"]
condition = "AND"
regexTarget = "match"
regexes = [
    '''^10\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
    '''^192\.168\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''',
]
paths = [
    '''^CHANGELOG\.md$''',
    '''^deploy/config\.example\.yaml$''',
    '''^deploy/docker-compose\.yml$''',
    '''^docs/configuration\.md$''',
    '''^docs/decisions/routeros-ingest-spike\.md$''',
    '''^docs/design/screens/blocklist/round-2/builder\.html$''',
    '''^docs/design/screens/blocklist/round-2/catalogue\.md$''',
    '''^docs/development\.md$''',
    '''^docs/flakes\.md$''',
    '''^docs/install\.md$''',
    '''^docs/routeros-setup\.md$''',
    '''^frontend/scripts/capture-ingest-loss-drawer-screenshots\.mjs$''',
    '''^frontend/scripts/capture-routeros-setup-screenshots\.mjs$''',
    '''^frontend/src/components/EngineRoomWatchers\.svelte$''',
    '''^frontend/src/components/Topography\.svelte$''',
    '''^frontend/src/lib/city/project\.ts$''',
    '''^frontend/src/lib/conditionTokens\.ts$''',
    '''^frontend/src/lib/detectorCopy\.ts$''',
    '''^frontend/src/lib/serving\.ts$''',
    '''^frontend/src/lib/types\.ts$''',
    '''^frontend/src/lib/wizard\.svelte\.ts$''',
    '''^internal/api/decommission\.go$''',
    '''^internal/blcatalogue/catalogue\.go$''',
    '''^internal/config/config\.go$''',
    '''^internal/config/validate\.go$''',
    '''^internal/engine/decommission_coverage\.go$''',
    '''^internal/geoip/fetch\.go$''',
    '''^internal/ingest/matchspec\.go$''',
    '''^internal/ingest/payload\.go$''',
    '''^internal/matchlog/matchlog\.go$''',
    '''^internal/netclass/parse\.go$''',
    '''^internal/oui/fetch\.go$''',
    '''^internal/routeros/blocklist_loader\.go$''',
    '''^internal/routeros/parser\.go$''',
    '''^internal/routerstate/routerstate\.go$''',
    '''^internal/watchlist/invert\.go$''',
    '''^scripts/record-upgrade-fixture\.test\.sh$''',
    '''^scripts/upgrade-fixture-session\.py$''',
    '''^tools/screenshots/gen_traffic\.py$''',
]

[[allowlists]]
description = "well-known public service addresses (public DNS resolvers and the like) and published or range-boundary prefixes that the netclass, droplist, geoip, oui, blocklist and similar tests need as ordinary public addresses, because their code treats the RFC 5737 ranges as reserved; plus one string-concatenation false positive (#1456)"
targetRules = ["ip-address"]
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:1\.10\.16\.0|1\.19\.0\.0|1\.32\.128\.0|9\.255\.255\.255|9\.0\.0\.0|9\.0\.0\.1|7\.0\.0\.0|2\.0\.0\.0|1\.0\.0\.0|1\.2\.3\.0|1\.2\.3\.4|5\.6\.7\.1|34\.80\.0\.0|34\.80\.0\.1|34\.80\.1\.1|172\.224\.226\.0|172\.224\.226\.5|13\.34\.37\.64|146\.75\.253\.246|3\.5\.140\.0|172\.32\.4\.4|172\.0\.0\.0|8\.0\.0\.0|8\.8\.8\.0|203\.0\.0\.0|203\.0\.1\.244|203\.0\.115\.0|203\.0\.116\.0|198\.51\.101\.0|192\.0\.1\.0|192\.0\.3\.7|192\.0\.3\.255|110\.40\.0\.10|1\.1\.1\.1|8\.8\.8\.8|8\.8\.4\.4|9\.9\.9\.9)$''']
paths = [
    '''_test\.go$''',
    '''\.test\.ts$''',
    '''^frontend/src/components/Entities\.svelte$''',
    '''^scripts/live-blocklist-chr\.sh$''',
    '''^internal/persist/migrations/0002_match_log\.sql$''',
    '''^internal/blocklist/parse\.go$''',
    '''^internal/blcatalogue/catalogue\.go$''',
]

[[allowlists]]
description = "well-known public service addresses in the screenshot traffic generator (a public resolver, a code host, a search engine)"
targetRules = ["ip-address"]
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:1\.1\.1\.1|8\.8\.8\.8|142\.250\.187\.14|185\.199\.108\.153)$''']
paths = ['''^tools/screenshots/gen_traffic\.py$''']

[[allowlists]]
description = "screenshot pixels that happen to look like an address: binary images, not text (#1456)"
targetRules = ["email-address"]
paths = ['''\.png$''']

[[allowlists]]
description = "placeholders and third-party licence metadata, not personal addresses: a password-placeholder DSN, a deliberate look-alike domain in the allow-list bypass examples, the CI bot's no-reply address, and package authors' addresses in generated notices and the lockfile (#1456)"
targetRules = ["email-address"]
condition = "AND"
regexTarget = "match"
regexes = ['''^(?:PASSWORD@db\.internal|attacker@notexample\.com|mikroview-bot@noreply\.gitlab\.tomlawson\.io|oschwald@gmail\.com|luke\.edwards05@gmail\.com|self@wyattbaldwin\.com|i@izs\.me)$''']
paths = [
    '''^deploy/docker-compose\.yml$''',
    '''^docs/configuration\.md$''',
    '''^SECURITY\.md$''',
    '''^\.gitlab-ci\.yml$''',
    '''^THIRD-PARTY-NOTICES\.md$''',
    '''^frontend/package-lock\.json$''',
]
